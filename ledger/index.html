/**
 * What a single category is actually made of, for one month.
 *
 * Entries carrying the same note are one line — three trips to the same
 * restaurant read as one restaurant — and the subscriptions or housing charges
 * that belong to the category join them as their own lines. Slices are shaded
 * by size on a single hue rather than given identities of their own, so the
 * ring says how big, and the list says what.
 */
function categoryParts(mk, cat) {
  const bag = new Map();
  const add = (key, label, amount, fixed) => {
    const k = key.toLowerCase();
    const cur = bag.get(k) || { label, amount: 0, count: 0, fixed };
    cur.amount += amount; cur.count += 1;
    bag.set(k, cur);
  };
  for (const t of txOf(mk)) {
    if (t.t !== 'exp' || t.c !== cat) continue;
    const note = (t.n || '').trim();
    add(note || '\u0000unlabelled', note || 'Unlabelled', Number(t.a) || 0, false);
  }
  for (const it of state.recurring) {
    if (it.kind === 'income' || it.category !== cat || !activeIn(it, mk)) continue;
    add('\u0001' + it.name, it.name, monthlyEq(it, mk), true);
  }
  const parts = [...bag.values()].sort((a, b) => b.amount - a.amount);
  const total = parts.reduce((a, x) => a + x.amount, 0);
  if (parts.length > 8) {
    const tail = parts.splice(7);
    parts.push({ label: `${tail.length} smaller items`, amount: tail.reduce((a, x) => a + x.amount, 0),
                 count: tail.reduce((a, x) => a + x.count, 0), fixed: false, tail: true });
  }
  return { parts, total };
}
function donut(parts, total) {
  const S = 190, R = 78, r = 47, C = S / 2;
  if (total <= 0) return '';
  const pt = (ang, rad) => [C + rad * Math.cos(ang - Math.PI / 2), C + rad * Math.sin(ang - Math.PI / 2)];
  let a0 = 0, out = '';
  parts.forEach((p, i) => {
    const frac = p.amount / total;
    let a1 = a0 + frac * Math.PI * 2;
    const gap = parts.length > 1 ? Math.min(0.02, frac * Math.PI) : 0;
    const s = a0 + gap / 2, e = Math.max(s + 0.001, a1 - gap / 2);
    const big = (e - s) > Math.PI ? 1 : 0;
    const [x1, y1] = pt(s, R), [x2, y2] = pt(e, R), [x3, y3] = pt(e, r), [x4, y4] = pt(s, r);
    out += `<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}
      L${x3.toFixed(2)} ${y3.toFixed(2)} A${r} ${r} 0 ${big} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z"
      style="fill:var(--r${Math.min(i, 6)})"><title>${esc(p.label)} — ${fmt(p.amount, true)}</title></path>`;
    a0 = a1;
  });
  return `<svg class="donut" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img"
    aria-label="Breakdown by item, largest first">${out}
    <text x="${C}" y="${C - 4}" text-anchor="middle" font-size="21" font-weight="600"
      style="fill:var(--ink);font-family:var(--mono)" letter-spacing="-1">${fmt(total)}</text>
    <text x="${C}" y="${C + 14}" text-anchor="middle" font-size="9.5"
      style="fill:var(--ink-3);font-family:var(--mono);letter-spacing:.09em">IN THE MONTH</text></svg>`;
}
function sheetCategory(mk, cat) {
  const build = () => {
    const { parts, total } = categoryParts(mk, cat);
    return { html: `
      <div class="sheet-hd"><h2>${esc(CATNAME[cat] || cat)}</h2>${closeIcon}</div>
      <div class="sheet-bd">
        <span class="eyebrow">${monthLabel(mk)}</span>
        ${total > 0 ? donut(parts, total) : '<p class="hint" style="text-align:center;padding:26px 0">Nothing in this category this month.</p>'}
        ${total > 0 ? `<div>${parts.map((p, i) => `<div class="slicerow">
            <i style="background:var(--r${Math.min(i, 6)})"></i>
            <span class="nm2">${esc(p.label)}${p.count > 1 || p.fixed ? `<span>${[
              p.count > 1 ? `${p.count} entries added together` : '',
              p.fixed ? 'a fixed commitment' : '',
            ].filter(Boolean).join(' · ')}</span>` : ''}</span>
            <span class="amt2">${fmt(p.amount, true)}</span>
            <span class="pct">${Math.round(p.amount / total * 100)}%</span>
          </div>`).join('')}</div>` : ''}
        ${total > 0 ? `<p class="hint">Entries sharing a note are counted as one line. Rename an entry and it will join or leave a group.</p>` : ''}
      </div>` };
  };
  openSheet(build().html, null);
}

function recurringTable(kind, mk) {
  const items = subsOf(kind)
    .map(i => ({ ...i, m: monthlyEq(i, mk), on: activeIn(i, mk) }))
    .sort((a, b) => (b.on - a.on) || (b.m - a.m));
  if (!items.length) return null;
  return `<div class="scroller"><table class="tbl">
    <thead><tr>
      <th>${kind === 'sub' ? 'Service' : kind === 'income' ? 'Source' : 'Item'}</th><th>Category</th><th class="r">Billed</th>
      <th class="r">Per month</th><th class="r">Per year</th><th>${kind === 'income' ? 'Receiving since' : 'Paying since'}</th><th></th>
    </tr></thead><tbody>
    ${items.map(i => {
      const months = i.since ? Math.max(0, monthsBetween(i.since, i.status === 'active' ? THIS_MONTH : (i.ended || THIS_MONTH))) : null;
      return `<tr style="${i.on ? '' : 'opacity:.5'}">
        <td><b style="font-weight:500">${esc(i.name)}</b>${i.on ? '' : ' <span class="chip off">ended</span>'}${

        <td class="r num" style="color:var(--ink-3)">${hasSchedule(i)
          ? `<span class="chip">varies</span>`
          : `${fmt(i.amount, i.amount % 1 !== 0)}<span style="font-size:11px"> /${i.basis === 'yearly' ? 'yr' : 'mo'}</span>`}</td>
        <td class="r num" style="font-weight:500">${fmt(i.m, true)}</td>

          ? `<span class="num" style="font-size:12px">${monthLabel(i.since, true)}</span> <span style="color:var(--ink-3);font-size:11.5px">· ${humanDuration(months)}${

/** How long ago, in the rough units people actually use. */
function timeAgo(iso8601) {
  const then = new Date(iso8601), mins = Math.round((Date.now() - then) / 60000);
  if (mins < 60) return mins <= 1 ? 'just now' : `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

function viewReport() {
  const thisWeek = startOfWeek(TODAY);
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const ws = addDays(thisWeek, -7 * i);
    weeks.push({ ws, v: variableBetween(ws, addDays(ws, 6)) });
  }
  const cur = weeks[11].v, prev = weeks[10].v;
  const avg4 = weeks.slice(7, 11).reduce((a, w) => a + w.v, 0) / 4;
  const ch = chartWeeks(weeks);

  // month-to-date pace vs the same window last month
  const dom = TODAY.getDate();
  const mStart = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  const mtd = variableBetween(mStart, TODAY);
  const pm = addMonths(THIS_MONTH, -1);
  const [py, pmo] = pm.split('-').map(Number);
  const pDaysInMonth = new Date(py, pmo, 0).getDate();
  const pEndDay = Math.min(dom, pDaysInMonth);
  const prevMtd = variableBetween(new Date(py, pmo - 1, 1), new Date(py, pmo - 1, pEndDay));
  const paceDiff = mtd - prevMtd;
  const better = paceDiff < 0;

  const f = forecast();
  const fcPanel = !f.ready
    ? `<section class="panel">
        <div class="panel-hd"><h2>Month-end forecast</h2><span class="sub">not enough history yet</span></div>
        <div class="empty"><h3>Forecasts unlock after your first full month</h3>
          <p>Once there's a month of logged entries behind you, this shows where ${MONTHS[TODAY.getMonth()]} is heading — a calm case, a likely case and a busy case — plus what you can spend per day to stay off the reserve.</p>
          <p style="color:var(--ink-2)"><b class="num">${f.st.ordinaryCount}</b> ordinary expenses logged · day <b class="num">${f.day}</b> of ${f.dim}</p></div>
      </section>`
    : `<section class="panel">
        <div class="panel-hd"><h2>Where ${MONTHS[TODAY.getMonth()]} is heading</h2><span class="sub">${f.left} ${f.left === 1 ? 'day' : 'days'} left · from your own spending pace</span></div>
        <div style="padding:20px 22px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)">
          <span class="eyebrow">Daily allowance to stay off the reserve</span>
          <span class="hero-fig ${f.allowance > 0 ? 'pos' : 'neg'}" style="font-size:clamp(30px,5.4vw,40px)">${f.allowance > 0 ? fmt(f.allowance, true) : fmt(0)}<span style="font-size:.4em;font-weight:500;color:var(--ink-3);letter-spacing:0"> / day</span></span>
          <p class="hero-note">${f.allowance > 0
            ? `Spend under this for the remaining ${f.left} ${f.left === 1 ? 'day' : 'days'} and ${MONTHS[TODAY.getMonth()]} stays inside the ${fmt(f.capacity)} your income covers.`
            : `${MONTHS[TODAY.getMonth()]} has already passed the ${fmt(f.capacity)} your income covers. Anything more comes out of the reserve.`}</p>
        </div>
        <div class="cmpgrid">
          ${f.scen.map(x => `<div class="cmpcell">
            <span class="eyebrow">${x.name}${x.key === 'base' ? ' · likeliest' : ''}</span>
            <b style="color:var(--${x.key === 'base' ? 'ink' : x.key === 'opt' ? 'pos' : 'neg'})">${fmt(x.total)}</b>
            <span class="dl">${esc(x.note)}</span>
            <span class="dl" style="margin-top:3px">${x.draw > 0.5
              ? `<b style="color:var(--neg)">−${fmt(x.draw)}</b> from the reserve`
              : `<b style="color:var(--pos)">reserve untouched</b>`}</span>
            <span class="dl">${Math.abs(x.hp - x.hpNow) < 0.5
              ? `health holds at <b>${Math.round(x.hp).toLocaleString('en-US')} HP</b>`
              : `health <b style="color:var(--${x.hp > x.hpNow ? 'pos' : 'neg'})">${x.hp > x.hpNow ? '+' : ''}${Math.round(x.hp - x.hpNow).toLocaleString('en-US')}</b> → ${Math.round(x.hp).toLocaleString('en-US')} HP`}</span>
          </div>`).join('')}
        </div>
        <div class="panel-hd" style="border-bottom:none;border-top:1px solid var(--line)">
          <span class="dl">Projected from ${fmt(f.st.variable)} ordinary spending over ${f.day} ${f.day === 1 ? 'day' : 'days'}, plus ${fmt(f.st.fixed)} fixed and ${fmt(f.st.extraordinary)} extraordinary already logged. One-off costs do not set the pace or reduce Health Points.</span>
        </div>
      </section>`;

  const sNow = monthStats(THIS_MONTH), sPrev = monthStats(pm);
  const hist = recentMonths(6, THIS_MONTH).map(k => ({ k, s: monthStats(k) })).reverse();

  const verdict = Math.abs(paceDiff) < 1
    ? `Through day ${dom}, you are spending at <b>exactly the pace</b> of ${monthLabel(pm, true)}.`
    : `Through day ${dom} you've spent <b class="${better ? 'pos' : 'neg'}">${fmt(Math.abs(paceDiff))} ${better ? 'less' : 'more'}</b> than you had by this point in ${monthLabel(pm, true)}.`;

  return { html: `
    <section class="panel" style="padding:22px 24px">
      <span class="eyebrow">Ordinary spending · week of ${weekLabel(thisWeek)} · live</span>
      <p class="verdict" style="margin:10px 0 0">${verdict}<br><em>${cur > avg4 * 1.15 ? 'This week is running hot against your four-week average.' : cur < avg4 * 0.85 ? 'This week is running below your four-week average.' : 'This week is tracking close to your four-week average.'} Extraordinary costs stay in the real totals below.</em></p>

    ${schedulePanel()}

    ${fcPanel}

    <section class="panel" style="overflow:hidden">

/* ============================ sheets ============================ */
const scrim = () => $('#scrim'), sheetEl = () => $('#sheet');
let lastFocus = null;

/* Where the last click landed, in document coordinates. Capture phase, so it is
   always recorded before any handler that opens a sheet. */
let lastClickY = 0;
document.addEventListener('click', (e) => {
  if (e.clientY) lastClickY = e.clientY + window.scrollY;
}, true);

/* Some hosts render this page in a frame sized to the full content height. The
   frame's viewport is then taller than the physical screen, `position: fixed`
   anchors to that oversized viewport, and an overlay opens far below whatever
   the reader can actually see — the button looks dead. A viewport taller than
   the screen is only possible in that situation, so it is a reliable test.
   In that case the overlay is positioned in the document instead, next to the
   control that opened it, which is by definition on screen. */
const framedTall = () => window.innerHeight > ((window.screen && window.screen.height) || 1200) + 60;

function placeSheet() {
  const sc = scrim(), sh = sheetEl();
  if (framedTall()) {
    const visible = Math.min(640, Math.round(((window.screen && window.screen.height) || 900) * 0.8));
    sc.style.position = 'absolute';
    sc.style.height = document.documentElement.scrollHeight + 'px';
    sc.style.alignItems = 'flex-start';
    sh.style.marginTop = Math.max(8, Math.round(lastClickY - visible * 0.35)) + 'px';
    sh.style.maxHeight = visible + 'px';
  } else {
    sc.style.position = sc.style.height = sc.style.alignItems = '';
    sh.style.marginTop = sh.style.maxHeight = '';
  }
}
let openAttach = null;
function openSheet(html, wire) {
  lastFocus = document.activeElement;
  sheetEl().innerHTML = html;
  scrim().classList.add('on');
  document.body.style.overflow = 'hidden';
  wire && wire(sheetEl());
  // Some hosts size this page's frame to its full content height, which leaves
  // `position: fixed` anchored to a viewport taller than the screen — the sheet
  // then opens off-screen and the button looks dead. scrollIntoView reaches
  // through the frame and brings it back into view; it is a no-op when fixed
  // positioning already did the right thing.
  placeSheet();
  const f = $('[data-autofocus]', sheetEl());
  if (f) setTimeout(() => f.focus(), 80);
}
/**
 * The attachments field, shared by the entry and commitment sheets.
 * Returns a controller: `docs` is the live list to save, `cleanup(saved)`
 * settles the assets — assets added and then abandoned are removed, and
 * assets removed from a saved record are removed too.
 */
function attachField(root, initial, hint) {
  const docs = (initial || []).map(d => ({ ...d }));
  const ctl = { docs, cleanup: () => {} };
  const added = [], dropped = [];
  const wrap = $('#docwrap', root);
  if (!wrap) return ctl;
  if (!ASSETS) { wrap.hidden = true; return ctl; }

  const list = $('#doclist', root), btn = $('#docadd', root), input = $('#docfile', root);
  const draw = () => {
    list.innerHTML = docs.map(d => `<div class="docrow">
      <button type="button" class="docthumb" data-docview="${d.id}" title="View ${esc(d.name)}">
        ${d.type && d.type.startsWith('image/') ? `<img src="${assetUrl(d.id)}" alt="">` : ICON_PDF}
      </button>
      <span class="docmeta"><b>${esc(d.name)}</b><span>${d.type === 'application/pdf' ? 'PDF' : 'Image'} · ${fileSize(d.size || 0)}</span></span>
      <button type="button" class="iconbtn" data-docrm="${d.id}" aria-label="Remove ${esc(d.name)}">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M8 7l1 13h6l1-13"/></svg></button>
    </div>`).join('');
  };
  draw();

  list.addEventListener('click', (e) => {
    const v = e.target.closest('[data-docview]');
    if (v) {
      const doc = docs.find(d => d.id === v.dataset.docview);
      if (doc) openDocViewer(root, doc);
      return;
    }
    const b = e.target.closest('[data-docrm]');
    if (!b) return;
    const id = b.dataset.docrm, i = docs.findIndex(d => d.id === id);
    if (i < 0) return;
    docs.splice(i, 1);
    (added.includes(id) ? added : dropped).push(id);
    if (added.includes(id)) added.splice(added.indexOf(id), 1);
    draw();
  });

  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const files = [...input.files];
    input.value = '';
    if (!files.length) return;
    btn.disabled = true;
    const label = btn.innerHTML;
    for (let i = 0; i < files.length; i++) {
      btn.textContent = files.length > 1 ? `Attaching ${i + 1} of ${files.length}…` : 'Attaching…';
      try {
        const { blob, type, name } = await prepareFile(files[i]);
        const res = await ASSETS.upload(blob, { type });
        docs.push({ id: res.id, name, type: res.contentType, size: res.sizeBytes });
        added.push(res.id);
        sheetError(root, '');
        draw();
      } catch (err) {
        sheetError(root, assetMessage(err && err.code, files[i].name));
      }
    }
    btn.disabled = false; btn.innerHTML = label;
  });

  /** saved=true destroys what was removed; saved=false unwinds what was added. */
  ctl.cleanup = (saved) => {
    (saved ? dropped : added).forEach(id => {
      try { ASSETS.delete(id).catch(() => {}); } catch (e) {}
    });
    added.length = 0; dropped.length = 0;
    if (openAttach === ctl) openAttach = null;
  };
  openAttach = ctl;
  return ctl;
}
const docsFieldHTML = (hint) => `

function closeSheet() {
  if (openAttach) { try { openAttach.cleanup(false); } catch (e) {} openAttach = null; }

      const out = {}, bad = [];
      for (const raw of String(text || '').split('\n')) {
        const line = raw.trim();
        if (!line) continue;
        const m = /^(\d{4})[-/ ]?(\d{1,2})\s*[:=\s]\s*€?\s*(-?[\d .,]+)$/.exec(line);
        const v = m ? parseFloat(m[3].replace(/[\s.](?=\d{3}\b)/g, '').replace(',', '.')) : NaN;
        if (!m || !isFinite(v) || Number(m[2]) < 1 || Number(m[2]) > 12) { bad.push(line); continue; }
        out[`${m[1]}-${String(Number(m[2])).padStart(2, '0')}`] = Math.abs(Math.round(v * 100) / 100);
      }
      return { out, bad };
    };
    const varies = $('#r-varies', root), schedBox = $('#r-sched', root);
    const schedInfo = () => {
      const { out, bad } = parseSched(schedBox.value);
      const keys = Object.keys(out).sort();
      const el = $('#r-schedinfo', root);
      if (bad.length) {
        el.innerHTML = `<span style="color:var(--neg)">Could not read ${bad.length} line${bad.length === 1 ? '' : 's'}</span> — each needs a month and an amount, like <b class="num">2026-10  1301.87</b>.`;
        return;
      }
      if (!keys.length) { el.textContent = "One month per line: the month, then the amount. Months you don't list fall back to the amount above."; return; }
      const sum = keys.reduce((a, k) => a + out[k], 0);
      const next = keys.find(k => k >= THIS_MONTH) || keys[keys.length - 1];
      el.innerHTML = `<b class="num">${keys.length}</b> months scheduled, ${monthLabel(keys[0], true)} to ${monthLabel(keys[keys.length - 1], true)} · total <b class="num">${fmt(sum)}</b> · ${
        next >= THIS_MONTH ? `${monthLabel(next, true)}: <b class="num">${fmt(out[next], true)}</b>` : 'all in the past'}.`;
    };
    varies.addEventListener('change', () => {
      $('#r-schedwrap', root).hidden = !varies.checked;
      if (varies.checked) schedBox.focus();
    });
    schedBox.addEventListener('input', schedInfo); schedInfo();
    $('#r-basis', root).addEventListener('click', e => {
      const b = e.target.closest('[data-b]'); if (!b) return;
      basis = b.dataset.b;
      $$('#r-basis [data-b]', root).forEach(x => x.setAttribute('aria-pressed', x.dataset.b === basis));
      conv();
    });
    const syncStatus = () => { $('#r-endwrap', root).hidden = status === 'active'; };
    $('#r-status', root).addEventListener('click', e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      status = b.dataset.s;
      $$('#r-status [data-s]', root).forEach(x => x.setAttribute('aria-pressed', x.dataset.s === status));
      syncStatus();
    });
    syncStatus();
    $('#r-save', root).addEventListener('click', () => { try {
      const name = $('#r-name', root).value.trim();
      const rawAmt = $('#r-amt', root).value.replace(/[\s€]/g, '').replace(',', '.');
      const amt = Math.abs(parseFloat(rawAmt));
      if (!name) {
        sheetError(root, `Give it a name first — ${isSub ? 'the service you are paying for' : isInc ? 'where the money comes from' : 'what the cost is for'}.`, '#r-name');
        return;
      }
      const sched = varies.checked ? parseSched(schedBox.value) : { out: {}, bad: [] };
      if (sched.bad.length) {
        sheetError(root, `Line ${sched.bad.length === 1 ? '' : 's'} I could not read in the monthly amounts: "${sched.bad[0]}". Each line needs a month and an amount, like 2026-10  1301.87.`, '#r-sched');
        return;
      }
      const scheduled = Object.keys(sched.out).length;
      if (!isFinite(amt) || amt === 0) {
        // with a schedule the plain amount is only a fallback, so the first scheduled figure will do
        if (scheduled) {
          sheetError(root, '');
        } else {
          sheetError(root, rawAmt.trim() ? `"${rawAmt}" isn't an amount I can read. Try a plain number like 11.99.`
                                         : isInc ? 'Enter what comes in.' : 'Enter what it costs.', '#r-amt');
          return;
        }
      }
      sheetError(root, '');
      const fallback = isFinite(amt) && amt !== 0
        ? Math.round(amt * 100) / 100
        : sched.out[Object.keys(sched.out).sort().pop()];
      const rec = {
        id: r.id || uid(), name, amount: fallback, basis, kind: k,
        category: $('#r-cat', root).value, status,
        since: $('#r-since', root).value || '',
        ended: status === 'active' ? '' : ($('#r-ended', root).value || ''),
      };
      if (scheduled) rec.schedule = sched.out;
      if (att.docs.length) rec.docs = att.docs;
      att.cleanup(true);
      state.recurring = state.recurring.some(x => x.id === rec.id)
        ? state.recurring.map(x => (x.id === rec.id ? rec : x))
        : [...state.recurring, rec];
      persistRecurring(); closeSheet(); render();
      } catch (err) { sheetError(root, 'Could not save that: ' + (err && err.message ? err.message : err)); }
    });
    const del = $('#r-del', root);
    del && del.addEventListener('click', () => {
      (r.docs || []).forEach(d => { try { ASSETS && ASSETS.delete(d.id).catch(() => {}); } catch (e) {} });
      att.cleanup(true);
      state.recurring = state.recurring.filter(x => x.id !== r.id);
      persistRecurring(); closeSheet(); render();
    });
  });
}

/* ---------------- backup and restore ----------------
   Standing on its own the app keeps everything in this browser. That is only safe
   if the whole lot can be lifted out to a file and put back somewhere else. */
const BACKUP_KEYS = ['months', 'recurring', 'settings'];
function backupBlob() {
  const out = { app: 'expense-tracker', version: 1, savedAt: new Date().toISOString() };
  for (const k of BACKUP_KEYS) out[k] = state[k];
  return JSON.stringify(out, null, 1);
}
async function restoreBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('That file is not readable as a backup.'); }
  if (!d || typeof d !== 'object' || d.app !== 'expense-tracker')
    throw new Error('That is not an Expense Tracker backup.');
  for (const k of BACKUP_KEYS) if (d[k] !== undefined) state[k] = d[k];
  state.months = state.months || {};
  cacheLocal();
  if (DB) {
    await Promise.allSettled([
      DB.doc('config/settings').set(state.settings || {}),
      DB.doc('config/recurring').set({ items: state.recurring || [] }),
      ...Object.entries(state.months).map(([k, v]) => DB.doc('ledger/' + k).set(v)),
    ]);
  }
  render();
}
/** The phone hides the rail, so what lives there needs another way in. */
function sheetMore() {
  const item = (id, name, note) => `<button class="btn" id="${id}" style="text-align:left;padding:13px 15px">
    <b style="display:block">${name}</b><span class="dl">${note}</span></button>`;
  openSheet(`
    <div class="sheet-hd"><h2>More</h2>${closeIcon}</div>
    <div class="sheet-bd">
      ${item('more-cfg', 'Salary &amp; reserve', 'What comes in each month, and the reserve you are protecting.')}
      ${item('more-bk', 'Backup', 'Save everything to a file, or restore it from one.')}
    </div>`, (root) => {
    $('#more-cfg', root).addEventListener('click', () => { closeSheet(); sheetSettings(); });
    $('#more-bk', root).addEventListener('click', () => { closeSheet(); sheetBackup(); });
  });
}

function sheetBackup() {
  const months = Object.keys(state.months || {}).length;
  const rows = Object.values(state.months || {}).reduce((a, m) => a + ((m.items || m.rows || []).length), 0);
  openSheet(`
    <div class="sheet-hd"><h2>Backup</h2>${closeIcon}</div>
    <div class="sheet-bd">
      <p class="hint" style="margin:0">${DB
        ? 'This copy syncs, so a backup is insurance rather than a necessity.'
        : 'This copy keeps everything in this browser alone. A backup is the only way to move it, or to get it back.'}</p>
      <div class="banner"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><span>${months} month${months === 1 ? '' : 's'} of entries · ${rows} line${rows === 1 ? '' : 's'} · ${(state.recurring || []).length} subscriptions</span></div>
      <button class="btn pri" id="bk-save" style="text-align:left;padding:13px 15px">
        <b style="display:block">Save a backup</b>
        <span class="dl">One JSON file with everything in it.</span></button>
      <div class="fld" style="margin-top:4px"><label for="bk-file">Restore from a backup</label>
        <input id="bk-file" class="inp" type="file" accept="application/json,.json">
        <p class="hint">This replaces everything currently here. Save a backup first if you are not sure.</p></div>
      <p class="hint">Documents attached to an expense are not in the backup — they live in the app's own file store, which a backup file cannot carry.</p>
      <p class="hint" id="bk-msg"></p>
    </div>
    <div class="sheet-bd" style="padding-top:0"><p class="err" id="sheet-err" hidden></p></div>`, (root) => {
    $('#bk-save', root).addEventListener('click', async () => {
      await offer(`expense-tracker-${iso(new Date())}.json`, backupBlob());
    });
    $('#bk-file', root).addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        await restoreBackup(await f.text());
        $('#bk-msg', root).innerHTML = '<b class="pos">Restored.</b> Everything has been replaced.';
      } catch (err) { sheetError(root, err && err.message || String(err)); e.target.value = ''; }
    });
  });
}

function sheetSettings() {
  const c = cfg(), r = reserveState();
  openSheet(`
    <div class="sheet-hd"><h2>Salary, reserve &amp; health</h2>${closeIcon}</div>
    <div class="sheet-bd">
      <div class="fld"><label for="s-inc">What you earn in a normal month</label>
        <div class="amtwrap"><span>€</span><input id="s-inc" class="num" type="text" inputmode="decimal" value="${c.baselineIncome}" data-autofocus></div>
        <p class="hint">Spending above this comes out of the reserve. If you log more income than this in a given month, the larger figure is used for that month.</p></div>
      <div class="fld"><label for="s-sal">Salary, posted on the 1st</label>
        <div class="amtwrap"><span>€</span><input id="s-sal" class="num" type="text" inputmode="decimal" value="${c.salaryOn ? c.salary : 0}"></div>
        <p class="hint">Added to every month automatically, from the month below onwards — you never type it in. Set it to 0 to turn it off. Bonuses, grants and reimbursements you still log yourself as income.</p></div>
      <div class="fld"><label for="s-salfrom">Salary starts</label>
        <input id="s-salfrom" class="inp num" type="month" value="${c.salaryFrom || THIS_MONTH}"></div>
      <div class="fld"><label for="s-res">Reserve you can mobilise</label>
        <div class="amtwrap"><span>€</span><input id="s-res" class="num" type="text" inputmode="decimal" value="${c.reserveStart}"></div></div>
      <div class="fld"><label for="s-hp">Health points at full</label>
        <input id="s-hp" class="inp num" type="text" inputmode="decimal" value="${c.hpMax}">
        <p class="hint">One point per euro. Spend past what your income covers and you lose points; come in under and you heal back, never above full.</p></div>
      <div class="fld"><label>Shipwrighting</label>
        <div class="seg" id="s-ship">
          <button data-h="0" aria-pressed="${!c.hpIgnoreShip}">Costs health</button>
          <button data-h="1" aria-pressed="${!!c.hpIgnoreShip}">Free of charge</button>
        </div>
        <p class="hint">Either way it still draws on the reserve — this only decides whether your passion also costs you points.</p></div>
      <div class="fld"><label for="s-from">Start counting from</label>
        <input id="s-from" class="inp num" type="month" value="${c.reserveAsOf}" max="${THIS_MONTH}">
        <p class="hint">Months before this one never touch the reserve, so backfilled history won't eat into it.</p></div>
      <div class="banner"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        <span>Currently <b class="num">${fmt(r.remaining)}</b> of ${fmt(c.reserveStart)} left, ${fmt(r.drawn)} drawn since ${monthLabel(c.reserveAsOf, true)}. Surpluses are never credited back — the pot only shrinks.</span></div>
      <div class="fld" id="storewrap" hidden><label>Attached documents</label>
        <p class="hint" id="storemeter">Counting…</p></div>
    </div>
    <div class="sheet-ft"><button class="btn pri" id="s-save">Save</button></div>`, (root) => {
    if (ASSETS) {
      $('#storewrap', root).hidden = false;
      const meter = $('#storemeter', root);
      meter.textContent = 'Receipts and invoices attached to entries live on this device.';
      if (typeof ASSETS.list === 'function') {
        Promise.resolve().then(() => ASSETS.list()).then(({ usage }) => {
          if (!meter.isConnected) return;
          meter.textContent = `${usage.files} of ${usage.maxFiles} files · ${fileSize(usage.bytes)} of ${fileSize(usage.maxBytes)} used. `
            + 'Receipts and invoices you attach to entries live here; removing an attachment deletes the file for good.';
        }).catch(() => { if (meter.isConnected) meter.textContent = 'Document storage figures unavailable right now.'; });
      }
    }
    let ignoreShip = !!c.hpIgnoreShip;
    $('#s-ship', root).addEventListener('click', e => {
      const b = e.target.closest('[data-h]'); if (!b) return;
      ignoreShip = b.dataset.h === '1';
      $$('#s-ship [data-h]', root).forEach(x => x.setAttribute('aria-pressed', (x.dataset.h === '1') === ignoreShip));
    });
    $('#s-save', root).addEventListener('click', () => {
      const num = (id, dflt) => {
        const v = parseFloat($(id, root).value.replace(/\s/g, '').replace(',', '.'));
        return isFinite(v) && v >= 0 ? Math.round(v * 100) / 100 : dflt;
      };
      state.settings = {
        baselineIncome: num('#s-inc', c.baselineIncome),
        reserveStart: num('#s-res', c.reserveStart),
        reserveAsOf: $('#s-from', root).value || c.reserveAsOf,
        hpMax: Math.max(1, num('#s-hp', c.hpMax)),
        hpIgnoreShip: ignoreShip,
        salary: num('#s-sal', c.salary),
        salaryOn: num('#s-sal', c.salary) > 0,
        salaryFrom: $('#s-salfrom', root).value || c.salaryFrom || THIS_MONTH,
      };
      persistSettings(); closeSheet(); render();
    });
  });
}

/* ============================ router ============================ */
const VIEWS = {
  overview: { title: 'Overview',        fn: viewOverview },
  ledger:   { title: 'Ledger',          fn: viewLedger },
  extra:    { title: 'Extraordinary expenses', fn: viewExtra },
  ship:     { title: 'Model shipwrighting', fn: viewShip },
  subs:     { title: 'Subscriptions',   fn: viewSubs },
  housing:  { title: 'Housing',         fn: viewHousing },
  report:   { title: 'Weekly report',   fn: viewReport },
};
function render() {
  const v = VIEWS[state.view] || VIEWS.overview;
  const out = v.fn();
  MOUNTED = [];
  const root = $('#view');
  root.innerHTML = out.html;
  out.wire && out.wire(root);
  $('#viewname').textContent = v.title;
  $('#mlbl').textContent = monthLabel(state.cursor);
  $('#mnext').disabled = state.cursor >= THIS_MONTH;
  $('#monthnav').style.visibility = state.view === 'report' ? 'hidden' : '';
  $$('[data-nav]').forEach(b => {
    if (b.closest('.rail') || b.closest('.tabbar')) {
      b.setAttribute('aria-current', b.dataset.nav === state.view ? 'page' : 'false');
    }
  });
  hideTip();
}
const go = (v) => { state.view = v; scrollTo({ top: 0, behavior: 'instant' }); render(); };

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }
  if (e.target.closest('[data-close]') || e.target === scrim()) { closeSheet(); return; }
  const open = e.target.closest('[data-open]');
  if (open) {
    const w = open.dataset.open;
    if (w === 'add') sheetTx(null, state.cursor, open.dataset.cat);
    else if (w === 'extra') sheetTx(null, state.cursor, null, 'extra');
    else if (w === 'sub') sheetRecurring(null, 'sub');
    else if (w === 'housing') sheetRecurring(null, 'housing');
    else if (w === 'income') sheetRecurring(null, 'income');
    else if (w === 'settings') sheetSettings();
    return;
  }
  const co = e.target.closest('[data-catopen]');
  if (co) { sheetCategory(state.cursor, co.dataset.catopen); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) {
    const mk = ed.dataset.mk || state.cursor;
    const t = (state.months[mk]?.tx || []).find(x => x.id === ed.dataset.edit);
    if (t) sheetTx(t, mk);
    return;
  }
  const rc = e.target.closest('[data-rec]');
  if (rc) {
    const it = state.recurring.find(x => x.id === rc.dataset.rec);
    if (it) sheetRecurring(it, it.kind);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && scrim().classList.contains('on')) closeSheet();
});
$('#mprev').addEventListener('click', () => { state.cursor = addMonths(state.cursor, -1); render(); });
$('#mnext').addEventListener('click', () => {
  if (state.cursor >= THIS_MONTH) return;
  state.cursor = addMonths(state.cursor, 1); render();
});
$('#addTop').addEventListener('click', () => sheetTx(null, state.cursor));
$('#cfgBtn').addEventListener('click', sheetSettings);
$('#bkBtn').addEventListener('click', sheetBackup);
$('#moreBtn').addEventListener('click', sheetMore);
$('#fab').addEventListener('click', () => sheetTx(null, state.cursor));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

/* ============================ boot ============================ */
loadLocal();
render();
setSync(DB ? 'Synced' : 'Connecting…');

(async () => {
  let db = null;
  try { db = await (window.claude?.use?.('db')); } catch (e) { db = null; }
  try { ASSETS = await (window.claude?.use?.('assets')); } catch (e) { ASSETS = null; }
  try { DOWNLOADS = await (window.claude?.use?.('downloads')); } catch (e) { DOWNLOADS = null; }
  if (!db) { setSync('This device only', true); return; }
  DB = db;
  setSync('Synced');
  db.doc('config/settings').onSnapshot(
    (snap) => { if (snap.exists) { state.settings = thaw(snap.data()) || {}; cacheLocal(); render(); } },
    () => setSync('Sync interrupted', true)
  );
  db.doc('config/recurring').onSnapshot(
    (snap) => { if (snap.exists) { state.recurring = thaw(snap.data().items) || []; cacheLocal(); render(); } },
    () => setSync('Sync interrupted', true)
  );
  db.doc('config/schedule').onSnapshot(
    (snap) => { state.schedule = (snap.exists && thaw(snap.data().items)) || []; cacheLocal(); render(); },
    () => {}
  );
  db.collection('ledger').onSnapshot(
    (snap) => {
      const next = {};
      snap.docs.forEach(d => { next[d.id] = { month: d.id, tx: thaw(d.data().tx) || [] }; });
      state.months = next; cacheLocal(); render();
    },
    () => setSync('Sync interrupted', true)
  );
})();
</script>
