<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Tracker</title>
  <meta name="description" content="What comes in, what goes out, and how much of the reserve is left.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f7f7f4; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
</style>
  <script>
  (function () {
    /* Mac <-> phone sync, piggybacking on the private GitHub repo these pages
       already live in. Off by default: nothing changes until a personal
       access token is entered once per device (tap the sync line to set it
       up). docs/collections mirror exactly what the artifact's own db
       capability hands the page, so the app itself needed no changes. */
    const GH_REPO   = 'Rfernex/Apps-private';
    const DATA_PATH = 'sync/ledger.json';
    const APP_ID    = 'ledger';
    const LS_KEY    = 'householdLedger.v1';
    const TOKEN_KEY = 'ghSyncToken.v1';
    const FORCE_KEY = 'ghSyncForceLocal.v1';
    const POLL_MS   = 45000;

    const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
    const setToken = (t) => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

    let sha = null, docs = {}, pending = new Set(), pushTimer = null;
    const docListeners = {}, colListeners = {};

    const status = (msg, bad) => { try { window.setSync && window.setSync(msg, bad); } catch (e) {} };

    function api(path, opts) {
      opts = opts || {};
      const headers = Object.assign(
        { Authorization: 'token ' + getToken(), Accept: 'application/vnd.github+json' },
        opts.headers || {});
      return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + path,
        Object.assign({ cache: 'no-store' }, opts, { headers }));
    }
    const b64encode = (s) => btoa(unescape(encodeURIComponent(s)));
    const b64decode = (s) => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));

    async function ghGet() {
      const r = await api(DATA_PATH);
      if (r.status === 404) return { sha: null, blob: null };
      if (r.status === 401 || r.status === 403) throw { auth: true };
      if (!r.ok) throw new Error('GitHub read failed: ' + r.status);
      const j = await r.json();
      return { sha: j.sha, blob: JSON.parse(b64decode(j.content)) };
    }
    async function ghPut(blob, prevSha) {
      const body = { message: 'sync: ' + new Date().toISOString(), content: b64encode(JSON.stringify(blob)) };
      if (prevSha) body.sha = prevSha;
      const r = await api(DATA_PATH, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.status === 401 || r.status === 403) throw { auth: true };
      if (r.status === 409 || r.status === 422) throw { conflict: true };
      if (!r.ok) throw new Error('GitHub write failed: ' + r.status);
      return (await r.json()).content.sha;
    }

    function notifyDoc(path) {
      const val = docs[path];
      (docListeners[path] || []).forEach((l) => l.cb({ exists: val !== undefined, data: () => val }));
    }
    function notifyCollection(prefix) {
      const rows = Object.keys(docs).filter((k) => k.indexOf(prefix + '/') === 0)
        .map((k) => ({ id: k.slice(prefix.length + 1), data: () => docs[k] }));
      (colListeners[prefix] || []).forEach((l) => l.cb({ docs: rows }));
    }
    function notifyAll() {
      Object.keys(docListeners).forEach(notifyDoc);
      Object.keys(colListeners).forEach(notifyCollection);
    }
    function notifyForPath(path) {
      notifyDoc(path);
      Object.keys(colListeners).forEach((prefix) => { if (path.indexOf(prefix + '/') === 0) notifyCollection(prefix); });
    }

    function schedulePush() {
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(push, 2500);
    }
    async function push() {
      pushTimer = null;
      if (!pending.size) return;
      const mine = new Set(pending); pending = new Set();
      try {
        sha = await ghPut({ app: APP_ID, updatedAt: new Date().toISOString(), docs }, sha);
        status('Synced');
      } catch (e) {
        if (e && e.conflict) {
          // the other device pushed since our last known version — take its
          // copy, then lay just what we changed back on top and try again
          try {
            const remote = await ghGet();
            const merged = Object.assign({}, (remote.blob && remote.blob.docs) || {});
            mine.forEach((p) => { merged[p] = docs[p]; });
            docs = merged; sha = remote.sha;
            sha = await ghPut({ app: APP_ID, updatedAt: new Date().toISOString(), docs }, sha);
            notifyAll();
            status('Synced');
          } catch (e2) { mine.forEach((p) => pending.add(p)); status('Offline — saved locally', true); }
        } else if (e && e.auth) {
          status('Sync token rejected', true);
        } else {
          mine.forEach((p) => pending.add(p));
          status('Offline — saved locally', true);
        }
      }
    }

    function put(path, data) {
      // the ready-to-send week email lives in the artifact only — the Mac
      // cron that reads it never looks at this file, so mirroring it here
      // would just bloat every sync with a throwaway 50KB blob
      if (path.indexOf('plans/') === 0) return Promise.resolve();
      docs[path] = data;
      pending.add(path);
      schedulePush();
      notifyForPath(path);
      return Promise.resolve();
    }

    async function pull() {
      if (pending.size) return;   // don't clobber an edit still in flight
      try {
        const remote = await ghGet();
        if (remote.blob && remote.sha !== sha) {
          sha = remote.sha;
          docs = (remote.blob && remote.blob.docs) || {};
          notifyAll();
        }
        status('Synced');
      } catch (e) {
        status(e && e.auth ? 'Sync token rejected' : 'Sync interrupted', true);
      }
    }

    function seedFromLocal() {
      // nothing worth keeping on GitHub yet: carry across what is already on
      // this device, so the first sync isn't a blank slate
      try {
        const raw = localStorage.getItem(LS_KEY);
        const d = raw && JSON.parse(raw);
        if (d) docs = seedMap(d);
      } catch (e) {}
    }
    function seedMap(d) {
      return Object.assign({
        'config/settings': d.settings || {},
        'config/recurring': { items: d.recurring || [] },
      }, Object.fromEntries(Object.entries(d.months || {}).map(([k, v]) => ['ledger/' + k, v])));

    }

    let dbReady = null;
    function init() {
      if (dbReady) return dbReady;
      dbReady = (async () => {
        if (!getToken()) return null;
        let forceLocal = false;
        try { forceLocal = localStorage.getItem(FORCE_KEY) === '1'; localStorage.removeItem(FORCE_KEY); } catch (e) {}
        try {
          const remote = await ghGet();
          if (remote.blob && !forceLocal) { docs = remote.blob.docs || {}; sha = remote.sha; }
          else { seedFromLocal(); sha = await ghPut({ app: APP_ID, updatedAt: new Date().toISOString(), docs }, remote.sha); }
          status('Synced');
        } catch (e) {
          status(e && e.auth ? 'Sync token rejected' : 'Sync interrupted', true);
          seedFromLocal();
        }
        setInterval(pull, POLL_MS);
        addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
        addEventListener('online', () => { pull(); push(); });
        return {
          doc: (path) => ({
            set: (data) => put(path, data),
            onSnapshot: (cb, errCb) => {
              (docListeners[path] = docListeners[path] || []).push({ cb, errCb });
              notifyDoc(path);
            },
          }),
          collection: (prefix) => ({
            onSnapshot: (cb, errCb) => {
              (colListeners[prefix] = colListeners[prefix] || []).push({ cb, errCb });
              notifyCollection(prefix);
            },
          }),
        };
      })();
      return dbReady;
    }

    const save = async ({ filename, data }) => {
      const blob = data instanceof Blob ? data
        : new Blob([data], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename || 'download';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
    };
    /* Files attached to a document stay in this device's own IndexedDB. The repo is
       served publicly by Pages, so nothing personal beyond the app data goes into it. */
    const assets = (() => {
      const NAME = 'attachments-' + APP_ID, urls = {};
      const OK = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'application/pdf'];
      const fail = (code) => { const e = new Error(code); e.code = code; return e; };
      const open = () => new Promise((res, rej) => {
        const r = indexedDB.open(NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('f');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const run = async (mode, fn) => {
        const d = await open();
        return new Promise((res, rej) => {
          const t = d.transaction('f', mode), st = t.objectStore('f'), rq = fn(st);
          t.oncomplete = () => { d.close(); res(rq && rq.result); };
          t.onerror = t.onabort = () => { d.close(); rej(t.error || fail('quota_or_state')); };
        });
      };
      const ready = (async () => {
        try {
          const d = await open();
          await new Promise((res) => {
            const rq = d.transaction('f').objectStore('f').openCursor();
            rq.onsuccess = () => { const c = rq.result; if (!c) return res(); urls[c.key] = URL.createObjectURL(c.value); c.continue(); };
            rq.onerror = () => res();
          });
          d.close();
        } catch (e) {}
      })();
      return {
        ready,
        urlFor: (id) => urls[id] || '',
        upload: async (blob, opts) => {
          const type = (opts && opts.type) || blob.type;
          if (!OK.includes(type)) throw fail('unsupported_type');
          if (blob.size > 20 * 1048576) throw fail('too_large');
          const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          const stored = blob.type === type ? blob : new Blob([blob], { type });
          try { await run('readwrite', (st) => st.put(stored, id)); } catch (e) { throw fail('quota_or_state'); }
          urls[id] = URL.createObjectURL(stored);
          return { id, url: urls[id], sizeBytes: stored.size, contentType: type };
        },
        delete: async (id) => {
          if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; }
          await run('readwrite', (st) => st.delete(id));
        },
      };
    })();
    window.claude = {
      use: async (what) => (what === 'downloads' ? { save } : what === 'db' ? init()
        : what === 'assets' ? (await assets.ready, assets) : null),
    };
    window.__ghSync = {
      lsKey: LS_KEY,
      repo: GH_REPO,
      hasToken: () => !!getToken(),
      probe: async (t) => {
        try {
          const r = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + DATA_PATH,
            { headers: { Authorization: 'token ' + t, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
          if (r.status === 401 || r.status === 403) return { ok: false, error: 'that token was not accepted' };
          if (r.status === 404) return { ok: true, remoteHasData: false };
          if (!r.ok) return { ok: false, error: 'GitHub returned ' + r.status };
          const j = await r.json();
          const blob = JSON.parse(b64decode(j.content));
          return { ok: true, remoteHasData: !!(blob && blob.docs && Object.keys(blob.docs).length) };
        } catch (e) { return { ok: false, error: 'could not reach GitHub' }; }
      },
      activate: (t, forceLocal) => {
        setToken(t);
        try { forceLocal ? localStorage.setItem(FORCE_KEY, '1') : localStorage.removeItem(FORCE_KEY); } catch (e) {}
        location.reload();
      },
      clearToken: () => { setToken(''); location.reload(); },
    };
  })();
  </script>
  <script>
  (function () {
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function openModal() {
      const has = window.__ghSync && window.__ghSync.hasToken();
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4)';
      const panel = document.createElement('div');
      panel.style.cssText = 'background:var(--surface,#fff);color:var(--ink,#111);max-width:440px;width:100%;'
        + 'border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));'
        + "font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 -6px 24px rgba(0,0,0,.25)";
      wrap.appendChild(panel);
      document.body.appendChild(wrap);
      const close = () => wrap.remove();
      wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });

      const head = () => `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <b style="font-size:16px">Sync Mac &harr; phone</b>
        <button id="gs-x" style="border:0;background:none;font-size:22px;line-height:1;color:var(--ink-3,#888);cursor:pointer">&times;</button>
      </div>`;

      function renderOff() {
        panel.innerHTML = head() + `
          <p style="margin:0 0 10px;color:var(--ink-2,#444)">Paste a GitHub personal access token, scoped to just this one repository, and this device starts syncing with your others through it.</p>
          <ol style="margin:0 0 14px;padding-left:18px;color:var(--ink-2,#444)">
            <li>github.com &rarr; Settings &rarr; Developer settings &rarr; Fine-grained tokens &rarr; Generate new token</li>
            <li>Repository access: only <b>${esc(window.__ghSync.repo)}</b></li>
            <li>Permissions &rarr; Contents: <b>Read and write</b></li>
            <li>Generate, copy the token, paste it below</li>
          </ol>
          <input id="gs-tok" type="password" placeholder="github_pat_&hellip;" autocapitalize="off" autocorrect="off" spellcheck="false"
            style="width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line-strong,#ccc);border-radius:8px;font:13px ui-monospace,monospace;margin-bottom:6px">
          <p id="gs-err" style="margin:0 0 10px;color:var(--neg,#b00);font-size:12.5px"></p>
          <button id="gs-on" style="width:100%;padding:11px;border:0;background:var(--accent,#333);color:var(--accent-ink,#fff);border-radius:8px;font:inherit;font-weight:600;cursor:pointer">Turn on sync</button>`;
        panel.querySelector('#gs-x').addEventListener('click', close);
        const tok = panel.querySelector('#gs-tok'), err = panel.querySelector('#gs-err'), on = panel.querySelector('#gs-on');
        on.addEventListener('click', async () => {
          const t = tok.value.trim();
          if (!t) return;
          err.textContent = '';
          on.disabled = true; on.textContent = 'Checking…';
          const r = await window.__ghSync.probe(t);
          if (!r.ok) {
            err.textContent = 'Could not turn on sync: ' + r.error + '.';
            on.disabled = false; on.textContent = 'Turn on sync';
            return;
          }
          let localHasData = false;
          try { localHasData = !!localStorage.getItem(window.__ghSync.lsKey); } catch (e) {}
          if (r.remoteHasData && localHasData) {
            renderConflict(t);
          } else {
            window.__ghSync.activate(t, localHasData && !r.remoteHasData);
          }
        });
      }

      function renderConflict(t) {
        panel.innerHTML = head() + `
          <p style="margin:0 0 6px;color:var(--ink-2,#444)">This device already has its own data, and so does the sync file on GitHub — most likely from another device. Which should this device use from now on?</p>
          <p style="margin:0 0 14px;color:var(--ink-3,#888);font-size:12.5px">Whichever you don't pick is not deleted anywhere else — this only decides what this one device shows and then syncs onward.</p>
          <button id="gs-keepremote" style="width:100%;padding:11px;border:0;background:var(--accent,#333);color:var(--accent-ink,#fff);border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:8px">Use what's on GitHub (from your other device)</button>
          <button id="gs-keeplocal" style="width:100%;padding:11px;border:1px solid var(--line-strong,#ccc);background:none;color:var(--ink,#111);border-radius:8px;font:inherit;cursor:pointer">Use what's on this device instead</button>`;
        panel.querySelector('#gs-x').addEventListener('click', close);
        panel.querySelector('#gs-keepremote').addEventListener('click', () => window.__ghSync.activate(t, false));
        panel.querySelector('#gs-keeplocal').addEventListener('click', () => window.__ghSync.activate(t, true));
      }

      function renderOn() {
        panel.innerHTML = head() + `
          <p style="margin:0 0 14px;color:var(--ink-2,#444)">This device syncs through the private GitHub repository these apps are hosted from. A change here reaches your other device within about a minute.</p>
          <button id="gs-off" style="width:100%;padding:11px;border:1px solid var(--line-strong,#ccc);background:none;color:var(--neg,#b00);border-radius:8px;font:inherit;cursor:pointer">Turn off sync on this device</button>`;
        panel.querySelector('#gs-x').addEventListener('click', close);
        panel.querySelector('#gs-off').addEventListener('click', () => {
          if (confirm("Turn off sync on this device? Nothing is deleted — this device just stops checking in, and keeps the data it has.")) {
            window.__ghSync.clearToken();
          }
        });
      }

      has ? renderOn() : renderOff();
    }

    // The rail's own sync line is desktop-only — each app hides the whole
    // rail under its phone breakpoint, taking the sync line with it. Wire
    // that line when it's actually on screen, but also keep a small floating
    // control around for whenever it isn't, so phones always have a way in.
    function railSyncVisible() {
      const el = document.querySelector('.rail .sync');
      return !!(el && el.offsetParent !== null);
    }

    let fab = null, fabDot = null;
    function setFabStatus(msg, bad) {
      if (!fabDot) return;
      fabDot.style.background = !window.__ghSync.hasToken() ? '#999'
        : bad ? 'var(--neg,#b00)' : 'var(--pos,#2a7)';
      fab.title = msg || '';
    }
    function ensureFab() {
      const show = !railSyncVisible();
      if (show && !fab) {
        fab = document.createElement('button');
        fab.id = 'gs-fab';
        fab.setAttribute('aria-label', 'Sync between devices');
        fab.style.cssText = 'position:fixed;top:calc(9px + env(safe-area-inset-top));right:9px;z-index:50;'
          + 'display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;border:0;'
          + 'background:var(--surface,#fff);color:var(--ink-2,#444);box-shadow:0 1px 5px rgba(0,0,0,.22);'
          + "font:11px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600;cursor:pointer";
        fabDot = document.createElement('i');
        fabDot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:#999;flex:none';
        const txt = document.createElement('span');
        txt.textContent = 'Sync';
        fab.appendChild(fabDot); fab.appendChild(txt);
        fab.addEventListener('click', openModal);
        document.body.appendChild(fab);
        setFabStatus();
      } else if (!show && fab) {
        fab.remove(); fab = null; fabDot = null;
      }
    }

    function wire() {
      if (!window.__ghSync) return;
      const el = document.querySelector('.sync');
      if (el) {
        el.style.cursor = 'pointer';
        el.title = 'Set up syncing between your devices';
        el.addEventListener('click', openModal);
      }
      ensureFab();
      addEventListener('resize', ensureFab);
      // the app's own status line (and our fab) both track this same call
      const origSetSync = window.setSync;
      if (typeof origSetSync === 'function') {
        window.setSync = (msg, bad) => { origSetSync(msg, bad); setFabStatus(msg, bad); };
      }
    }
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', wire); else wire();
  })();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      // updateViaCache:'none' so the worker script itself is never served stale
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((reg) => reg.update().catch(() => {}))
        .catch(() => {});
      // a new worker taking over means the page it rendered is out of date
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }
  </script>
</head>

<style>
:root{
  /* White-first ledger: neutral paper and ink, green actions, restrained brass. */
  color-scheme:light;
  --bg:#e4e8e0;
  --surface:#f2f4ec;
  --surface-2:#eaf0e5;
  --surface-3:#e7ece5;
  --line:#e3e6e8;
  --line-strong:#c9cfd4;
  --ink:#242a2e;
  --ink-2:#555f66;
  --ink-3:#747d85;
  --accent:#235e49;
  --accent-hover:#194c3b;
  --accent-ink:#fffdf7;
  --accent-soft:#e3eee5;
  --brass:#9a7b32;
  --brass-soft:#f3edde;
  --r0:#194c3b; --r1:#285c45; --r2:#347451; --r3:#4c8c66; --r4:#73a184; --r5:#9fbea6; --r6:#d2e2d4;
  --k0:#b4315f; --k1:#754100; --k2:#4b9d27; --k3:#0086a1; --k4:#3750bb; --kx:#9aa6b4;
  --pos:#00876b;
  --pos-soft:#e3f1ec;
  --neg:#c62828;
  --neg-soft:#fbe7e7;
  --warn:#9c7414;
  --warn-soft:#f6efdd;
  --shadow:0 1px 1px rgba(21,62,53,.04), 0 4px 14px -8px rgba(21,62,53,.16);
  --shadow-lift:0 2px 6px rgba(21,62,53,.08), 0 20px 44px -20px rgba(21,62,53,.34);
  --focus:#235e49;
  --r:6px;
  /* Navigation is another white surface; green is an accent, never a large field. */
  --rail:#e9eee4;
  --rail-line:#e3e6e8;
  --rail-hover:#f5f7f8;
  --rail-active:#edf4ef;
  --rail-ink:#242a2e;
  --rail-ink-2:#616b72;
  --sans:"Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif:"Spectral", "Iowan Old Style", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.panel-hd h2,.sechead h2,.sheet-hd h2,.empty h3{font-family:var(--serif);font-weight:600;letter-spacing:0}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:212px;flex:none;border-right:1px solid var(--rail-line);
  background:var(--rail);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:1px;padding:22px 12px;
}
.brand{
  display:flex;align-items:baseline;gap:8px;padding:0 10px 16px;margin-bottom:14px;
  border-bottom:1px solid var(--brass);
}
.brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.005em;color:var(--rail-ink)}
.brand span{font-family:var(--mono);font-size:9.5px;color:var(--brass);letter-spacing:.14em}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:5px;
  color:var(--rail-ink-2);font-size:14px;font-weight:400;text-align:left;width:100%;
  transition:background .12s,color .12s;
}
.navbtn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--rail-hover);color:var(--rail-ink)}
.navbtn[aria-current="page"]{
  background:var(--rail-active);color:var(--rail-ink);font-weight:600;
  box-shadow:inset 2px 0 0 var(--brass);
}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--rail-line);display:flex;flex-direction:column;gap:6px}
.sync{font-family:var(--mono);font-size:9.5px;color:var(--rail-ink-2);display:flex;align-items:center;gap:6px;padding:0 11px;letter-spacing:.03em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pos);flex:none}
.dot.off{background:var(--neg)}

main{flex:1;min-width:0}
.wrap{max-width:1040px;margin:0 auto;padding:26px 28px 64px}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1040px;margin:0 auto;padding:12px 28px;
  display:flex;align-items:center;gap:14px;
}
.viewname{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.all-apps-link{flex:none;white-space:nowrap;border:1px solid #ffffff55;border-radius:8px;padding:7px 10px;color:#f3f6ed;text-decoration:none;font-size:11px;font-weight:600}
.all-apps-link:hover{background:#ffffff18;color:#fff}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface-3);border-radius:8px;padding:3px}
.monthnav button{
  width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);
}
.monthnav button:hover:not(:disabled){background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.monthnav button:disabled{opacity:.3;cursor:default}
.monthnav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.monthlbl{
  font-family:var(--mono);font-size:12.5px;font-weight:500;min-width:116px;text-align:center;
  letter-spacing:.01em;
}
.addbtn{
  background:var(--accent);color:var(--accent-ink);border-radius:8px;
  padding:8px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;
  transition:background .12s;
}
.addbtn:hover{background:var(--accent-hover)}
.addbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-hd h2{font-size:15.5px;font-weight:600}
.panel-hd .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.stack{display:flex;flex-direction:column;gap:18px}
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sechead h2{font-size:13px;letter-spacing:.02em}

/* hero */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  border-top:2px solid var(--brass);
  box-shadow:var(--shadow);padding:22px 24px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;
}
.hero-net{display:flex;flex-direction:column;gap:6px}
.hero-fig{font-family:var(--mono);font-size:clamp(34px,6vw,46px);font-weight:600;letter-spacing:-.035em;line-height:1}
.hero-fig.pos{color:var(--pos)}
.hero-fig.neg{color:var(--neg)}
.hero-note{font-size:13px;color:var(--ink-2);max-width:42ch}
.delta{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;font-weight:500;
  padding:3px 8px;border-radius:99px;white-space:nowrap;
}
.delta.good{background:var(--pos-soft);color:var(--pos)}
.delta.bad{background:var(--neg-soft);color:var(--neg)}
.delta.flat{background:var(--surface-3);color:var(--ink-3)}
.dl{font-size:11.5px;color:var(--ink-3);line-height:1.4;display:block;text-wrap:pretty}
.dl b{font-family:var(--mono);font-weight:500;font-size:11.5px;font-variant-numeric:tabular-nums}
.hero-split{display:flex;gap:0;align-items:stretch}
.hsplit{padding:0 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:108px}
.hsplit:first-child{border-left:none}
.hsplit b{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;display:flex;flex-direction:column;gap:5px;min-width:0;
}
.tile b{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.025em}
.tile .cap{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* charts */
.chartbox{padding:16px 18px 12px}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.lg i{width:10px;height:10px;border-radius:2px;display:block}
svg text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tip{
  position:fixed;z-index:90;pointer-events:none;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-lift);
  padding:9px 11px;font-size:12px;min-width:132px;opacity:0;transition:opacity .1s;
}
.tip.on{opacity:1}
.tip .t-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.tip .t-r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .t-r span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .t-r i{width:8px;height:8px;border-radius:2px;display:block}
.tip .t-r b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

/* category bars */
.catlist{display:flex;flex-direction:column}
.catrow{
  display:grid;grid-template-columns:148px minmax(0,1fr) 88px;gap:12px;align-items:center;
  padding:7px 18px;
}
.catrow{width:100%;text-align:left;font:inherit;color:inherit}
.catrow:hover{background:var(--surface-2)}
.catrow[data-catopen]{cursor:pointer}
.donut{display:block;margin:0 auto}
.slicerow{display:grid;grid-template-columns:11px minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.slicerow:last-child{border-bottom:none}
.slicerow i{width:11px;height:11px;border-radius:2px;display:block;align-self:center}
.slicerow .nm2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slicerow .nm2 span{display:block;font-size:11px;color:var(--ink-3);white-space:normal}
.slicerow .amt2{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.slicerow .pct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:38px;text-align:right}
.catrow .nm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .track{height:9px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex;gap:2px}
.catrow .fill{height:100%;background:var(--accent);border-radius:0 3px 3px 0;min-width:2px}
.catrow .fill.fixed{background:var(--accent);opacity:.42}
.catrow .vl{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl tbody tr:hover{background:var(--surface-2)}
.scroller{overflow-x:auto}
.chip{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  padding:2px 7px;border-radius:4px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;
}
.chip.work{background:var(--accent-soft);color:var(--accent)}
.chip.off{background:var(--neg-soft);color:var(--neg)}
.iconbtn{
  width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink-3);
}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.linkish{color:var(--accent);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:2px}

/* ledger rows */
.daygrp{border-bottom:1px solid var(--line)}
.daygrp:last-child{border-bottom:none}
.dayhd{
  display:flex;align-items:baseline;gap:10px;padding:9px 18px;background:var(--surface-2);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
}
.dayhd b{margin-left:auto;color:var(--ink-2);font-weight:500;letter-spacing:0}
.txrow{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;
  padding:10px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line);
}
.txrow:last-child{border-bottom:none}
.txrow:hover{background:var(--surface-2)}
.txrow .mn{min-width:0}
.txrow .mn b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .mn span{font-size:11.5px;color:var(--ink-3)}
.txrow .amt{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.txrow .amt.inc{color:var(--pos)}

/* empty */
.empty{padding:38px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{margin:0;color:var(--ink-3);font-size:13.5px;max-width:44ch}
.empty h3{font-size:14.5px}

/* report */
.verdict{
  font-family:var(--serif);font-size:clamp(20px,3.3vw,26px);line-height:1.4;
  letter-spacing:-.005em;max-width:32ch;font-weight:400;
}
.verdict em{font-style:italic;color:var(--ink-2)}
.verdict b{font-weight:500;font-family:var(--mono);font-size:.92em;letter-spacing:-.02em}
.verdict b.pos{color:var(--pos)}
.verdict b.neg{color:var(--neg)}
.cmpgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.cmpcell{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.cmpcell b{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.025em}

/* forms & sheet */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(8,15,26,.5);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .16s;
}
.scrim.on{opacity:1;pointer-events:auto}
@supports (backdrop-filter:blur(2px)){.scrim{backdrop-filter:blur(2px)}}
.sheet{
  background:var(--surface);width:100%;max-width:460px;border-radius:14px 14px 0 0;
  border:1px solid var(--line);border-bottom:none;box-shadow:var(--shadow-lift);
  transform:translateY(14px);transition:transform .18s;
  max-height:92vh;overflow-y:auto;
}
.scrim.on .sheet{transform:translateY(0)}
@media (min-width:700px){
  .scrim{align-items:center}
  .sheet{border-radius:14px;border-bottom:1px solid var(--line)}
}
.sheet-hd{
  display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:2;
}
.sheet-hd h2{font-size:15px;margin-right:auto}
.sheet-bd{padding:18px;display:flex;flex-direction:column;gap:15px}
.sheet-ft{
  padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;
  position:sticky;bottom:0;background:var(--surface);
}
.seg{display:flex;background:var(--surface-3);border-radius:8px;padding:3px;gap:3px}
.seg button{
  flex:1;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);
  transition:background .12s,color .12s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.inp{
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-size:14.5px;width:100%;
}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{appearance:none;background-image:none;padding-right:12px}
.amtwrap{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 14px}
.amtwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amtwrap span{font-family:var(--mono);font-size:24px;color:var(--ink-3)}
.amtwrap input{
  background:none;border:none;outline:none;font-family:var(--mono);font-size:30px;font-weight:600;
  letter-spacing:-.03em;width:100%;padding:8px 0;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  padding:6px 11px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);transition:all .12s;
}
.chips button:hover{border-color:var(--line-strong)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600;
  border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface-2);
}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.pri:hover{background:var(--accent-hover)}
.btn.danger{color:var(--neg);border-color:transparent;background:transparent;padding:11px 12px}
.btn.danger:hover{background:var(--neg-soft)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.doclist{display:flex;flex-direction:column;gap:6px}
.doclist:empty{display:none}
.docrow{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;
}
.docthumb{
  width:38px;height:38px;border-radius:4px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--surface-3);border:1px solid var(--line);color:var(--ink-3);text-decoration:none;
}
.docthumb img{width:100%;height:100%;object-fit:cover;display:block}
.docthumb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.docthumb:hover{border-color:var(--accent);color:var(--accent)}
.docmeta{min-width:0;display:flex;flex-direction:column;gap:1px}
.docmeta b{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docmeta span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.btn.attach{
  width:100%;border-style:dashed;border-color:var(--line-strong);background:var(--surface-2);
  color:var(--ink-2);font-weight:500;font-size:13.5px;padding:10px 14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn.attach:hover{border-color:var(--accent);color:var(--accent)}
.btn.attach[disabled]{opacity:.6;cursor:default}
.btn.attach svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.clip{
  display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;
  color:var(--ink-3);white-space:nowrap;
}
.clip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button.docthumb{padding:0;cursor:zoom-in}
.docview{display:flex;flex-direction:column;min-height:0}
.docview-hd{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:2;
}
.docview-hd b{font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-back{
  display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--accent);
  padding:5px 9px;border-radius:5px;flex:none;
}
.dv-back:hover{background:var(--accent-soft)}
.dv-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dv-body{padding:14px;background:var(--surface-3);display:flex;flex-direction:column;gap:10px;align-items:center}
.dv-body img,.dv-body canvas{
  max-width:100%;height:auto;display:block;border-radius:4px;
  box-shadow:var(--shadow);background:#fff;
}
.dv-body iframe{width:100%;height:70vh;border:0;border-radius:4px;background:#fff}
.dv-msg{font-size:12.5px;color:var(--ink-2);line-height:1.5;text-align:center;padding:20px 10px;max-width:40ch}
.err{
  margin:0;font-size:12.5px;line-height:1.45;color:var(--neg);
  background:var(--neg-soft);border-radius:8px;padding:9px 12px;
}

/* reserve meter */
.meter{height:10px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%}
.meter i.ship{background:var(--accent);opacity:.45}
.meter i.other{background:var(--neg)}
.meter i.left{background:var(--pos);opacity:.22;flex:1}
.resgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.rescell{background:var(--surface);padding:13px 16px;display:flex;flex-direction:column;gap:4px}
.rescell b{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.025em}
.alert{
  display:flex;gap:11px;align-items:flex-start;padding:13px 16px;border-radius:var(--r);
  background:var(--neg-soft);color:var(--neg);font-size:13px;line-height:1.45;
  border:1px solid transparent;
}
.alert.ok{background:var(--pos-soft);color:var(--pos)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}

/* health */
.pips{display:flex;gap:3px;height:13px}
.pips i{flex:1;border-radius:2px;background:var(--surface-3);transition:background .2s}
.pips i.on{background:currentColor}
.hpwrap{padding:20px 22px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.hpmain{flex:1 1 260px;display:flex;flex-direction:column;gap:8px;min-width:0}

<script>
/* ============================ constants ============================ */
const EXP_CATS = [
  ['housing',      'Housing & utilities'],
  ['food',         'Groceries'],
  ['dining',       'Dining & delivery'],
  ['transport',    'Transport'],
  ['work',         'Work & research'],
  ['health',       'Health'],
  ['reading',      'Books & press'],
  ['entertainment','Entertainment'],
  ['ship',         'Model shipwrighting'],
  ['games',        'Games & hobbies'],
  ['shopping',     'Shopping'],
  ['travel',       'Travel'],
  ['admin',        'Bank, tax & admin'],
  ['other',        'Other'],
];
const INC_CATS = [
  ['salary','Salary'], ['grant','Grant / stipend'], ['freelance','Freelance'],
  ['reimb','Reimbursement'], ['gift','Gift'], ['other-in','Other income'],
];
const SHIP_SUBS = [
  ['ships',  'Ships & kits'],
  ['paints', 'Paints & pieces'],
  ['tools',  'Tools'],
  ['books',  'Naval history books'],
];
const SHIPNAME = Object.fromEntries(SHIP_SUBS);
const CATNAME = Object.fromEntries([...EXP_CATS, ...INC_CATS]);
CATNAME.extra = 'Extraordinary';
const DEFAULT_SETTINGS = { baselineIncome: 1500, reserveStart: 10000, reserveAsOf: '',
                           hpMax: 1500, hpIgnoreShip: false,
                           salary: 1500, salaryOn: true, salaryFrom: '' };
const WORK_CATS = new Set(['work']);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ============================ helpers ============================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
/* ---- documents attached to an entry (the `assets` store) ---- */
let ASSETS = null;
const ASSET_TYPES = new Set(['image/png','image/jpeg','image/gif','image/webp','application/pdf']);
const EXT_TYPE = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
                   webp:'image/webp', pdf:'application/pdf' };
const assetUrl = (id) => '/_blob/' + id;
const ICON_PDF  = '<svg viewBox="0 0 24 24"><path d="M14 3H7a1 1 0 00-1 1v16a1 1 0 001 1h10a1 1 0 001-1V7z"/><path d="M14 3v4h4"/></svg>';
const ICON_CLIP = '<svg viewBox="0 0 24 24"><path d="M21 11.5l-8.4 8.4a5 5 0 01-7-7l8.4-8.4a3.3 3.3 0 014.7 4.7l-8.4 8.4a1.7 1.7 0 01-2.4-2.4l7.8-7.8"/></svg>';

function fileSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return Math.round(b / 1024) + ' KB';
  return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB';
}
function assetMessage(code, name) {
  switch (code) {
    case 'too_large':        return `"${name}" is too big — 20 MB is the limit. Photograph it instead of scanning at full resolution.`;
    case 'unsupported_type': return `"${name}" isn't a kind of file that can be attached. Photos (JPG, PNG, WEBP) and PDFs only — a Word or Excel file has to be exported to PDF first.`;
    case 'quota_or_state':   return 'The document store is full. Remove an attachment you no longer need, then try again.';
    case 'rate_limited':     return 'Too many uploads at once. Wait a few seconds and try again.';
    case 'upstream_auth':    return 'Your session expired. Reload the page and try again.';
    case 'invalid_request':  return `"${name}" could not be read. If it is a photo, try re-saving it as JPG.`;
    default:                 return `"${name}" could not be attached. Try again in a moment.`;
  }
}
/* The viewer sandbox makes plain file links inert — a new tab opens empty — so
   documents are rendered inside the page. Images go straight into an <img>;
   PDFs are drawn to a canvas with pdf.js, fetched from cnjs only the first
   time a PDF is actually opened. */
let pdfLib = null;
function loadPdfLib() {
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = 'vendor/pdf.min.js';
    el.onload = () => {
      const lib = window.pdfjsLib;
      if (!lib) return reject(new Error('pdfjs missing'));
      try {
        lib.GlobalWorkerOptions.workerSrc =
          'vendor/pdf.worker.min.js';
      } catch (e) { /* pdf.js falls back to the main thread */ }
      resolve(lib);
    };
    el.onerror = () => reject(new Error('pdfjs failed to load'));
    document.head.appendChild(el);
  });
  return pdfLib;
}
async function renderPdf(url, box) {
  const lib = await loadPdfLib();
  const res = await fetch(url);
  if (!res.ok) throw new Error('http ' + res.status);
  const data = await res.arrayBuffer();
  const pdf = await lib.getDocument({ data }).promise;
  const width = Math.max(240, box.clientWidth - 28);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  box.innerHTML = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 25); i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (width / base.width) * dpr });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    c.style.width = '100%';
    box.appendChild(c);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  }
  if (pdf.numPages > 25) {
    const p = document.createElement('p');
    p.className = 'dv-msg';
    p.textContent = `Showing the first 25 of ${pdf.numPages} pages.`;
    box.appendChild(p);
  }
}

/** Show one attachment inside the sheet, over the form, and come back to it. */
function openDocViewer(sheet, doc) {
  const others = [...sheet.children].filter(el => !el.classList.contains('docview'));
  let view = sheet.querySelector('.docview');
  if (!view) {
    view = document.createElement('div');
    view.className = 'docview';
    view.innerHTML = `<div class="docview-hd">
        <button type="button" class="dv-back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
        <b class="dv-name"></b></div>
      <div class="dv-body"></div>`;
    sheet.appendChild(view);
    view.querySelector('.dv-back').addEventListener('click', () => {
      view.hidden = true;
      view.querySelector('.dv-body').innerHTML = '';
      others.forEach(el => { el.hidden = el.dataset.wasHidden === '1'; });
    });
  }
  others.forEach(el => { el.dataset.wasHidden = el.hidden ? '1' : '0'; el.hidden = true; });
  view.hidden = false;
  view.querySelector('.dv-name').textContent = doc.name;
  const body = view.querySelector('.dv-body');
  const url = assetUrl(doc.id);
  body.innerHTML = '<p class="dv-msg">Opening…</p>';

  if ((doc.type || '').startsWith('image/')) {
    const img = new Image();
    img.alt = doc.name;
    img.onload = () => { body.innerHTML = ''; body.appendChild(img); };
    img.onerror = () => { body.innerHTML = '<p class="dv-msg">This file is no longer in the store. Remove the attachment and add it again.</p>'; };
    img.src = url;
    return;
  }
  renderPdf(url, body).catch(() => {
    // last resort: let the browser try its own PDF viewer
    body.innerHTML = `<iframe src="${url}" title="${esc(doc.name)}"></iframe>
      <p class="dv-msg">If this stays blank, the PDF cannot be previewed here — the file is still stored and attached.</p>`;
  });
}

/** Normalise what the file picker gives us: settle the media type, and shrink
 *  big photos so a year of receipts does not exhaust the store. */
async function prepareFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  let type = ASSET_TYPES.has(file.type) ? file.type : (EXT_TYPE[ext] || '');
  const isImage = type.startsWith('image/') || (file.type || '').startsWith('image/');
  if (type === 'application/pdf') return { blob: file, type, name: file.name };

  if (isImage || !type) {
    // Re-encode through a canvas: settles odd camera formats (HEIC on Apple
    // devices) and caps the long edge. Skip it for small, already-valid files.
    if (type && type !== 'image/gif' && file.size < 1_200_000) return { blob: file, type, name: file.name };
    try {
      const bmp = await createImageBitmap(file);
      const max = 2400, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      bmp.close && bmp.close();
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
      if (blob) return { blob, type: 'image/jpeg', name: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
    } catch (e) { /* fall through to the raw file */ }
  }
  if (!ASSET_TYPES.has(type)) { const e = new Error('unsupported'); e.code = 'unsupported_type'; throw e; }
  return { blob: file, type, name: file.name };
}

/** Snapshots from the store are frozen. Take a mutable copy before it goes in state. */
function thaw(v) {
  try { return structuredClone(v); }
  catch (e) { try { return JSON.parse(JSON.stringify(v)); } catch (e2) { return v; } }
}

function fmt(n, cents = false) {
  const neg = n < -0.004;
  const v = Math.abs(n).toLocaleString('en-US', {
    minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0,
  });
  return (neg ? '−' : '') + '€' + v;
}
const fmtSigned = (n, cents=false) => (n > 0.004 ? '+' : '') + fmt(n, cents);

const pad2 = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const mKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
const parseISO = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const monthLabel = (mk, short=false) => {
  const [y,m] = mk.split('-').map(Number);
  return `${(short?MON3:MONTHS)[m-1]} ${y}`;
};
function addMonths(mk, n) {
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return mKey(d);
}
function monthsBetween(a, b) { // inclusive count of months from mk a to mk b
  const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number);
  return (by-ay)*12 + (bm-am) + 1;
}
function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekLabel(ws) {
  const we = addDays(ws, 6);
  const a = `${ws.getDate()} ${MON3[ws.getMonth()]}`;
  const b = `${we.getDate()} ${MON3[we.getMonth()]}`;
  return ws.getMonth() === we.getMonth() ? `${ws.getDate()}–${b}` : `${a} – ${b}`;
}
function humanDuration(months) {
  if (months < 1) return 'under a month';
  const y = Math.floor(months/12), m = months % 12;
  if (!y) return `${m} mo`;
  if (!m) return `${y} yr`;
  return `${y} yr ${m} mo`;
}

/* ============================ state ============================ */
const TODAY = new Date();
const THIS_MONTH = mKey(TODAY);
const LS = 'householdLedger.v1';

const state = {
  months: {},      // "YYYY-MM" -> { month, tx: [...] }
  recurring: [],   // recurring commitments (subscriptions + housing)
  settings: {},    // baseline income, reserve size, reserve start month
  schedule: [],    // automated email reports Claude has set up for this app
  view: 'overview',
  cursor: THIS_MONTH,
  weekCursor: iso(startOfWeek(TODAY)),
};
const cfg = () => {
  const c = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
  if (!c.reserveAsOf) c.reserveAsOf = THIS_MONTH;
  return c;
};
let DB = null, DOWNLOADS = null;

      : 'The file could not be saved here.');

}

/* ============================ computation ============================ */
/* A recurring item normally costs the same every month. One with a `schedule`
   — a rent on a payment plan, say — carries its own figure for named months;
   anything outside the schedule falls back to the plain amount. */
const schedFor = (it, mk) => {
  const v = it && it.schedule && mk ? Number(it.schedule[mk]) : NaN;
  return isFinite(v) ? v : null;
};
const hasSchedule = (it) => !!(it && it.schedule && Object.keys(it.schedule).length);
const monthlyEq = (it, mk) => {
  const v = schedFor(it, mk);
  if (v !== null) return v;
  return it.basis === 'yearly' ? it.amount / 12 : it.amount;
};
const yearlyEq = (it, mk) => {
  if (!hasSchedule(it)) return it.basis === 'yearly' ? it.amount : it.amount * 12;
  // the twelve months from the one on screen, so the figure follows the plan
  let sum = 0, k = mk || THIS_MONTH;
  for (let i = 0; i < 12; i++) { if (activeIn(it, k)) sum += monthlyEq(it, k); k = addMonths(k, 1); }
  return sum;
};
/** Months a schedule names, in order. */
const schedMonths = (it) => Object.keys((it && it.schedule) || {}).sort();

function activeIn(it, mk) {
  if (it.since && mk < it.since) return false;
  if (it.status === 'active') return true;
  if (it.ended) return mk <= it.ended;
  return false;
}
const txOf = (mk) => state.months[mk]?.tx || [];

function monthStats(mk) {
  const c0 = cfg();
  const salary = (c0.salaryOn && (!c0.salaryFrom || mk >= c0.salaryFrom)) ? Number(c0.salary) || 0 : 0;
  const tx = txOf(mk);
  let income = salary, variable = 0, extraordinary = 0, ordinaryCount = 0;
  const byCat = {};
  const ship = { total: 0, ships: 0, paints: 0, tools: 0, books: 0 };
  for (const t of tx) {
    const a = Number(t.a) || 0;
    if (t.t === 'inc') { income += a; continue; }
    if (t.t === 'extra') { extraordinary += a; continue; }
    variable += a;
    ordinaryCount++;
    byCat[t.c] = byCat[t.c] || { variable: 0, fixed: 0 };
    byCat[t.c].variable += a;
    if (t.c === 'ship') {
      ship.total += a;
      ship[Object.prototype.hasOwnProperty.call(SHIPNAME, t.sc) ? t.sc : 'ships'] += a;
    }
  }
  let subs = 0, housing = 0, recurringIncome = 0;
  for (const it of state.recurring) {
    if (!activeIn(it, mk)) continue;
    const m = monthlyEq(it, mk);
    // money coming in every month is income, not a category of spending
    if (it.kind === 'income') { recurringIncome += m; income += m; continue; }
    if (it.kind === 'housing') housing += m; else subs += m;
    byCat[it.category] = byCat[it.category] || { variable: 0, fixed: 0 };
    byCat[it.category].fixed += m;
    if (it.category === 'ship') { ship.total += m; ship.ships += m; }
  }
  const fixed = subs + housing;
  const spend = variable + extraordinary + fixed;
  return { mk, income, salary, recurringIncome, extraIncome: income - salary, variable, subs, housing, fixed,
           extraordinary, ordinarySpend: variable + fixed, ordinaryCount,
           spend, net: income - spend, byCat, ship, count: tx.length };
}

/** Variable spending between two dates (inclusive), scanning the months they touch. */
function variableBetween(from, to) {
  let sum = 0;
  const keys = new Set([mKey(from), mKey(to)]);
  for (const mk of keys) {
    for (const t of txOf(mk)) {
      if (t.t !== 'exp') continue;
      const d = parseISO(t.d);
      if (d >= from && d <= to) sum += Number(t.a) || 0;
    }
  }
  return sum;
}

/** Every entry falling in a week (inclusive), tagged with the month it lives in so it can be edited. */
function weekTx(ws) {
  const we = addDays(ws, 6);
  const out = [];
  const keys = new Set([mKey(ws), mKey(we)]);
  for (const mk of keys) {
    for (const t of txOf(mk)) {
      const d = parseISO(t.d);
      if (d >= ws && d <= we) out.push({ ...t, mk });
    }
  }
  return out;
}
/** Logged spending for a week, grouped by category. */
function weekCatRows(tx) {
  const totals = {};
  for (const t of tx) {
    if (t.t === 'inc') continue;
    const cat = t.t === 'extra' ? 'extra' : t.c;
    totals[cat] = (totals[cat] || 0) + (Number(t.a) || 0);
  }
  return Object.entries(totals).map(([c, v]) => ({ c, v }))
    .filter(r => r.v > 0.004).sort((a, b) => b.v - a.v);
}

const daysInMonth = (mk) => { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const elapsedDays = (mk) => (mk === THIS_MONTH ? TODAY.getDate() : (mk < THIS_MONTH ? daysInMonth(mk) : 0));

/**
 * The reserve. Each month, spending above what that month's income covers
 * (the €1,500 baseline, or more when more was actually logged) comes out of
 * the €10,000 pot. Shipwrighting is counted against the overrun first — it is
 * the deliberate draw — so whatever is left over is the unplanned part.
 * Surpluses are never credited back: the pot only shrinks.
 */
function reserveState() {
  const c = cfg();
  const rows = [];
  let mk = c.reserveAsOf > THIS_MONTH ? THIS_MONTH : c.reserveAsOf;
  for (let guard = 0; mk <= THIS_MONTH && guard < 600; guard++, mk = addMonths(mk, 1)) {
    const st = monthStats(mk);
    const capacity = Math.max(c.baselineIncome, st.income);
    const draw = Math.max(0, st.spend - capacity);
    const shipDraw = Math.min(st.ship.total, draw);
    const ordinaryDraw = Math.max(0, st.ordinarySpend - capacity);
    const extraordinaryDraw = Math.max(0, draw - ordinaryDraw);
    rows.push({ mk, st, capacity, draw, ordinaryDraw, extraordinaryDraw, shipDraw, other: draw - shipDraw, headroom: capacity - st.spend });
  }
  const drawn = rows.reduce((a, r) => a + r.draw, 0);
  const shipDrawn = rows.reduce((a, r) => a + r.shipDraw, 0);
  return {
    c, rows, drawn, shipDrawn, otherDrawn: drawn - shipDrawn,
    ordinaryDrawn: rows.reduce((sum, r) => sum + r.ordinaryDraw, 0),
    extraordinaryDrawn: rows.reduce((sum, r) => sum + r.extraordinaryDraw, 0),
    remaining: c.reserveStart - drawn,
    current: rows.find(r => r.mk === THIS_MONTH) || rows[rows.length - 1] || null,
  };
}

const HP_TIERS = [
  [1.00, 'Full sail',    'pos'],
  [0.75, 'Shipshape',    'pos'],
  [0.50, 'Seaworthy',    'pos'],
  [0.25, 'Taking water', 'warn'],
  [0.001,'Foundering',   'neg'],
  [-1,   'Sunk',         'neg'],
];
/**
 * Health points. You start at full. A month that spends past what your income
 * covers costs a point per euro; a month that comes in under heals you back by
 * the same rule — never above the maximum, never below zero. Clamped month by
 * month in order, so one frugal month cannot bank credit against a future blowout.
 */
function healthState() {
  const c = cfg(), r = reserveState(), max = Math.max(1, c.hpMax);
  let hp = max;
  const rows = [];
  for (const row of r.rows) {
    const spend = row.st.ordinarySpend - (c.hpIgnoreShip ? row.st.ship.total : 0);
    const delta = row.capacity - spend;
    const before = hp;
    hp = Math.max(0, Math.min(max, hp + delta));
    rows.push({ mk: row.mk, delta, before, after: hp, applied: hp - before });
  }
  const pct = hp / max;
  const t = HP_TIERS.find(x => pct >= x[0]) || HP_TIERS[HP_TIERS.length - 1];
  return { hp, max, pct, tier: { name: t[1], col: t[2] }, rows, c,
           cur: rows.length ? rows[rows.length - 1] : null };
}
/** What a projected month-end total would do to health. */
function hpAfter(h, capacity, projectedSpend) {
  const prev = h.rows.length ? h.rows[h.rows.length - 1].before : h.max;
  return Math.max(0, Math.min(h.max, prev + (capacity - projectedSpend)));
}

/** Everything spent on model shipwrighting in a calendar year. */
function shipYear(year) {
  const out = { total: 0, ships: 0, paints: 0, tools: 0, books: 0, months: [] };
  for (let m = 1; m <= 12; m++) {
    const mk = `${year}-${pad2(m)}`;
    const st = monthStats(mk);
    if (!state.months[mk] && mk > THIS_MONTH) continue;
    out.months.push({ mk, v: st.ship.total });
    for (const k of ['total', 'ships', 'paints', 'tools', 'books']) out[k] += st.ship[k];
  }
  return out;
}

/**
 * Month-end forecast built from your own daily spend rates. Baseline uses the
 * median rate of complete months, optimistic the calmest, pessimistic the
 * busiest; the current month's own rate is folded in so a hot month is not
 * forecast as if it were quiet.
 */
function forecast() {
  const c = cfg();
  const st = monthStats(THIS_MONTH);
  const dim = daysInMonth(THIS_MONTH), day = TODAY.getDate(), left = Math.max(0, dim - day);

  const hist = [];
  for (let i = 1; i <= 6; i++) {
    const mk = addMonths(THIS_MONTH, -i);
    const h = monthStats(mk);
    if (h.ordinaryCount > 0) hist.push(h.variable / daysInMonth(mk));
  }
  const rateNow = day > 0 ? st.variable / day : 0;
  const ready = hist.length >= 1 || (day >= 10 && st.ordinaryCount >= 5);
  if (!ready) {
    return { ready: false, need: hist.length ? '' : 'a full month of logged entries', day, dim, st, c };
  }
  const pool = hist.length ? [...hist, rateNow] : [rateNow];
  const sorted = [...pool].sort((a, b) => a - b);
  const median = sorted.length % 2
    ? sorted[(sorted.length - 1) / 2]
    : (sorted[sorted.length/2 - 1] + sorted[sorted.length/2]) / 2;
  const mk = (rate) => st.variable + rate * left + st.fixed + st.extraordinary;

  const capacity = Math.max(c.baselineIncome, st.income);
  const h = healthState();
  const hpNow = h.rows.length ? h.rows[h.rows.length - 1].before : h.max;
  const scen = [
    { key: 'opt',  name: 'Calm',       note: 'your quietest recent pace', total: mk(sorted[0]) },
    { key: 'base', name: 'Likely',     note: 'your usual pace',           total: mk(median) },
    { key: 'pess', name: 'Busy',       note: 'your heaviest recent pace', total: mk(sorted[sorted.length - 1]) },
  ].map(x => ({
    ...x,
    draw: Math.max(0, x.total - capacity),
    net: st.income - x.total,
    hp: hpAfter(h, capacity, x.total - st.extraordinary - (c.hpIgnoreShip ? st.ship.total : 0)),
    hpNow,
  }));

  const allowance = left > 0 ? Math.max(0, capacity - st.spend) / left : 0;
  return { ready: true, scen, capacity, allowance, left, day, dim, st, c, rateNow, median };
}

function recentMonths(n, endMk = state.cursor) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addMonths(endMk, -i));
  return out;
}
const subsOf  = (kind) => state.recurring.filter(i => i.kind === kind);
const isWork  = (it) => WORK_CATS.has(it.category);

/* ============================ charts ============================ */
const TIP = () => $('#tip');
function showTip(html, ev) {
  const t = TIP();
  t.innerHTML = html;
  t.classList.add('on');
  const r = t.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y < 8) y = ev.clientY + 18;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
const hideTip = () => TIP().classList.remove('on');

function niceMax(v) {
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / (p/2)) * (p/2);
}
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w/2, h));
  return `M${x} ${y+h}L${x} ${y+r}Q${x} ${y} ${x+r} ${y}L${x+w-r} ${y}Q${x+w} ${y} ${x+w} ${y+r}L${x+w} ${y+h}Z`;
}

/**
 * Six months of spending, each bar stacked by category.
 *
 * Categories are ranked over the whole window so a colour means the same thing
 * in every column; beyond the fifth they gather into one neutral band, because
 * a dozen hues cannot be told apart — least of all by a colour-blind reader.
 * A green tick above each bar marks that month's income, so the question the
 * chart answers is whether the stack cleared it.
 */
function catRanking(rows) {
  const totals = {};
  for (const r of rows) {
    for (const [c, v] of Object.entries(r.s.byCat)) totals[c] = (totals[c] || 0) + v.variable + v.fixed;
  }
  const ranked = Object.entries(totals).filter(([, v]) => v > 0.004).sort((a, b) => b[1] - a[1]);
  const top = ranked.slice(0, 5).map(([c]) => c);
  const tail = ranked.slice(5).map(([c]) => c);
  return { top, tail, series: [...top, ...(tail.length ? ['__other'] : [])] };
}
const catColour = (c, i) => (c === '__other' ? 'var(--kx)' : `var(--k${i})`);
const catLabel = (c, tail) => (c === '__other' ? `${tail.length} smaller categories` : (CATNAME[c] || c));
const catValue = (r, c, tail) => (c === '__other'
  ? tail.reduce((a, cc) => a + ((r.s.byCat[cc]?.variable || 0) + (r.s.byCat[cc]?.fixed || 0)), 0)
  : (r.s.byCat[c]?.variable || 0) + (r.s.byCat[c]?.fixed || 0));

function chartMonths(keys) {
  const rows = keys.map(k => ({ k, s: monthStats(k) }));
  const { top, tail, series } = catRanking(rows);
  const max = niceMax(Math.max(1, ...rows.flatMap(r => [r.s.income, r.s.spend])));

  function build(W) {
    const H = 210, L = 46, R = 14, T = 24, B = 30;
    const pw = W - L - R, ph = H - T - B;
    const gw = pw / rows.length, bw = Math.max(14, Math.min(42, gw * 0.52));
    const y = v => T + ph - (v / max) * ph;
    let grid = '';
    for (const tv of [0, max / 2, max]) {
      grid += `<line x1="${L}" x2="${W-R}" y1="${y(tv).toFixed(1)}" y2="${y(tv).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>`;
      grid += `<text x="${L-9}" y="${(y(tv)+3.5).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--ink-3)">${fmt(tv)}</text>`;
    }
    let bars = '', marks = '', labels = '', hit = '';
    rows.forEach((r, i) => {
      const cx = L + gw * i + gw / 2, x = cx - bw / 2;
      let acc = 0;
      series.forEach((c, k) => {
        const v = catValue(r, c, tail);
        if (v <= 0.004) return;
        const yTop = y(acc + v), yBot = y(acc);
        const h = Math.max(1, yBot - yTop - (acc > 0 ? 2 : 0));
        bars += `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
          style="fill:${catColour(c, k)}"/>`;
        acc += v;
      });
      if (r.s.income > 0) {
        const iy = y(r.s.income);
        marks += `<line x1="${(x - 4).toFixed(1)}" x2="${(x + bw + 4).toFixed(1)}" y1="${iy.toFixed(1)}" y2="${iy.toFixed(1)}"
          style="stroke:var(--pos)" stroke-width="2" stroke-dasharray="5 3"/>`;
      }
      const last = i === rows.length - 1;
      labels += `<text x="${cx.toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="10.5"
        style="fill:var(--${last?'ink-2':'ink-3'})" font-weight="${last?600:400}">${MON3[Number(r.k.split('-')[1])-1]}</text>`;
      if (last && r.s.spend > 0) labels += `<text x="${cx.toFixed(1)}" y="${(y(r.s.spend)-7).toFixed(1)}" text-anchor="middle"
        font-size="10" font-weight="600" style="fill:var(--ink-2)">${fmt(r.s.spend)}</text>`;
      hit += `<rect x="${(L+gw*i).toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${ph}" fill="transparent" data-mi="${i}"/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" style="display:block;max-width:100%"
      aria-label="Spending by category each month, with a mark for income">${grid}${bars}${marks}${labels}<g class="hits">${hit}</g></svg>`;
  }

  const legend = `<div class="legend">
    ${series.map((c, k) => `<span class="lg"><i style="background:${catColour(c, k)}"></i>${esc(catLabel(c, tail))}</span>`).join('')}
    <span class="lg"><i style="background:var(--pos);height:3px;border-radius:0"></i>Income</span></div>`;

  return { legend, mount(box) {
    box.innerHTML = build(Math.max(280, Math.round(box.clientWidth || 640)));
    $$('.hits rect', box).forEach(el => {
      el.addEventListener('mousemove', ev => {
        const r = rows[+el.dataset.mi];
        const lines = series.map((c, k) => ({ c, k, v: catValue(r, c, tail) }))
          .filter(x => x.v > 0.004).sort((a, b) => b.v - a.v)
          .map(x => `<div class="t-r"><span><i style="background:${catColour(x.c, x.k)}"></i>${esc(catLabel(x.c, tail))}</span><b>${fmt(x.v)}</b></div>`)
          .join('');
        showTip(`<div class="t-h">${monthLabel(r.k)}</div>${lines}
          <div class="t-r" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--line)"><span>Spent</span><b>${fmt(r.s.spend)}</b></div>
          <div class="t-r"><span><i style="background:var(--pos)"></i>Income</span><b>${fmt(r.s.income)}</b></div>
          <div class="t-r"><span>Net</span><b style="color:var(--${r.s.net>=0?'pos':'neg'})">${fmtSigned(r.s.net)}</b></div>`, ev);
      });
      el.addEventListener('mouseleave', hideTip);
    });
  }};
}

/** Weekly variable spend, last 12 weeks, single series. */
function chartWeeks(weeks) {
  const max = niceMax(Math.max(1, ...weeks.map(w => w.v)));

  function build(W) {
    const H = 150, L = 46, R = 14, T = 16, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const gw = pw / weeks.length, bw = Math.max(5, Math.min(26, gw * 0.62));
    const y = v => T + ph - (v / max) * ph;
    let grid = '';
    for (const tv of [0, max/2, max]) {
      grid += `<line x1="${L}" x2="${W-R}" y1="${y(tv).toFixed(1)}" y2="${y(tv).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>`;
      grid += `<text x="${L-9}" y="${(y(tv)+3.5).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--ink-3)">${fmt(tv)}</text>`;
    }
    let bars = '', labels = '', hit = '';
    weeks.forEach((w, i) => {
      const cx = L + gw*i + gw/2, x = cx - bw/2;
      const h = w.v > 0 ? Math.max(2, (w.v/max)*ph) : 0;
      const last = i === weeks.length - 1;
      if (h) bars += `<path d="${barPath(x, T+ph-h, bw, h, 4)}" style="fill:var(--accent);opacity:${last ? 1 : 0.42}"/>`;
      if (last && h) labels += `<text x="${cx.toFixed(1)}" y="${(T+ph-h-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--accent)">${fmt(w.v)}</text>`;
      if (i % 2 === 0 || last) labels += `<text x="${cx.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9.5" style="fill:var(--ink-3)">${w.ws.getDate()}/${w.ws.getMonth()+1}</text>`;
      hit += `<rect x="${(L+gw*i).toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${ph}" fill="transparent" data-wi="${i}"/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" style="display:block;max-width:100%"
      aria-label="Variable spending by week, last ${weeks.length} weeks">${grid}${bars}${labels}<g class="hits">${hit}</g></svg>`;
  }

  return { mount(box) {
    box.innerHTML = build(Math.max(280, Math.round(box.clientWidth || 640)));
    $$('.hits rect', box).forEach(el => {
      el.addEventListener('mousemove', ev => {
        const w = weeks[+el.dataset.wi];
        showTip(`<div class="t-h">Week of ${weekLabel(w.ws)}</div>
          <div class="t-r"><span><i style="background:var(--accent)"></i>Variable</span><b>${fmt(w.v, true)}</b></div>`, ev);
      });
      el.addEventListener('mouseleave', hideTip);
    });
  }};
}

/* charts are sized to their container, so they re-mount on resize */
let MOUNTED = [];
function mountChart(chart, box) { if (!box) return; MOUNTED.push([chart, box]); chart.mount(box); }
let rzT;
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => MOUNTED.forEach(([c, b]) => b.isConnected && c.mount(b)), 140);
});

/* ============================ view pieces ============================ */
function deltaBits(cur, prev) {
  const d = cur - prev;
  const ratio = Math.abs(prev) > 0.5 ? Math.abs(d) / Math.abs(prev) : null;
  const pct = ratio !== null && ratio <= 3 ? ` · ${Math.round(ratio * 100)}%` : '';
  return { d, txt: `${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))}${pct}` };
}
/** Pill — reserved for the single headline figure. `neutral` for an
 *  unfinished month, where a part-month vs whole-month gap means nothing yet. */
function deltaChip(cur, prev, lowerIsBetter, word = 'vs last month', neutral = false) {
  const { d, txt } = deltaBits(cur, prev);
  if (Math.abs(d) < 0.5) return `<span class="delta flat">Level ${word}</span>`;
  if (neutral) return `<span class="delta flat">${txt} ${word}</span>`;
  const good = lowerIsBetter ? d < 0 : d > 0;
  return `<span class="delta ${good ? 'good' : 'bad'}">${txt} ${word === 'vs last month' ? '' : word}</span>`;
}
/** Quiet inline version for supporting figures. */
function deltaLine(cur, prev, lowerIsBetter, word = 'vs last month', neutral = false) {
  const { d, txt } = deltaBits(cur, prev);
  if (Math.abs(d) < 0.5) return `<span class="dl">Level ${word}</span>`;
  const good = lowerIsBetter ? d < 0 : d > 0;
  const col = neutral ? 'var(--ink-3)' : `var(--${good ? 'pos' : 'neg'})`;
  return `<span class="dl"><b style="color:${col}">${txt}</b> ${word}</span>`;
}

function txList(list, opts = {}) {
  if (!list.length) return '';
  const byDay = {};
  for (const t of list) (byDay[t.d] = byDay[t.d] || []).push(t);
  const days = Object.keys(byDay).sort().reverse();
  return days.map(d => {
    const items = byDay[d];
    const dayTotal = items.reduce((a, t) => a + (t.t === 'inc' ? 0 : Number(t.a) || 0), 0);
    const dt = parseISO(d);
    const isToday = d === iso(TODAY);
    return `<div class="daygrp">
      <div class="dayhd"><span>${isToday ? 'Today · ' : ''}${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]} ${dt.getDate()} ${MON3[dt.getMonth()]}</span>

        <span class="mn"><b>${esc(t.n || CATNAME[t.c] || 'Entry')}</b><span>${esc(CATNAME[t.c] || t.c)}${
          t.t === 'extra' ? ' · <span class="chip">Extraordinary</span>' : ''}${
