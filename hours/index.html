const go = (v) => { state.view = v; scrollTo({ top: 0, behavior: 'instant' }); render(); };

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { if (scrim().classList.contains('on')) closeSheet(); go(nav.dataset.nav); return; }
  if (e.target.closest('[data-close]') || e.target === scrim()) { closeSheet(); return; }

  const et = e.target.closest('[data-edittask]');
  if (et) { e.stopPropagation(); sheetTask(null, state.tasks.find(t => t.id === et.dataset.edittask)); return; }
  const eb = e.target.closest('[data-editbook]');
  if (eb) { e.stopPropagation(); sheetBook(null, state.books.find(b => b.id === eb.dataset.editbook)); return; }
  const tk = e.target.closest('[data-task]');
  if (tk) {
    state.tasks = state.tasks.map(t => t.id === tk.dataset.task ? { ...t, done: !t.done } : t);
    persistTasks(); render(); return;
  }
  const bk = e.target.closest('[data-book]');
  if (bk) {
    state.books = state.books.map(b => b.id === bk.dataset.book ? { ...b, done: !b.done, current: b.done ? b.current : false } : b);
    persistBooks(); render(); return;
  }
  const era = e.target.closest('[data-editra]');
  if (era) { e.stopPropagation(); sheetRa(state.rawork.find(x => x.id === era.dataset.editra)); return; }
  const ra = e.target.closest('[data-ra]');
  if (ra) {
    state.rawork = state.rawork.map(x => x.id === ra.dataset.ra ? { ...x, done: !x.done } : x);
    persistRawork(); render(); return;
  }
  if (e.target.closest('[data-addra]')) { sheetRa(null); return; }
  const eb2 = e.target.closest('[data-editblock]');
  if (eb2) {
    const dd2 = state.cursorDay || TODAY_ISO;
    const blk = (dayOf(dd2).blocks || []).find(x => x.id === eb2.dataset.editblock);
    if (blk) { closeSheet(); sheetBlock(dd2, blk); }
    return;
  }
  const sx = e.target.closest('[data-slotdrop]');
  if (sx) {
    const d = state.cursorDay || TODAY_ISO;
    const s0 = findSlot(scheduleDay(d), sx.dataset.slotdrop);
    const act = s0 && slotDrop(s0);
    if (act) {
      freezeAutoPlaced(d, s0.k);
      if (act.what === 'remove') {
        const blk = (dayOf(d).blocks || []).find(x => x.id === s0.blockId);
        writeDay(d, { blocks: (dayOf(d).blocks || []).filter(x => x.id !== s0.blockId) });
        if (blk && blk.objId) drawDown(blk.objId, -blockCounts(blk), blk.bookId);
      } else if (act.what === 'rawork') {
        writeDay(d, { ra: (dayOf(d).ra || []).filter((_, k) => k !== Number(s0.raIdx)) });
      } else if (act.what === 'raq') writeDay(d, { raq: 0 });
      else if (act.what === 'loose') adjustDay(d, s0.objId, { loose: true });
      else if (act.what === 'over') adjustDay(d, 'oh:' + s0.ohId, { mins: 0 });
      else if (act.what === 'unsem') { state.semPicks = state.semPicks.filter(x => x !== s0.semId); persistSemPicks(); }
      closeSheet(); render();
    }
    return;
  }
  const sl = e.target.closest('[data-slot]');
  if (sl) { sheetSlot(sl.dataset.slot); return; }
  const sg = e.target.closest('[data-slotlog]');
  if (sg && sg.dataset.set !== undefined) {
    const d = state.cursorDay || TODAY_ISO;
    logTime(d, sg.dataset.slotlog, Math.max(0, Number(sg.dataset.set)));
    closeSheet(); render(); return;
  }
  if (sg) {
    const d = state.cursorDay || TODAY_ISO, id = sg.dataset.slotlog;
    logTime(d, id, Math.max(0, manualMinutes(dayOf(d), id) + Number(sg.dataset.add)));
    closeSheet(); render(); return;
  }
  const aj = e.target.closest('[data-adj]');
  if (aj) {
    const [id, what] = aj.dataset.adj.split('|');
    const d = state.cursorDay || TODAY_ISO;
    const cur = scheduleDay(d).alloc[id] || 0;
    if (what === 'skip') adjustDay(d, id, { skip: true });
    else if (what === 'reset') adjustDay(d, id, { reset: true });
    else adjustDay(d, id, { mins: Math.max(0, cur + (what === 'more' ? 15 : -15)) });
    render(); return;
  }
  const un = e.target.closest('[data-unskip]');
  if (un) { adjustDay(state.cursorDay || TODAY_ISO, un.dataset.unskip, { reset: true }); render(); return; }
  if (e.target.closest('#resetDay')) { clearDayAdjustments(state.cursorDay || TODAY_ISO); render(); return; }
  const fx = e.target.closest('[data-focus]');
  if (fx) {
    const [type, id, name] = fx.dataset.focus.split('|');
    if (type === 'clear') { state.focus = null; state.focusName = ''; closeSheet(); render(); return; }
    state.focus = { type, id }; state.focusName = name;
    closeSheet(); state.view = 'today'; render(); return;
  }
  if (e.target.closest('#clearFocus')) { state.focus = null; state.focusName = ''; render(); return; }
  const kz = e.target.closest('[data-kind]');
  if (kz) {
    state.objectives = state.objectives.map(o => o.id === kz.dataset.kind ? { ...o, work: !isWork(o) } : o);
    persistObjectives(); render(); return;
  }
  const sp = e.target.closest('[data-sempick]');
  if (sp) {
    const id = sp.dataset.sempick;
    state.semPicks = isPicked(id) ? state.semPicks.filter(x => x !== id) : [...(state.semPicks || []), id];
    persistSemPicks(); closeSheet(); render(); return;
  }
  const sf = e.target.closest('[data-semfilter]');
  if (sf) { state.semFilter = sf.dataset.semfilter; render(); return; }
  const pz = e.target.closest('[data-prio]');
  if (pz) {
    state.objectives = state.objectives.map(o => o.id === pz.dataset.prio
      ? { ...o, priority: ((Number(o.priority) || 2) % 3) + 1 } : o);
    persistObjectives(); render(); return;
  }
  const at = e.target.closest('[data-addtask]'); if (at) { sheetTask(at.dataset.addtask); return; }
  const ab = e.target.closest('[data-addbook]'); if (ab) { sheetBook(ab.dataset.addbook); return; }
  const im = e.target.closest('[data-import]'); if (im) { sheetImport(im.dataset.import, false); return; }
  const ib = e.target.closest('[data-importbooks]'); if (ib) { sheetImport(ib.dataset.importbooks, true); return; }
  const ob = e.target.closest('[data-obj]'); if (ob) { sheetObjective(state.objectives.find(x => x.id === ob.dataset.obj)); return; }

  const q = e.target.closest('[data-log]');
  if (q) {
    const d = state.cursorDay || TODAY_ISO, id = q.dataset.log;
    logTime(d, id, Math.max(0, manualMinutes(dayOf(d), id) + Number(q.dataset.add)));
    render(); return;
  }
  const qs = e.target.closest('[data-logset]'); if (qs) { sheetLog(state.cursorDay || TODAY_ISO, qs.dataset.logset); return; }
  const cell = e.target.closest('[data-cellobj]');
  if (cell) {
    if (cell.dataset.cellobj === 'ra') { state.cursorDay = cell.dataset.cellday; sheetRAHours(cell.dataset.cellday); }
    else sheetLog(cell.dataset.cellday, cell.dataset.cellobj);
    return;
  }
  const bl = e.target.closest('[data-blen]');
  if (bl) {
    const [bid, delta] = bl.dataset.blen.split('|');
    const d = state.cursorDay || TODAY_ISO;
    const blk = (dayOf(d).blocks || []).find(x => x.id === bid);
    if (blk) {
      const st = hm(blk.s);
      let en = hm(blk.e); if (en < st) en += 1440;
      const next = Math.max(st + 5, Math.min(en + Number(delta), st + 1440));
      resizeBlock(d, bid, blk.s, toHM(next % 1440));
    }
    return;
  }
  const bd = e.target.closest('[data-bdone]');
  if (bd) {
    const [bid, what] = bd.dataset.bdone.split('|');
    const d = state.cursorDay || TODAY_ISO;
    const blk = (dayOf(d).blocks || []).find(x => x.id === bid);
    if (blk) {
      const span = blockMinutes(blk), was = blockCounts(blk);
      const next = what === 'all' ? null : what === 'zero' ? 0
        : clamp(was + Number(what), 0, span);
      const rec = { ...blk, doneMin: next === null || next >= span ? null : next };
      writeDay(d, { blocks: (dayOf(d).blocks || []).map(x => x.id === bid ? rec : x) });
      if (blk.objId) drawDown(blk.objId, blockCounts(rec) - was, blk.bookId);
      render();
    }
    return;
  }
  const rmb = e.target.closest('[data-rmblock]');
  if (rmb) {
    const dd = state.cursorDay || TODAY_ISO;
    const blk = (dayOf(dd).blocks || []).find(x => x.id === rmb.dataset.rmblock);
    writeDay(dd, { blocks: (dayOf(dd).blocks || []).filter(x => x.id !== rmb.dataset.rmblock) });
    if (blk && blk.objId) drawDown(blk.objId, -blockCounts(blk), blk.bookId);
    closeSheet(); render(); return;
  }
  const lo = e.target.closest('[data-loose]');
  if (lo) { adjustDay(state.cursorDay || TODAY_ISO, lo.dataset.loose, { loose: true }); closeSheet(); render(); return; }
  const ohd = e.target.closest('[data-ohday]');
  if (ohd) {
    const [oid, what] = ohd.dataset.ohday.split('|');
    const d = state.cursorDay || TODAY_ISO;
    if (what === 'skip') adjustDay(d, 'oh:' + oid, { mins: 0 });
    else adjustDay(d, 'oh:' + oid, { minsClear: true });
    closeSheet(); render(); return;
  }
  const ec2 = e.target.closest('[data-editcat]');
  if (ec2) { const ct = catOf(ec2.dataset.editcat); if (ct) sheetCategory(ct); return; }
  if (e.target.closest('[data-addcat]')) { sheetCategory(null); return; }
  const red = e.target.closest('[data-raedit]');
  if (red) { sheetRA(state.cursorDay || TODAY_ISO, Number(red.dataset.raedit)); return; }
  const rm = e.target.closest('[data-rarm]');
  if (rm) {
    const d = state.cursorDay || TODAY_ISO;
    writeDay(d, { ra: (dayOf(d).ra || []).filter((_, k) => k !== Number(rm.dataset.rarm)) });
    closeSheet(); render(); return;
  }
  const open = e.target.closest('[data-open]');
  if (open) {
    if (open.dataset.open === 'ra') sheetRA(state.cursorDay || TODAY_ISO, null);
    else if (open.dataset.open === 'rah') sheetRAHours(state.cursorDay || TODAY_ISO);
    else if (open.dataset.open === 'block') sheetBlock(state.cursorDay || TODAY_ISO, null);
    else if (open.dataset.open === 'obj') sheetObjective(null);
    return;
  }
  if (e.target.closest('#raCfg')) { sheetSettings(); return; }
  if (e.target.closest('#dlDay')) { downloadDayIcs(state.cursorDay || TODAY_ISO); return; }
  if (e.target.closest('#dlWeek')) { downloadWeekIcs(state.cursor); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-adjstart]');
  if (!t) return;
  adjustDay(state.cursorDay || TODAY_ISO, t.dataset.adjstart, { start: t.value || '' });
  render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (scrim().classList.contains('on')) { closeSheet(); return; }
  if (state.focus) { state.focus = null; state.focusName = ''; render(); }

const shift = (n) => {
  if (state.view === 'today') {
    const d = addDays(parseISO(state.cursorDay || TODAY_ISO), n);
    // look back as far as you like, but forward only to the end of this week —
    // the plan beyond that isn't drawn up yet
    if (n > 0 && iso(d) > weekDates(THIS_WEEK)[6]) return;
    state.cursorDay = iso(d); state.cursor = weekKeyOf(d);
  } else {
    const k = iso(addDays(parseISO(state.cursor), n * 7));
    if (n > 0 && k > THIS_WEEK) return;
    state.cursor = k;
  }
  render();
};
$('#wprev').addEventListener('click', () => shift(-1));
$('#wnext').addEventListener('click', () => shift(1));
$('#moreBtn').addEventListener('click', sheetMore);
$('#bkBtn').addEventListener('click', sheetBackup);
$('#addTop').addEventListener('click', () => { state.view = 'today'; render(); sheetLogPick(state.cursorDay || TODAY_ISO); });
$('#fab').addEventListener('click', () => { state.view = 'today'; render(); sheetLogPick(state.cursorDay || TODAY_ISO); });
$('#cfgBtn').addEventListener('click', sheetSettings);
$('#dlBtn').addEventListener('click', sheetDownload);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

/* ============================ boot ============================ */
loadLocal();
render();

(async () => {
  let db = null;
  try { db = await (window.claude?.use?.('db')); } catch (e) { db = null; }
  try { DOWNLOADS = await (window.claude?.use?.('downloads')); } catch (e) { DOWNLOADS = null; }
  if (!DOWNLOADS) { const b = $('#dlBtn'); if (b) b.hidden = true; }
  if (!db) { setSync('This device only', true); return; }
  DB = db;
  setSync('Synced');
  const doc = (path, apply) => db.doc(path).onSnapshot(
    (s) => { if (s.exists) { apply(thaw(s.data())); cacheLocal(); render(); } },
    () => setSync('Sync interrupted', true));
  doc('config/settings',   (v) => { state.settings = v || {}; });
  doc('config/objectives', (v) => { state.objectives = v.items || []; });
  doc('config/tasks',      (v) => { state.tasks = v.items || []; });
  doc('config/books',      (v) => { state.books = v.items || []; });
  doc('config/rawork',     (v) => { state.rawork = v.items || []; });
  doc('config/cats',       (v) => { state.cats = v.items || []; });
  doc('config/seminars',   (v) => { state.seminars = v.items || []; state.semMeta = { week: v.week || '', fetchedAt: v.fetchedAt || '' }; });
  doc('config/seminarPicks', (v) => { state.semPicks = v.items || []; });
  db.doc('config/schedule').onSnapshot(
    (s) => { state.schedule = (s.exists && thaw(s.data()).items) || []; cacheLocal(); render(); },
    () => {});
  setTimeout(persistWeekPlan, 4000);
  db.collection('weeks').onSnapshot(
    (snap) => {
      const next = {};
      snap.docs.forEach(d => { const v = thaw(d.data()) || {}; next[d.id] = { start: d.id, days: v.days || {} }; });
      state.weeks = next; cacheLocal(); render(); persistWeekPlan();
    },
    () => setSync('Sync interrupted', true));
})();
</script>
