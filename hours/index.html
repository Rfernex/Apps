<script>
/* ============================ helpers ============================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function thaw(v) {
  try { return structuredClone(v); }
  catch (e) { try { return JSON.parse(JSON.stringify(v)); } catch (e2) { return v; } }
}
const pad2 = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseISO = (s) => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const hm = (s) => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const toHM = (min) => `${pad2(Math.floor(((min%1440)+1440)%1440/60))}:${pad2(Math.round(((min%60)+60)%60))}`;
function dur(min, dash = true) {
  min = Math.round(min || 0);
  if (!min) return dash ? '—' : '0m';
  const h = Math.floor(min/60), m = min % 60;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}
const hrs = (min, dp = 1) => (Math.round((min/60) * 10**dp) / 10**dp).toFixed(dp);

const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWLONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dowIndex = (d) => (d.getDay() + 6) % 7;
const isWeekendIdx = (i) => i >= 5;
const mondayOf = (d) => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -dowIndex(d));
const weekKeyOf = (d) => iso(mondayOf(d));
const weekDates = (key) => { const m = parseISO(key); return Array.from({length:7}, (_, i) => iso(addDays(m, i))); };
function weekLabel(key) {
  const a = parseISO(key), b = addDays(a, 6);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MON3[b.getMonth()]} ${b.getFullYear()}`
    : `${a.getDate()} ${MON3[a.getMonth()]} – ${b.getDate()} ${MON3[b.getMonth()]} ${b.getFullYear()}`;
}
const dayStamp = (d) => `${DOWLONG[dowIndex(d)]} ${d.getDate()} ${MON3[d.getMonth()]} ${d.getFullYear()}`;
const daysUntil = (s) => Math.ceil((parseISO(s) - new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate())) / 86400000);

/* ============================ defaults ============================ */
const DEFAULT_SETTINGS = {
  wake: '07:00', sleep: '23:30',
  raTarget: 50, raMax: 60, raStart: '08:30',
  breakfastAt: '', lunchAt: '13:00', dinnerAt: '', choresAt: '', slackFloor: 60,
  overheads: [
    { id: 'hygiene',   name: 'Hygiene',          wd: 22, we: 22 },
    { id: 'breakfast', name: 'Breakfast',        wd: 10, we: 15 },
    { id: 'transport', name: 'Commute',          wd: 60, we: 0 },
    { id: 'lunch',     name: 'Lunch',            wd: 50, we: 60 },
    { id: 'dinner',    name: 'Dinner & cooking', wd: 35, we: 40 },
    { id: 'chores',    name: 'Chores & errands', wd: 15, we: 45 },
  ],
};
/** Five activity colours; RA work keeps the neutral. */
const NCOL = 6;
/** How long a sitting has to be to be worth having. Fifteen minutes of Italian is
    a real session; fifteen minutes of economic history is not. Each objective
    carries its own floor, and the planner refuses to book anything shorter. */
const MIN_BLOCK = 30;                 // the RA queue's own floor
const DEFAULT_MIN_SESSION = 30;
const minSession = (o) => {
  const n = Number(o && o.minSession);
  return isFinite(n) && n > 0 ? Math.max(5, Math.round(n)) : DEFAULT_MIN_SESSION;
};
const ACOL = (o) => (o && /^#[0-9a-f]{6}$/i.test(o.hex || ''))
  ? o.hex : `var(--c${((Number(o && o.color) || 0) % NCOL + NCOL) % NCOL})`;
const ACOLI = (i) => `var(--c${((i % NCOL) + NCOL) % NCOL})`;
/** A category of your own: it records where time went without holding you to a target. */
const catOf = (id) => (state.cats || []).find(c => c.id === id) || null;
const CCOL = (c) => (c && /^#[0-9a-f]{6}$/i.test(c.hex || '')) ? c.hex : ACOLI(Number(c && c.color) || 0);

/* ============================ state ============================ */
const TODAY = new Date();
const TODAY_ISO = iso(TODAY);
const THIS_WEEK = weekKeyOf(TODAY);
const LS = 'hoursAndDays.v1';

const state = {
  weeks: {}, objectives: [], tasks: [], books: [], rawork: [], cats: [], settings: {},
  seminars: [], semMeta: {}, semPicks: [],   // the Bocconi list (fetched every Saturday) and your picks
  schedule: [],    // automated email reports Claude has set up for this app
  view: 'today', cursor: THIS_WEEK, cursorDay: TODAY_ISO,
};
let DB = null, DOWNLOADS = null;

const cfg = () => {
  const c = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
  if (!Array.isArray(c.overheads) || !c.overheads.length) c.overheads = DEFAULT_SETTINGS.overheads;
  return c;
};
const weekOf = (key) => state.weeks[key] || { start: key, days: {} };
const dayOf = (d) => ({ ...(weekOf(weekKeyOf(parseISO(d))).days?.[d] || { ra: [], raq: 0, log: {}, adj: {}, blocks: [] }), _d: d });

function cacheLocal() {
  try { localStorage.setItem(LS, JSON.stringify({
    weeks: state.weeks, objectives: state.objectives, tasks: state.tasks,
    books: state.books, rawork: state.rawork, cats: state.cats, settings: state.settings,
    schedule: state.schedule, seminars: state.seminars, semMeta: state.semMeta, semPicks: state.semPicks })); } catch (e) {}
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!d) return false;
    state.weeks = d.weeks || {}; state.objectives = d.objectives || [];
    state.tasks = d.tasks || []; state.books = d.books || [];
    state.rawork = d.rawork || []; state.cats = d.cats || []; state.settings = d.settings || {};
    state.schedule = d.schedule || [];
    state.seminars = d.seminars || []; state.semMeta = d.semMeta || {}; state.semPicks = d.semPicks || [];
    return true;
  } catch (e) { return false; }
}
function setSync(msg, bad) {
  const dot = $('#syncdot'), m = $('#syncmsg');
  if (dot) dot.className = 'dot' + (bad ? ' off' : '');
  if (m) m.textContent = msg;
}
const saver = (path, get) => async () => {
  cacheLocal();
  if (!DB) return;
  try { await DB.doc(path).set(get()); setSync('Synced'); }
  catch (e) { setSync('Offline — saved here', true); }
};
const persistObjectives = saver('config/objectives', () => ({ items: state.objectives }));
const persistTasks      = saver('config/tasks',      () => ({ items: state.tasks }));
const persistBooks      = saver('config/books',      () => ({ items: state.books }));
const persistRawork     = saver('config/rawork',     () => ({ items: state.rawork }));
const persistCats       = saver('config/cats',       () => ({ items: state.cats }));
// only your picks are written from here; the list itself is written by the Saturday job
const persistSemPicks   = saver('config/seminarPicks', () => ({ items: state.semPicks }));
const persistSettings   = saver('config/settings',   () => state.settings);
async function persistWeek(key) {
  cacheLocal();
  if (!DB) return;
  try { await DB.doc('weeks/' + key).set(state.weeks[key] || { start: key, days: {} }); setSync('Synced'); }
  catch (e) { setSync('Offline — saved here', true); }
}
/** Store snapshots arrive deeply frozen: replace at every level, never mutate. */
function writeDay(d, patch) {
  const key = weekKeyOf(parseISO(d));
  const wk = state.weeks[key] || { start: key, days: {} };
  const prev = wk.days[d] || { ra: [], raq: 0, log: {}, adj: {}, blocks: [] };
  state.weeks = { ...state.weeks,
    [key]: { start: key, days: { ...wk.days, [d]:
      { ra: prev.ra || [], raq: Number(prev.raq) || 0, log: prev.log || {},
        adj: prev.adj || {}, blocks: prev.blocks || [], ...patch } } } };
  persistWeek(key);
}

/* ============================ measures ============================ */
function blockMinutes(b) {
  let s = hm(b.s), e = hm(b.e);
  if (e < s) e += 1440;
  return Math.max(0, e - s - (Number(b.b) || 0));
}
const raBlockMinutes = (day) => (day.ra || []).reduce((a, b) => a + blockMinutes(b), 0);
const raMinutes = (day) => raBlockMinutes(day) + (Number(day.raq) || 0) + seminarCredit(day);

/* ---- seminars ----
   The list comes from Bocconi's newsletter; a seminar you pick is part of the job,
   so it goes on the timetable in its own vivid colour and, once it has happened,
   counts towards the RA hours — minus any minutes already inside a work block you logged. */
const SEM_TOPICS = ['Political economy', 'Labor', 'Economic history', 'Development', 'Macroeconomics', 'Finance',
  'Public economics', 'Applied micro', 'Econometrics', 'Behavioral', 'Environmental', 'Health & demography',
  'Economic theory', 'Law', 'Management', 'Accounting', 'Other'];
const isPicked = (id) => (state.semPicks || []).includes(id);
const semSpan = (x) => { const s0 = hm(x.start); let e0 = hm(x.end); if (e0 <= s0) e0 = s0 + 60; return { s: s0, e: e0 }; };
/** The seminars you picked on a date, earliest first, as clock spans. */
function attendedOn(d) {
  return (state.seminars || []).filter(x => x.date === d && isPicked(x.id))
    .map(x => ({ x, ...semSpan(x) })).sort((a, b) => a.s - b.s);
}
const NOW_MIN = TODAY.getHours() * 60 + TODAY.getMinutes();
function seminarCredit(day) {
  const d = day && day._d;
  if (!d || d > TODAY_ISO) return 0;
  const ra = (day.ra || []).map(b => { const s0 = hm(b.s), e0 = hm(b.e); return { s: s0, e: e0 < s0 ? e0 + 1440 : e0 }; });
  return attendedOn(d).filter(k => d < TODAY_ISO || k.e <= NOW_MIN).reduce((a, k) => {
    const inside = ra.reduce((t, r) => t + Math.max(0, Math.min(r.e, k.e) - Math.max(r.s, k.s)), 0);
    return a + Math.max(0, (k.e - k.s) - inside);
  }, 0);
}
const semWho = (x) => (x.speakers || []).map(p => p.name + (p.affil ? ` (${p.affil})` : '')).join(', ');
const semShort = (x) => {
  const t = x.title || x.series || 'Seminar';
  const who = (x.speakers || [])[0];
  return who && !t.toLowerCase().includes(who.name.toLowerCase().split(' ').pop()) ? `${who.name.replace(/\b([A-Z])([A-Z]+)\b/g, (m, a, b) => a + b.toLowerCase())} — ${t}` : t;
};
const manualMinutes = (day, id) => Number((day.log || {})[id]) || 0;
/** What a block contributes: the whole span unless you said how much of it counted. */
const blockCounts = (b) => {
  const n = Number(b && b.doneMin);
  return (b && b.doneMin != null && b.doneMin !== '' && isFinite(n)) ? Math.max(0, Math.min(n, blockMinutes(b))) : blockMinutes(b);
};
const blockPartial = (b) => blockCounts(b) !== blockMinutes(b);
const blockedMinutes = (day, id) => (day.blocks || [])
  .filter(b => b.objId === id).reduce((a, b) => a + blockCounts(b), 0);
/** Everything recorded against an objective for a day, however it was entered. */
const logMinutes = (day, id) => manualMinutes(day, id) + blockedMinutes(day, id);
/** Blocks logged against nothing in particular. */
const looseBlocks = (day) => (day.blocks || []).filter(b => !b.objId);
const dailyTarget = (o) => Math.round(((Number(o.dailyMin) || 0) + (Number(o.dailyMax) || Number(o.dailyMin) || 0)) / 2);
const weeklyTarget = (o) => (o.cadence === 'daily' ? dailyTarget(o) * 7 : Math.round(Number(o.weeklyMin) || 0));

/** Work-related or leisure. An objective made before the distinction existed has
 *  neither, counts as leisure, and is nudged towards being sorted. */
const isWork = (o) => !!o && o.work === true;
const isUnsorted = (o) => !!o && o.work !== true && o.work !== false;
const workFirst = (list) => [...list.filter(isWork), ...list.filter(o => !isWork(o))];
const kindChip = (o) => isWork(o) ? '<span class="chip kwork">work</span>'
  : isUnsorted(o) ? '<span class="chip risk">unsorted</span>' : '<span class="chip">leisure</span>';

const tasksOf = (objId) => state.tasks.filter(t => t.objectiveId === objId);
const openTasks = (objId) => tasksOf(objId).filter(t => !t.done)
  .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (b.estH || 0) - (a.estH || 0));
const booksOf = (objId) => state.books.filter(b => b.objectiveId === objId && !b.done);
/** Any book of an objective, finished ones included, for naming what a past block was. */
const anyBook = (id) => state.books.find(b => b.id === id) || null;
const currentBook = (objId) => booksOf(objId).find(b => b.current) || booksOf(objId)[0] || null;
/** Hours a task still needs, from its live estimate minus what is done. */
const taskLeft = (t) => Math.max(0, (Number(t.estH) || 0) - (Number(t.doneH) || 0));
const bookLeft = (b) => Math.max(0, (Number(b.estH) || 0) - (Number(b.doneH) || 0));

const PRIO = { 1: 'urgent', 2: 'normal', 3: 'when there is room' };
const raLeft = (t) => Math.max(0, (Number(t.estH) || 0) - (Number(t.doneH) || 0));
/** Highest priority first, then by deadline, then by what is left. */
const raQueue = () => state.rawork.filter(t => !t.done)
  .sort((a, b) => (Number(a.priority) || 2) - (Number(b.priority) || 2)
    || (a.due || '9999').localeCompare(b.due || '9999')
    || raLeft(b) - raLeft(a));

/**
 * Fit the RA queue into the week's working hours.
 *
 * Each weekday holds the same share of the weekly aim. Tasks are taken in
 * priority order and poured into the days until either the queue or the week
 * runs out — so raising an estimate pushes everything behind it later, and
 * finishing something early pulls the next task forward, with no re-planning
 * by hand.
 */
function raWorkPlan() {
  const c = cfg();
  const perDay = Math.round((Number(c.raTarget) || 0) * 60 / 5);
  const days = [[], [], [], [], [], [], []];
  let di = 0, room = perDay;
  for (const t of raQueue()) {
    let need = Math.round(raLeft(t) * 60);
    if (need <= 0) { days[Math.min(di, 4)].push({ id: t.id, title: t.title, minutes: 0, t }); continue; }
    while (need > 0 && di < 5) {
      // a sliver under MIN_BLOCK isn't worth sitting down for — push it to the
      // next day, unless it's genuinely all that's left of the task
      const minTake = Math.min(MIN_BLOCK, need);
      if (room < minTake) { di++; room = perDay; if (di >= 5) break; continue; }
      const take = Math.min(need, room);
      if (take > 0) { days[di].push({ id: t.id, title: t.title, minutes: take, t }); need -= take; room -= take; }
    }
    if (di >= 5) break;
  }
  const scheduled = days.flat().reduce((a, x) => a + x.minutes, 0);
  const queued = raQueue().reduce((a, t) => a + raLeft(t) * 60, 0);
  return Object.assign(days, { scheduled, queued, spill: Math.max(0, queued - scheduled), perDay });
}

/* ============================ the week plan ============================ */
/**
 * Waking minutes, less the fixed overheads, less the RA hours the day carries,
 * is what a day can hold. Daily-cadence work takes its slice out of every day.
 * What is left is shared between the weekly blocks in proportion to the room
 * each day still has — which is why the bench and the reading fall at the
 * weekend, where there is no RA work and no commute, without being told to.
 */
function planWeek() {
  const c = cfg();
  const awake = Math.max(60, hm(c.sleep) - hm(c.wake));
  const raPerWeekday = Math.round((Number(c.raTarget) || 0) * 60 / 5);
  const floor = Math.max(0, Number(c.slackFloor) || 0);

  const days = DOW.map((_, i) => {
    const we = isWeekendIdx(i);
    const overhead = c.overheads.reduce((a, o) => a + (Number(we ? o.we : o.wd) || 0), 0);
    const ra = we ? 0 : raPerWeekday;
    return { i, we, awake, overhead, ra, alloc: {}, capacity: Math.max(0, awake - overhead - ra) };
  });

  /* What the week can actually hand out, once a floor of unclaimed time each
     day is set aside. Objectives are then served strictly in priority order:
     the urgent ones get their whole target, and whatever runs out, runs out at
     the bottom of the list rather than being shaved off everything equally.
     Work-related objectives come first whatever their priority; priority then
     orders each kind on its own, so leisure is what gets cut when the week is short. */
  let purse = days.reduce((a, d) => a + d.capacity, 0) - floor * 7;
  const ranked = state.objectives.slice().sort((a, b) =>
    (isWork(b) - isWork(a))
    || ((Number(a.priority) || 2) - (Number(b.priority) || 2))
    || state.objectives.indexOf(a) - state.objectives.indexOf(b));
  const grant = {}, shortfalls = [];
  for (const o of ranked) {
    const want = weeklyTarget(o);
    const got = Math.max(0, Math.min(want, purse));
    grant[o.id] = got; purse -= got;
    if (got < want - 1) shortfalls.push({ o, want, got });
  }

  const daily = state.objectives.filter(o => o.cadence === 'daily');
  const weekly = state.objectives.filter(o => o.cadence !== 'daily');
  for (const d of days) {
    let free = d.capacity;
    for (const o of daily) { const t = Math.round(grant[o.id] / 7); d.alloc[o.id] = t; free -= t; }
    d.room = Math.max(0, free);
    d.left = d.room;   // shrinks as each weekly objective below claims its share
  }
  for (const o of weekly) {
    const target = grant[o.id], floorFor = minSession(o);
    const totalLeft = days.reduce((a, d) => a + d.left, 0) || 1;
    // largest-remainder apportionment against what each day still has free —
    // objectives are placed one after another against the *remaining* room,
    // so a day an earlier objective already filled isn't also overbooked by
    // this one, and no single day (Sunday, always last under the old rule)
    // absorbs the whole week's rounding slack by itself
    const raw = days.map(d => Math.min(d.left, target * d.left / totalLeft));
    const base = raw.map(Math.floor);
    let leftover = target - base.reduce((a, v) => a + v, 0);
    const byFrac = days.map((_, k) => k).sort((a, b) => (raw[b] - base[b]) - (raw[a] - base[a]));
    for (const k of byFrac) {
      if (leftover <= 0) break;
      if (base[k] >= days[k].left) continue;   // no room left here to round up into
      base[k]++; leftover--;
    }
    days.forEach((d, k) => { d.alloc[o.id] = Math.max(0, base[k]); d.left -= d.alloc[o.id]; });

    // a day's slice is either long enough to be worth sitting down for or it is
    // not scheduled at all — fold anything under this objective's own floor
    // into a day that still has room to spare, rather than piling it all onto
    // whichever single day happened to end up with the most of it (which, run
    // over every objective, turned one weekend day into a dumping ground and
    // left the other comparatively idle)
    let carry = 0;
    for (let k = 0; k < days.length; k++) {
      const v = days[k].alloc[o.id] || 0;
      if (v > 0 && v < floorFor) { carry += v; days[k].alloc[o.id] = 0; days[k].left += v; }
    }
    if (leftover > 0) carry += leftover;   // the week had no room left anywhere for this much
    if (carry > 0) {
      const order = days.map((_, k) => k).sort((a, b) => {
        // top up a day that already clears the floor before opening a new one,
        // then prefer whichever day still has the most unclaimed room
        const ca = (days[a].alloc[o.id] || 0) >= floorFor, cb = (days[b].alloc[o.id] || 0) >= floorFor;
        if (ca !== cb) return ca ? -1 : 1;
        return days[b].left - days[a].left;
      });
      for (const k of order) {
        if (carry <= 0) break;
        const already = (days[k].alloc[o.id] || 0) >= floorFor;
        const room = days[k].left;
        if (room <= 0) continue;
        const take = Math.min(carry, room);
        if (!already && take < floorFor) continue;   // would only open a fresh sliver
        days[k].alloc[o.id] = (days[k].alloc[o.id] || 0) + take;
        days[k].left -= take; carry -= take;
      }
      // nothing left could take a whole floor-length sitting — extend a day
      // that already has some of this objective on it (lengthening a real
      // sitting is always safe) rather than open a new one too short to count
      if (carry > 0) {
        const withAlloc = days.map((_, k) => k).filter(k => (days[k].alloc[o.id] || 0) > 0);
        const pool = withAlloc.length ? withAlloc : days.map((_, k) => k);
        const fallback = pool.reduce((a, b) => days[b].left > days[a].left ? b : a);
        days[fallback].alloc[o.id] = (days[fallback].alloc[o.id] || 0) + carry;
        days[fallback].left -= carry;
      }
    }
  }
  for (const d of days) {
    d.planned = Object.values(d.alloc).reduce((a, v) => a + v, 0);
    d.slack = d.awake - d.overhead - d.ra - d.planned;
  }
  const wd = days.filter(d => !d.we), we = days.filter(d => d.we);
  const overheadWeek = days.reduce((a, d) => a + d.overhead, 0);
  const committed = days.reduce((a, d) => a + d.ra + d.planned, 0);
  return {
    days, awake, awakeWeek: awake * 7, overheadWeek, committed, grant, shortfalls, floor,
    weekdaySlack: wd.reduce((a, d) => a + d.slack, 0) / (wd.length || 1),
    weekendSlack: we.reduce((a, d) => a + d.slack, 0) / (we.length || 1),
    raWeek: days.reduce((a, d) => a + d.ra, 0),
    pursuitWeek: days.reduce((a, d) => a + d.planned, 0),
    slackWeek: awake * 7 - overheadWeek - committed,
    feasible: days.every(d => d.slack >= 0),
    tightest: days.reduce((m, d) => (d.slack < m.slack ? d : m), days[0]),
  };
}

/**
 * A day may depart from the week's plan: something dropped, something given
 * more or less time, something pinned to an hour. Whatever is freed by a drop
 * is offered to the objectives furthest behind their weekly pace, so skipping
 * one thing today quietly helps whatever is suffering most.
 */
function effectiveAlloc(d, dp) {
  const day = dayOf(d), adj = day.adj || {};
  const skip = adj.skip || [], mins = adj.mins || {}, loose = adj.loose || [];
  const alloc = {};
  let freed = 0, unclaimed = 0;
  for (const o of state.objectives) {
    const base = dp.alloc[o.id] || 0;
    // dropped and left unclaimed: the hour goes back to the day, not to another objective
    if (loose.includes(o.id)) { unclaimed += base; alloc[o.id] = 0; continue; }
    if (skip.includes(o.id)) { freed += base; alloc[o.id] = 0; continue; }
    const v = mins[o.id] != null ? Math.max(0, Math.round(mins[o.id])) : base;
    alloc[o.id] = v;
    freed += base - v;
  }
  if (freed > 5) {
    const rep0 = weekReport(weekKeyOf(parseISO(d)));
    const behind = state.objectives
      .filter(o => !skip.includes(o.id) && !loose.includes(o.id) && mins[o.id] == null)
      .map(o => { const r = rep0.rows.find(x => x.id === o.id); return { o, gap: Math.max(0, (r ? r.expected - r.actual : 0)) * (isWork(o) ? 3 : 1) }; })
      .filter(x => x.gap > 0);
    const total = behind.reduce((a, x) => a + x.gap, 0);
    if (total > 0) for (const x of behind) alloc[x.o.id] += Math.round(freed * x.gap / total);
  }
  return { alloc, adj, skip: [...skip, ...loose], mins, loose, freed: Math.max(0, freed), unclaimed,
           touched: skip.length > 0 || loose.length > 0 || Object.keys(mins).length > 0 || Object.keys(adj.start || {}).length > 0 };
}

/**
 * Turn a day's hour budget into actual clock time.
 *
 * Anchors go down first — waking and washing, the commute either side of the
 * work block, meals at the hours people eat — and the RA block sits wherever
 * it was really worked, or where it is meant to be. Whatever gaps survive get
 * filled with the day's objectives, shortest habits first so they land early,
 * then the long blocks in the widest gaps left. Each slot is then told what to
 * actually do in it: the next task, or the book on the go.
 */
function scheduleDay(d) {
  const c = cfg();
  const dt = parseISO(d), i = dowIndex(dt), we = isWeekendIdx(i);
  const plan = planWeek(), dp = plan.days[i];
  const day = dayOf(d);
  const wake = hm(c.wake); let sleep = hm(c.sleep);
  if (sleep <= wake) sleep += 1440;

  const fixed = [];
  const oh = (id) => c.overheads.find(o => o.id === id) || { wd: 0, we: 0 };
  const ohMin = (id) => {
    const ov = day.adj && day.adj.mins && day.adj.mins['oh:' + id];
    if (ov !== undefined && ov !== null) return Math.max(0, Number(ov) || 0);
    return Number(we ? oh(id).we : oh(id).wd) || 0;
  };

  const hyg = ohMin('hygiene');
  const bfast = ohMin('breakfast'), lunch = ohMin('lunch'), dinner = ohMin('dinner'), chores = ohMin('chores');
  /** A fixed part of the day sits at today's pin, else at the usual hour, else where the day leaves it. */
  const anchorAt = (key, fallback) => {
    const pin = (day.adj && day.adj.start && day.adj.start['oh:' + key]) || '';
    const set = c[key + 'At'] || '';
    return pin ? hm(pin) : set ? hm(set) : fallback;
  };
  /** Where a block you logged actually sits, so nothing unasked-for is laid on top of it. */
  const busy = (day.blocks || []).map(b => { const st = hm(b.s), en = hm(b.e); return { s: st, e: en < st ? en + 1440 : en }; });
  // seminars you picked are fixed points: meals and objectives step round them
  const sems = attendedOn(d);
  for (const k of sems) busy.push({ s: k.s, e: k.e });
  busy.sort((a, b) => a.s - b.s);
  /** An hour you have not fixed yourself steps past anything already logged. */
  const anchorFree = (key, fallback, len) => {
    const pin = (day.adj && day.adj.start && day.adj.start['oh:' + key]) || '';
    if (pin || c[key + 'At']) return anchorAt(key, fallback);
    let t = fallback, moved = true, guard = 0;
    while (moved && guard++ < 12) { moved = false;
      for (const x of busy) if (t < x.e && t + len > x.s) { t = x.e; moved = true; } }
    return t;
  };
  const lunchAt = anchorAt('lunch', hm('13:00'));
  const bfAt = Math.max(wake, anchorFree('breakfast', wake + hyg, bfast));
  // washing comes first, unless you have put breakfast before it
  const washAt = (bfast && bfAt < wake + hyg) ? bfAt + bfast : wake;
  if (hyg) fixed.push({ s: washAt, e: washAt + hyg, kind: 'over', label: 'Wash and dress', ohId: 'hygiene' });
  if (bfast) fixed.push({ s: bfAt, e: bfAt + bfast, kind: 'over', label: 'Breakfast', anchor: 'breakfast', ohId: 'breakfast' });

  // the work block: as really logged, else where the plan puts it
  const logged = (day.ra || []).slice().sort((a, b) => hm(a.s) - hm(b.s));
  const raBlocks = logged.length
    ? logged.map((b, k) => ({ s: hm(b.s), e: hm(b.s) + (hm(b.e) < hm(b.s) ? hm(b.e) + 1440 : hm(b.e)) - hm(b.s),
        br: Number(b.b) || 0, real: true, raIdx: k, what: b.what || '', forWhom: b.forWhom || '' }))
    : (Number(day.raq) || 0) > 0
      // hours logged as a lump, with no break of their own — if the usual
      // lunch hour falls inside the span it worked through, add it on top
      // rather than let the block silently run straight through midday
      ? (() => { const s = hm(c.raStart), raq = Number(day.raq) || 0,
          within = lunch && lunchAt >= s + 30 && lunchAt + lunch <= s + raq - 30;
          return [{ s, e: s + raq + (within ? lunch : 0), br: within ? lunch : 0, real: false, quick: true }]; })()
      : (dp.ra ? [{ s: hm(c.raStart), e: hm(c.raStart) + dp.ra + lunch, br: lunch, real: false }] : []);
  // a seminar is work: outside the planned block it shortens the block by as much;
  // inside, it simply takes those minutes (carved out below). Hours typed in as a
  // lump are work on top, so that block is pushed longer rather than cut.
  if (sems.length && raBlocks.length === 1 && !raBlocks[0].real) {
    const b = raBlocks[0];
    const over = (e) => sems.reduce((a, k) => a + Math.max(0, Math.min(k.e, e) - Math.max(k.s, b.s)), 0);
    if (b.quick) b.e += over(b.e);
    else {
      // the block ends where its own work plus every seminar adds up to the day's hours
      const want = Math.max(30, dp.ra - sems.reduce((a, k) => a + (k.e - k.s), 0));
      let e = b.s + (b.br || 0) + want;
      for (let g = 0; g < 6; g++) e = b.s + (b.br || 0) + want + over(e);
      b.e = e;
    }
  }
  // you leave once the last work block is done and any seminar starting within the next
  // hour and a half is over too — nobody goes home to come back for it
  const homeAt = raBlocks.length ? sems.reduce((t, k) =>
    (k.s < t + 90 && k.e > t && k.s >= raBlocks[raBlocks.length - 1].s) ? k.e : t, raBlocks[raBlocks.length - 1].e) : 0;
  const raPlanForDay = raWorkPlan()[i] || [];
  const eff = effectiveAlloc(d, dp);
  const pins = (day.adj && day.adj.start) || {};
  const commute = ohMin('transport');
  let lunchPlaced = false;
  for (const b of raBlocks) {
    if (commute && b === raBlocks[0]) fixed.push({ s: Math.max(wake, b.s - Math.round(commute/2)), e: b.s, kind: 'over', label: 'Commute out', ohId: 'transport' });
    // carve the block into the tasks the queue says belong in this day
    const share = raPlanForDay.slice();
    const workMin = b.e - b.s - (b.br || 0);
    if (b.real && (b.what || b.forWhom)) {
      // you said what this block was, so the queue does not get to guess
      const mid = b.br && lunchAt >= b.s + 30 && lunchAt + b.br <= b.e - 30 ? lunchAt : null;
      const seg = (s0, e0) => fixed.push({ s: s0, e: e0, kind: 'work', label: b.what || 'RA work',
        what: b.forWhom ? 'for ' + b.forWhom : '', raIdx: b.raIdx, br: mid ? 0 : (b.br || 0) });
      if (mid) { seg(b.s, mid); fixed.push({ s: mid, e: mid + b.br, kind: 'over', label: 'Lunch', anchor: 'lunch', ohId: 'lunch' }); seg(mid + b.br, b.e); lunchPlaced = true; }
      else seg(b.s, b.e);
    } else if (share.length && workMin > 20) {
      const want = share.reduce((a, x) => a + x.minutes, 0) || 1;
      // the break falls at the hour you keep lunch, if that sits inside the block
      const preferred = lunchAt >= b.s + 30 && lunchAt + (b.br || 0) <= b.e - 30 ? lunchAt : b.s + Math.round(workMin / 2);
      let cur = b.s, midBreak = b.br ? preferred : null, breakDone = !b.br;
      const raIdx = b.raIdx;
      share.forEach((x, k) => {
        let len = k === share.length - 1 ? (b.e - (b.br || 0)) - cur : Math.round(workMin * x.minutes / want);
        if (len < 10) return;
        if (!breakDone && cur + len > midBreak) {
          fixed.push({ s: cur, e: midBreak, kind: 'work', label: x.title, raTask: x.id, raIdx });
          fixed.push({ s: midBreak, e: midBreak + b.br, kind: 'over', label: 'Lunch', anchor: 'lunch', ohId: 'lunch' });
          cur = midBreak + b.br; len -= (midBreak - cur + b.br); breakDone = true; lunchPlaced = true;
          len = Math.max(10, len);
        }
        fixed.push({ s: cur, e: Math.min(cur + len, b.e), kind: 'work', label: x.title, raTask: x.id, raIdx });
        cur += len;
      });
      if (cur < b.e - 5) fixed.push({ s: cur, e: b.e, kind: 'work', label: 'RA work', br: breakDone ? 0 : b.br, raIdx });
    } else {
      // no named task to carve the block around, but a break still deserves
      // its own visible row rather than sitting silently inside a single
      // "RA work" bar that runs longer than the hours it claims
      const label = b.real ? 'RA work' : b.quick ? 'RA work' : 'RA work (planned)';
      const what = b.quick ? 'logged as hours, not as a block' : '';
      const mid = b.br && lunchAt >= b.s + 30 && lunchAt + b.br <= b.e - 30 ? lunchAt : null;
      if (mid) {
        fixed.push({ s: b.s, e: mid, kind: 'work', label, what, raIdx: b.raIdx, quickRa: !!b.quick });
        fixed.push({ s: mid, e: mid + b.br, kind: 'over', label: 'Lunch', anchor: 'lunch', ohId: 'lunch' });
        fixed.push({ s: mid + b.br, e: b.e, kind: 'work', label, what, raIdx: b.raIdx, quickRa: !!b.quick });
        lunchPlaced = true;
      } else {
        fixed.push({ s: b.s, e: b.e, kind: 'work', label, what, br: b.br, raIdx: b.raIdx, quickRa: !!b.quick });
      }
    }
    if (commute && b === raBlocks[raBlocks.length - 1]) fixed.push({ s: homeAt, e: homeAt + Math.round(commute/2), kind: 'over', label: 'Commute home', ohId: 'transport' });
  }
  // lunch never landed inside a work block above — either there is no work
  // block to carve it out of, or the one there is doesn't actually reach
  // over the lunch hour (ends right at it, say). It still gets a slot of
  // its own, stepped past whatever is already down rather than laid on top.
  if (!lunchPlaced && lunch) {
    let at = lunchAt, moved = true, guard = 0;
    while (moved && guard++ < 20) { moved = false;
      for (const x of [...fixed, ...busy]) if (x.e > x.s && at < x.e && at + lunch > x.s) { at = x.e; moved = true; } }
    fixed.push({ s: at, e: at + lunch, kind: 'over', label: 'Lunch', anchor: 'lunch', ohId: 'lunch' });
  }
  if (sems.length) {
    // lunch that lands on a seminar moves to just after it, unless you fixed it for the day
    const L = fixed.find(f => f.anchor === 'lunch');
    const oldL = L ? { s: L.s, e: L.e } : null;
    if (L && !(day.adj && day.adj.start && day.adj.start['oh:lunch'])) {
      let moved = true, guard = 0;
      while (moved && guard++ < 10) { moved = false;
        for (const k of sems) if (L.s < k.e && L.e > k.s) { const len = L.e - L.s; L.s = k.e; L.e = k.e + len; moved = true; } }
    }
    const cut = [...sems.map(k => ({ s: k.s, e: k.e })), ...(L ? [{ s: L.s, e: L.e }] : [])];
    for (let k = fixed.length - 1; k >= 0; k--) {
      const f = fixed[k];
      if (f.kind !== 'work') continue;
      let pieces = [{ s: f.s, e: f.e }];
      for (const c of cut) pieces = pieces.flatMap(p => (c.e <= p.s || c.s >= p.e) ? [p]
        : [p.s < c.s ? { s: p.s, e: c.s } : null, p.e > c.e ? { s: c.e, e: p.e } : null].filter(Boolean));
      pieces = pieces.filter(p => p.e - p.s >= 5);
      if (pieces.length === 1 && pieces[0].s === f.s && pieces[0].e === f.e) continue;
      const longest = pieces.reduce((m, p, j) => (p.e - p.s > pieces[m].e - pieces[m].s ? j : m), 0);
      fixed.splice(k, 1, ...pieces.map((p, j) => ({ ...f, s: p.s, e: p.e,
        br: f.br && j === longest && p.e - p.s > f.br + 10 ? f.br : 0 })));
    }
    // where lunch used to be, whatever the seminar does not cover is work again —
    // but only between two stretches of work, not at the edge of the day
    if (L && oldL && (L.s !== oldL.s)) {
      const near = fixed.filter(f => f.kind === 'work');
      const before = near.filter(f => f.e <= oldL.s + 1).sort((a, b) => b.e - a.e)[0];
      const after = near.filter(f => f.s >= oldL.s).sort((a, b) => a.s - b.s)[0];
      if (before && after) {
        let pieces = [oldL];
        for (const k of [...sems, L]) pieces = pieces.flatMap(p => (k.e <= p.s || k.s >= p.e) ? [p]
          : [p.s < k.s ? { s: p.s, e: k.s } : null, p.e > k.e ? { s: k.e, e: p.e } : null].filter(Boolean));
        for (const p of pieces) if (p.e - p.s >= 5) fixed.push({ ...before, s: p.s, e: p.e, br: 0 });
      }
    }
    for (const k of sems) fixed.push({ s: k.s, e: k.e, kind: 'seminar', label: semShort(k.x),
      what: [k.x.room, 'counts as RA work'].filter(Boolean).join(' · '), semId: k.x.id, col: 'var(--sem)' });
  }
  const dinnerBy = raBlocks.length ? Math.max(homeAt + Math.round(commute/2) + 10, hm('19:00')) : hm('19:30');
  const dinnerAt = anchorFree('dinner', dinnerBy, dinner);
  if (dinner) fixed.push({ s: dinnerAt, e: dinnerAt + dinner, kind: 'over', label: 'Dinner & cooking', anchor: 'dinner', ohId: 'dinner' });
  const choresAt = anchorFree('chores', dinnerAt + dinner, chores);
  if (chores) fixed.push({ s: choresAt, e: choresAt + chores, kind: 'over', label: 'Chores & errands', anchor: 'chores', ohId: 'chores' });
  fixed.sort((a, b) => a.s - b.s);

  // gaps left in the waking day (worked out after every fixed thing is placed)
  const gapsFrom = (list) => {
    const g = []; let t = wake;
    for (const f of list.slice().sort((a, b) => a.s - b.s)) { if (f.s > t) g.push({ s: t, e: f.s }); t = Math.max(t, f.e); }
    if (t < sleep) g.push({ s: t, e: sleep });
    return g;
  };
  let gaps = gapsFrom(fixed);

  // Anything pinned to an hour goes down before the gaps are worked out. It starts
  // where you pinned it but steps over whatever is already fixed there — a block you
  // logged, the work block, a meal — rather than being drawn on top of it.
  // the blocks are added to `fixed` further down, so count them in by hand here
  const taken = () => [...fixed.filter(f => f.e > f.s).map(f => ({ s: f.s, e: f.e })), ...busy]
    .sort((a, b) => a.s - b.s);
  for (const o of state.objectives) {
    const at = pins[o.id];
    // time already logged against it in a block is time it does not need booking for
    let len = Math.max(0, (eff.alloc[o.id] || 0) - blockedMinutes(day, o.id));
    if (!at || len <= 0) continue;
    const busyNow = taken();
    let cur = hm(at), guard = 0;
    while (len > 0 && cur < sleep && guard++ < 40) {
      const hit = busyNow.find(x => cur < x.e && cur + Math.min(len, 15) > x.s);
      if (hit) { cur = hit.e; continue; }
      const next = busyNow.find(x => x.s >= cur);
      const room = Math.min(len, (next ? next.s : sleep) - cur);
      if (room < Math.min(minSession(o), len)) { cur = next ? next.e : sleep; continue; }
      fixed.push({ s: cur, e: cur + room, kind: 'pursuit', label: o.name, objId: o.id, col: ACOL(o), pinned: true });
      cur += room; len -= room;
    }
  }
  // blocks you logged yourself sit where they actually happened
  for (const b of (day.blocks || [])) {
    const o = b.objId ? state.objectives.find(x => x.id === b.objId) : null;
    const ct = !o && b.catId ? catOf(b.catId) : null;
    const st = hm(b.s), en = hm(b.e) < st ? hm(b.e) + 1440 : hm(b.e);
    fixed.push({ s: st, e: en, kind: 'pursuit', label: b.label || (o ? o.name : ct ? ct.name : 'Logged block'),
                 objId: b.objId || undefined, catId: !o && b.catId ? b.catId : undefined,
                 col: o ? ACOL(o) : ct ? CCOL(ct) : 'var(--ink-3)',
                 logged: true, blockId: b.id,
                 partial: blockPartial(b) ? blockCounts(b) : 0,
                 bookId: b.bookId || '',
                 what: [b.bookId && b.bookId !== '__none' && anyBook(b.bookId) ? anyBook(b.bookId).title : '',
                        blockPartial(b) ? `${dur(blockCounts(b), false)} of it counted` : '',
                        b.note || (o ? '' : ct ? ct.name : 'logged, outside the objectives')].filter(Boolean).join(' · ') });
  }
  fixed.sort((a, b) => a.s - b.s);

  // objectives, short habits first so they land in the morning gaps
  const wants = state.objectives
    .filter(o => !pins[o.id])
    .map(o => ({ o, min: Math.max(0, (eff.alloc[o.id] || 0) - blockedMinutes(day, o.id)) }))
    .filter(x => x.min > 0)
    .sort((a, b) => (a.o.cadence === 'daily' ? 0 : 1) - (b.o.cadence === 'daily' ? 0 : 1) || a.min - b.min);

  gaps = gapsFrom(fixed);
  const placed = [];
  for (const w of wants) {
    let need = w.min;
    // a gap too short for this subject is no use to it, and neither is the last
    // sliver of its own allocation: better to leave it unplaced and say so
    const floorFor = Math.min(minSession(w.o), w.min);
    for (const g of gaps) {
      if (need <= 0) break;
      const room = g.e - g.s;
      if (room < floorFor) continue;
      const take = Math.min(need, room);
      if (take < floorFor) continue;
      placed.push({ s: g.s, e: g.s + take, kind: 'pursuit', label: w.o.name, objId: w.o.id, col: ACOL(w.o),
                    minSession: minSession(w.o) });
      g.s += take; need -= take;
    }
    if (need > 0) placed.push({ s: null, e: null, kind: 'pursuit', label: w.o.name, objId: w.o.id, col: ACOL(w.o),
                                unplaced: need, tooShort: need < minSession(w.o) });
  }

  // what to actually do in each slot
  for (const f of fixed) {
    if (!f.raTask) continue;
    const t = state.rawork.find(x => x.id === f.raTask);
    if (t) f.what = [t.forWhom ? 'for ' + t.forWhom : '', raLeft(t) ? `~${hrs(raLeft(t)*60,1)}h left` : ''].filter(Boolean).join(' · ');
  }
  for (const p of placed) {
    const bk = currentBook(p.objId);
    const tk = openTasks(p.objId)[0];
    if (bk) p.what = `${bk.title}${bk.author ? ' · ' + bk.author : ''}${bookLeft(bk) ? ` · ~${hrs(bookLeft(bk)*60,0)}h left` : ''}`;
    else if (tk) p.what = tk.text + (taskLeft(tk) ? ` · ~${hrs(taskLeft(tk)*60,0)}h left` : '');
  }

  const slots = [...fixed, ...placed.filter(p => p.s !== null)].sort((a, b) => a.s - b.s);
  const rest = [];
  let u = wake;
  for (const s of slots) { if (s.s > u + 5) rest.push({ s: u, e: s.s, kind: 'rest', label: 'Unclaimed' }); u = Math.max(u, s.e); }
  if (u < sleep - 5) rest.push({ s: u, e: sleep, kind: 'rest', label: 'Unclaimed' });

  const all = [...slots, ...rest].sort((a, b) => a.s - b.s);
  all.forEach((x, k) => { x.k = slotKey(x); x.i = k; });
  return {
    date: d, i, we, wake, sleep, dp, eff, alloc: eff.alloc, pins,
    slots, rest, all,
    unplaced: placed.filter(p => p.s === null),
    workMin: slots.filter(s => s.kind === 'work').reduce((a, s) => a + (s.e - s.s - (s.br || 0)), 0),
    semMin: slots.filter(s => s.kind === 'seminar').reduce((a, s) => a + (s.e - s.s), 0),
    pursuitMin: placed.filter(p => p.s !== null).reduce((a, s) => a + (s.e - s.s), 0),
    overMin: fixed.filter(f => f.kind === 'over').reduce((a, s) => a + (s.e - s.s), 0),
  };
}

function weekReport(key) {
  const plan = planWeek();
  const dates = weekDates(key);
  const rows = [];
  const isCurrent = key === THIS_WEEK;
  const todayIdx = isCurrent ? dowIndex(TODAY) : 6;
  const c = cfg();

  const raByDay = dates.map(d => raMinutes(dayOf(d)));
  rows.push({
    id: 'ra', name: 'RA work', kind: 'band', isRA: true,
    byDay: raByDay, actual: raByDay.reduce((a, v) => a + v, 0),
    target: (Number(c.raTarget) || 0) * 60, max: (Number(c.raMax) || 0) * 60,
    plan: plan.days.map(d => d.ra),
    expected: plan.days.slice(0, todayIdx + 1).reduce((a, d) => a + d.ra, 0),
  });
  for (const o of state.objectives) {
    const byDay = dates.map(d => logMinutes(dayOf(d), o.id));
    rows.push({
      id: o.id, name: o.name, kind: 'floor', obj: o,
      byDay, actual: byDay.reduce((a, v) => a + v, 0), target: weeklyTarget(o),
      plan: plan.days.map(d => d.alloc[o.id] || 0),
      expected: plan.days.slice(0, todayIdx + 1).reduce((a, d) => a + (d.alloc[o.id] || 0), 0),
    });
  }
  return { key, dates, plan, rows, isCurrent, todayIdx };
}

function statusOf(row) {
  // RA work has to reach the required hours and stay under the cap: both ends are misses
  if (row.kind === 'band') {
    if (row.actual > row.max) return { word: 'over the cap', col: 'neg' };
    const exp = row.expected || 0;
    if (exp > 0 && row.actual < exp * 0.85) return { word: 'behind the hours', col: 'neg' };
    if (exp > 0 && row.actual < exp * 0.97) return { word: 'a little short', col: 'warn' };
    if (row.actual > row.max * 0.93) return { word: 'nearing the cap', col: 'warn' };
    return { word: 'in the band', col: 'pos' };
  }
  const r = row.actual / Math.max(1, row.expected);
  if (r >= 0.95) return { word: 'on pace', col: 'pos' };
  if (r >= 0.7) return { word: 'slipping', col: 'warn' };
  return { word: 'behind', col: 'neg' };
}

/* ============================ views ============================ */
const I_INFO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';
const I_WARN = '<svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>';
const I_TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const SWATCH = { work: 'var(--work)', pursuit: 'var(--pursuit)', over: 'var(--line-strong)', rest: 'transparent' };
const swatchOf = (s) => s.col || SWATCH[s.kind];

/** The signature: the waking day drawn to scale, on a real clock rule. */
function dayRule(sch) {
  const span = sch.sleep - sch.wake;
  const pc = (m) => ((m - sch.wake) / span * 100);
  let ticks = '';
  for (let t = Math.ceil(sch.wake / 60) * 60; t < sch.sleep; t += 60) {
    const h = (Math.floor(t / 60)) % 24, big = h % 3 === 0;
    ticks += `<i class="tick${big ? ' hr3' : ''}" style="left:${pc(t).toFixed(3)}%"></i>`;
    if (big) ticks += `<span class="tlab" style="left:${pc(t).toFixed(3)}%">${pad2(h)}</span>`;
  }
  const blocks = sch.slots.map(s => {
    const w = pc(s.e) - pc(s.s);
    if (w <= 0) return '';
    return `<button type="button" class="blk ${s.kind}${isFocused(s) ? ' on' : ''}" data-slot="${esc(s.k)}"
      style="left:${pc(s.s).toFixed(3)}%;width:${w.toFixed(3)}%${s.col ? ';background:' + s.col : ''}"
      title="${esc(s.label)} · ${toHM(s.s)}–${toHM(s.e)}">${w > 7 ? `<span>${esc(s.label)}</span>` : ''}</button>`;
  }).join('');
  const nowM = hm(`${TODAY.getHours()}:${TODAY.getMinutes()}`);
  const showNow = sch.date === TODAY_ISO && nowM >= sch.wake && nowM <= sch.sleep;
  return `<div class="rule${state.focus ? ' picking' : ''}">
    <div class="track"></div>${ticks}${blocks}
    ${showNow ? `<i class="now" style="left:${pc(nowM).toFixed(3)}%"></i>` : ''}
    <div class="caps"><span>${toHM(sch.wake)} up</span><span>${toHM(sch.sleep)} down</span></div>
  </div>
  <div class="legend" style="margin-top:14px">
    <span class="lg"><i style="background:var(--work)"></i>RA work ${dur(sch.workMin, false)}</span>
    ${sch.semMin ? `<span class="lg"><i style="background:var(--sem)"></i>Seminars ${dur(sch.semMin, false)}</span>` : ''}
    ${state.objectives.filter(o => sch.slots.some(x => x.objId === o.id)).map(o =>
      `<span class="lg"><i style="background:${ACOL(o)}"></i>${esc(o.name)}</span>`).join('')}
    <span class="lg"><i style="background:var(--line-strong)"></i>Upkeep ${dur(sch.overMin, false)}</span>
    <span class="lg" style="margin-left:auto;color:var(--ink-3)">${dur(sch.rest.reduce((a,r)=>a+(r.e-r.s),0), false)} unclaimed</span>
  </div>`;
}

/** What is currently picked out, so the rule and the list agree. */
/* A slot used to be addressed by its position in the day. Claiming an unclaimed
   hour inserts a row and renumbers every row after it, so a button rendered a
   moment earlier then acted on somebody else's slot. Address it by identity. */
function slotKey(s) {
  if (s.semId) return 's:' + s.semId;
  if (s.blockId) return 'b:' + s.blockId;
  if (s.raIdx === 0 || s.raIdx > 0) return 'w:' + s.raIdx;
  if (s.kind === 'work') return 'w:plan';
  if (s.kind === 'pursuit' && s.objId) return 'o:' + s.objId;
  if (s.kind === 'over') return 'v:' + (s.ohId || s.label) + ':' + s.s;
  return 'r:' + s.s;
}
const findSlot = (sch, key) => sch.all.find(x => x.k === key) || null;

function isFocused(s) {
  const f = state.focus;
  if (!f) return false;
  if (f.type === 'obj') return s.objId === f.id;
  if (f.type === 'ra') return s.raTask === f.id;
  if (f.type === 'over') return s.kind === 'over' && s.label === f.id;
  return false;
}
/** What tapping the ✕ on a row would do, or null when there is nothing to drop. */
function slotDrop(s) {
  if (s.semId) return { what: 'unsem', why: 'Not going after all' };
  if (s.blockId) return { what: 'remove', why: 'Remove this block' };
  if (s.raIdx === 0 || s.raIdx > 0) return { what: 'rawork', why: 'Remove this work block' };
  if (s.kind === 'work' && s.quickRa) return { what: 'raq', why: 'Clear the hours logged for this day' };
  if (s.kind === 'pursuit' && s.objId) return { what: 'loose', why: 'Drop it today and leave the time unclaimed' };
  if (s.kind === 'over' && s.ohId) return { what: 'over', why: 'Skip it today' };
  return null;
}
function agendaRows(sch) {
  return sch.all.filter(s => s.e - s.s >= 10).map(s => {
    const drop = slotDrop(s);
    return `<div class="slotrow">
      <button type="button" class="slot${s.kind === 'rest' ? ' rest' : ''}${s.kind === 'seminar' ? ' sem' : ''}${isFocused(s) ? ' on' : ''}" data-slot="${esc(s.k)}">
        <span class="when">${toHM(s.s)}–${toHM(s.e)}</span>
        <span class="swatch" style="background:${swatchOf(s)};${s.kind === 'rest' ? 'border:1px dashed var(--line-strong)' : ''}"></span>
        <span class="what"><b>${esc(s.label)}</b>${s.what ? `<span>${esc(s.what)}</span>`
          : s.br ? `<span>includes ${dur(s.br, false)} break</span>`
          : s.kind === 'rest' ? `<span>tap to log what you did</span>` : ''}</span>
        <span class="len">${dur(s.e - s.s - (s.br || 0), false)}</span>
      </button>
      ${drop ? `<button type="button" class="slotx" data-slotdrop="${esc(s.k)}" title="${esc(drop.why)}" aria-label="${esc(drop.why)}">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : '<span class="slotpad"></span>'}
    </div>`; }).join('');
}

function viewToday() {
  const d = state.cursorDay || TODAY_ISO;
  const sch = scheduleDay(d), dt = parseISO(d), i = sch.i;
  const day = dayOf(d);
  const ra = raMinutes(day);
  const pursuit = state.objectives.reduce((a, o) => a + logMinutes(day, o.id), 0);
  const rep = weekReport(weekKeyOf(dt));
  const planTotal = sch.dp.ra + Object.values(sch.alloc).reduce((a, v) => a + v, 0);
  const doneTotal = ra + pursuit;
  const diff = doneTotal - planTotal;

  const verdict = doneTotal === 0
    ? `Nothing logged for ${d === TODAY_ISO ? 'today' : DOWLONG[i].toLowerCase()} yet. The timetable below is what the week asks of it.`
    : Math.abs(diff) < 20
      ? `Square with the plan — <b class="pos">${dur(doneTotal)}</b> against ${dur(planTotal)}.`
      : diff > 0 ? `<b class="pos">${dur(diff)}</b> beyond what ${DOWLONG[i]} asks.`
                 : `<b class="warn">${dur(-diff)}</b> short of what ${DOWLONG[i]} asks.`;

  const blocks = (day.ra || []).map((b, k) => `<div class="rablock">
      <button class="raopen" data-raedit="${k}">
        <span class="t">${esc(b.s)} – ${esc(b.e)}</span>
        <span class="w">${b.what ? `<b>${esc(b.what)}</b>` : '<b>RA work</b>'}<span class="dl">${
          [b.forWhom ? 'for ' + esc(b.forWhom) : '', b.b ? dur(b.b, false) + ' break' : 'no break'].filter(Boolean).join(' · ')}</span></span>
      </button>
      <span class="m">${dur(blockMinutes(b))}</span>
      <button class="iconbtn" data-rarm="${k}" aria-label="Remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>`).join('');

  const cards = state.objectives.map(o => {
    const done = logMinutes(day, o.id), tgt = sch.alloc[o.id] || 0;
    const dropped = (sch.eff.skip || []).includes(o.id);
    const pc = tgt ? clamp(done / tgt * 100, 0, 100) : (done ? 100 : 0);
    return `<div class="qcard"${dropped ? ' style="opacity:.55"' : ''}>
      <div class="qhead"><i style="width:8px;height:8px;flex:none;background:${ACOL(o)}"></i><b>${esc(o.name)}</b>
        <span class="num" style="color:var(--${done >= tgt && tgt ? 'pos' : 'ink-3'})">${dur(done, false)}</span>
        <span class="num" style="color:var(--ink-3)">/${dropped ? 'off' : tgt ? dur(tgt, false) : '—'}</span></div>
      <div class="qprog"><i style="width:${pc.toFixed(1)}%;background:${ACOL(o)}"></i></div>
      <div class="qbtns">
        <button data-log="${o.id}" data-add="15">+15</button>
        <button data-log="${o.id}" data-add="30">+30</button>
        <button data-log="${o.id}" data-add="60">+1h</button>
        <button data-log="${o.id}" data-add="-15">−15</button>
        <button data-adj="${o.id}|${dropped ? 'reset' : 'skip'}" title="${dropped ? 'Put it back' : 'Not today'}">${dropped ? 'back' : 'off'}</button>
      </div>
    </div>`;
  }).join('');

  return { html: `
    <section class="panel lead" style="padding:20px 22px 18px">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <span class="eyebrow">${dayStamp(dt)}${d === TODAY_ISO ? ' · today' : ''}</span>
        <button class="linkish" id="dlDay" style="margin-left:auto">Send this day to Calendar</button>
      </div>
      <p class="verdict" style="margin:8px 0 4px">${verdict}</p>
      ${dayRule(sch)}
    </section>

    <section class="panel">
      <div class="panel-hd"><h2>The timetable</h2>
        <span class="sub">${(day.ra || []).length ? 'work block as logged' : 'work block as planned'} · tap any row for detail</span></div>
      ${sch.eff.touched ? `<div class="focusbar" style="border-top:none;border-bottom:1px solid var(--line);background:var(--warn-soft);color:var(--warn)">
        <span>Adjusted for today${sch.eff.unclaimed > 5 ? ` — ${dur(sch.eff.unclaimed, false)} handed back to the day` : ''}${
          (sch.eff.skip || []).length ? ' — dropped ' + (sch.eff.skip || []).map(id => {
          const oo = state.objectives.find(x => x.id === id);

/** How long ago, in the rough units people actually use. */
function timeAgo(iso8601) {
  const then = new Date(iso8601), mins = Math.round((Date.now() - then) / 60000);
  if (mins < 60) return mins <= 1 ? 'just now' : `${mins} min ago`;
  const hoursAgo = Math.round(mins / 60);
  if (hoursAgo < 48) return `${hoursAgo}h ago`;
  return `${Math.round(hoursAgo / 24)}d ago`;
}
/** The automated emails Claude has set up for this app — read-only, kept in
 *  sync by the scheduled task itself each time it actually sends one. */
function schedulePanel() {
  const items = state.schedule || [];
  if (!items.length) return '';
  return `<section class="panel">
    <div class="panel-hd"><h2>Scheduled reports</h2><span class="sub">set up outside the app</span></div>

        <td style="padding:9px 8px 9px 18px">${it.lastSentAt
          ? `<span class="num" title="${esc(it.lastSentAt)}">${timeAgo(it.lastSentAt)}</span>${it.lastSubject ? `<div style="font-size:10.5px;color:var(--ink-3)">${esc(it.lastSubject)}</div>` : ''}`

function viewWeek() {
  const rep = weekReport(state.cursor), plan = rep.plan;
  const head = `<tr><th>Objective</th>
    ${rep.dates.map((d, i) => `<th class="${d === TODAY_ISO ? 'today' : ''}">${DOW[i]}<br><span style="font-weight:400;opacity:.65">${parseISO(d).getDate()}</span></th>`).join('')}
    <th class="wk">This week</th></tr>`;

  const rowHtml = (r) => {
    const st = statusOf(r), ceiling = r.kind === 'band';
    const denom = ceiling ? r.max : Math.max(r.target, r.actual);
    const pct = denom ? clamp(r.actual / denom * 100, 0, 100) : 0;
    const col = ceiling ? 'var(--work)' : ACOL(r.obj);
    return `<tr>
      <td class="obj"><b style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;flex:none;background:${col}"></i>${esc(r.name)}</b><span style="padding-left:15px">${ceiling
        ? `at least ${hrs(r.target,0)}h · never past ${hrs(r.max,0)}h`
        : r.obj.cadence === 'daily' ? `${r.obj.dailyMin}–${r.obj.dailyMax} min a day` : `${hrs(r.target)}h a week`}</span></td>
      ${r.byDay.map((v, i) => {
        const p = r.plan[i] || 0, w = p ? clamp(v / p * 100, 0, 100) : (v ? 100 : 0);
        return `<td><button class="cell ${rep.dates[i] === TODAY_ISO ? 'is-today' : ''}"
            data-cellday="${rep.dates[i]}" data-cellobj="${r.id}"
            title="${esc(r.name)} · ${DOWLONG[i]} · logged ${dur(v,false)}, plan ${dur(p,false)}">
          <span class="v ${v ? '' : 'zero'}">${v ? hrs(v) : '·'}</span>
          <span class="pl"><i style="width:${w.toFixed(0)}%;background:${col}"></i></span></button></td>`;
      }).join('')}
      <td><div class="wkcell">
        <span class="wkfig"><b style="color:${col}">${hrs(r.actual)}h</b><span> /${hrs(r.target)}h</span></span>
        <span class="bar"><i style="width:${pct.toFixed(1)}%;background:${col}"></i>${
          ceiling && r.max ? `<span class="notch" style="left:${(r.target/r.max*100).toFixed(1)}%"></span>` : ''}</span>
        <span class="chip ${st.col === 'pos' ? 'ok' : st.col === 'warn' ? 'risk' : 'bad'}">${st.word}</span>
      </div></td></tr>`;
  };
  // Work first (the RA band and the work-related objectives), then leisure,
  // each under its own header carrying that group's hours for the week.
  const raRows = rep.rows.filter(r => r.isRA);
  const objRows = rep.rows.filter(r => !r.isRA);
  const workRows = objRows.filter(r => isWork(r.obj)), leisureRows = objRows.filter(r => !isWork(r.obj));
  const grpHead = (label, rows) => {
    const a = rows.reduce((s, r) => s + r.actual, 0), t = rows.reduce((s, r) => s + r.target, 0);
    return `<tr class="grp"><td colspan="8">${label}</td>
      <td class="wk">${rows.length ? `objectives ${hrs(a)}h / ${hrs(t)}h` : ''}</td></tr>`;
  };
  const body = grpHead('Work', [...workRows]) + raRows.map(rowHtml).join('') + workRows.map(rowHtml).join('')
    + (leisureRows.length ? grpHead('Leisure', leisureRows) + leisureRows.map(rowHtml).join('') : '');
  const nUnsorted = state.objectives.filter(isUnsorted).length;
  const unsortedNote = nUnsorted ? `<div class="banner warn">${I_WARN}<span><b>${nUnsorted}</b> objective${nUnsorted === 1 ? ' is' : 's are'} not marked work or leisure yet, so ${nUnsorted === 1 ? 'it counts' : 'they count'} as leisure. Sort ${nUnsorted === 1 ? 'it' : 'them'} on the <button class="linkish" data-nav="goals">Objectives</button> tab.</span></div>` : '';

  const foot = `<tr style="background:var(--surface-2)">
    <td class="obj"><b>Committed</b><span>work + objectives</span></td>
    ${rep.dates.map((d, i) => {
      const a = rep.rows.reduce((s, r) => s + r.byDay[i], 0);
      const p = plan.days[i].ra + plan.days[i].planned;
      return `<td><div class="cell" style="cursor:default">
        <span class="v ${a ? '' : 'zero'}">${a ? hrs(a) : '·'}</span>
        <span class="dl" style="font-size:9px">${hrs(p)}</span></div></td>`;
    }).join('')}
    <td><div class="wkcell"><span class="wkfig"><b>${hrs(rep.rows.reduce((a,r)=>a+r.actual,0))}h</b><span> /${hrs(plan.committed)}h</span></span>
      <span class="dl">planned, of ${hrs(plan.awakeWeek - plan.overheadWeek)}h awake</span></div></td></tr>`;

  return { html: `
    ${schedulePanel()}
    ${unsortedNote}

    <section class="panel lead">
      <div class="panel-hd"><h2>Plan against actual</h2>

      <div class="scroller"><table class="grid"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>

        <span class="dl" style="margin-left:auto">Tap any cell to log or correct that day's hours.</span></div>
    </section>

    ${raPanelWeek()}

    <section class="panel">
      <div class="panel-hd"><h2>How the week is meant to fall</h2><span class="sub">recomputed from your targets</span></div>
      <div class="scroller"><table class="grid">
        <thead><tr><th>Day</th><th>Awake</th><th>Commute &amp; upkeep</th><th>RA work</th><th>Work goals</th><th>Leisure</th><th class="wk">Slack</th></tr></thead>
        <tbody>${plan.days.map((d, i) => { const wkGoals = state.objectives.filter(isWork).reduce((a, o) => a + (d.alloc[o.id] || 0), 0); return `<tr>
          <td class="obj"><b>${DOWLONG[i]}</b><span>${d.we ? 'weekend' : 'weekday'}</span></td>
          <td class="num" style="text-align:center">${hrs(d.awake)}h</td>
          <td class="num" style="text-align:center;color:var(--ink-3)">${dur(d.overhead, false)}</td>
          <td class="num" style="text-align:center;color:var(--work)">${d.ra ? hrs(d.ra)+'h' : '—'}</td>
          <td class="num" style="text-align:center;color:var(--work)">${wkGoals ? hrs(wkGoals) + 'h' : '—'}</td>
          <td class="num" style="text-align:center;color:var(--pursuit)">${hrs(d.planned - wkGoals)}h</td>
          <td class="wk" style="padding-right:18px"><span class="num" style="color:var(--${d.slack<0?'neg':'ink-2'})">${hrs(d.slack)}h</span></td>
        </tr>`; }).join('')}</tbody></table></div>
      <div style="padding:12px 18px;border-top:1px solid var(--line)">
        ${plan.shortfalls.length ? `<div class="banner warn" style="margin-bottom:9px">${I_WARN}
          <span>The week cannot hold everything, so it was decided in order — work-related objectives first, then by priority: ${plan.shortfalls.map(sf =>
            `<b>${esc(sf.o.name)}</b> gets ${hrs(sf.got)}h of the ${hrs(sf.want)}h you asked for`).join('; ')}.
            Raise its priority, lower another, or cut the RA aim.</span></div>` : ''}
        <div class="banner ${plan.feasible ? '' : 'bad'}">${plan.feasible ? I_INFO : I_WARN}
          <span>${plan.feasible
            ? `It fits — ${hrs(plan.raWeek,0)}h of RA work, ${hrs(plan.pursuitWeek)}h of objectives and ${hrs(plan.overheadWeek)}h of commuting and upkeep leave <b>${hrs(plan.slackWeek)}h</b> unspoken-for. That average hides where the pressure sits: a weekday keeps only <b>${hrs(plan.weekdaySlack)}h</b> free once ${hrs(plan.days[0].ra)}h of work is in it, against <b>${hrs(plan.weekendSlack)}h</b> on a weekend day.`
            : `These targets do not fit a ${hrs(plan.awake)}h waking day. ${DOWLONG[plan.tightest.i]} is over by ${dur(-plan.tightest.slack)}. Lower a target or the RA aim.`}</span></div></div>
    </section>` };

function taskRow(t, isNext) {
  const left = taskLeft(t), est = Number(t.estH) || 0;
  const pc = est ? clamp((Number(t.doneH) || 0) / est * 100, 0, 100) : 0;
  const dd = t.due ? daysUntil(t.due) : null;
  return `<button class="row${isNext ? ' next' : ''}" role="checkbox" aria-checked="${!!t.done}" data-task="${t.id}">
    <span class="box">${I_TICK}</span>
    <span class="main"><b>${esc(t.text)}</b><span>${[
      isNext ? 'next up' : '',
      t.due ? `due ${parseISO(t.due).getDate()} ${MON3[parseISO(t.due).getMonth()]}${dd !== null && dd < 14 ? ` · ${dd}d` : ''}` : '',
      est ? `${est}h estimated` : 'no estimate',
    ].filter(Boolean).join(' · ')}</span></span>
    <span class="est">${est ? `${hrs(left*60,1)}h left` : ''}${est ? `<span class="estbar"><i style="width:${pc.toFixed(0)}%"></i></span>` : ''}</span>
    <span class="iconbtn" data-edittask="${t.id}" role="button" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/></svg></span>
  </button>`;
}

function raRow(t, when) {
  const left = raLeft(t), est = Number(t.estH) || 0;
  const pc = est ? clamp((Number(t.doneH) || 0) / est * 100, 0, 100) : 0;
  const dd = t.due ? daysUntil(t.due) : null;
  const pr = Number(t.priority) || 2;
  return `<button class="row" role="checkbox" aria-checked="${!!t.done}" data-ra="${t.id}">
    <span class="box">${I_TICK}</span>
    <span class="main"><b>${esc(t.title)}</b><span>${[
      `<span class="chip ${pr === 1 ? 'bad' : pr === 3 ? '' : 'risk'}">${PRIO[pr]}</span>`,
      t.forWhom ? 'for ' + esc(t.forWhom) : '',
      when || '',
      t.due ? `due ${parseISO(t.due).getDate()} ${MON3[parseISO(t.due).getMonth()]}${dd !== null && dd < 10 ? ` · ${dd}d` : ''}` : '',
      t.desc ? esc(t.desc) : '',
    ].filter(Boolean).join(' · ')}</span></span>
    <span class="est">${est ? `${hrs(left*60,1)}h left<span class="estbar"><i style="width:${pc.toFixed(0)}%;background:var(--work)"></i></span>` : 'no estimate'}</span>
    <span class="iconbtn" data-editra="${t.id}" role="button" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/></svg></span>
  </button>`;
}
/** Where the queue lands across the working week. */

  const rp = raWorkPlan();
  if (!state.rawork.filter(t => !t.done).length) return '';
  const byDay = rp.slice(0, 5).map((list, i) => ({ i, list }));
  return `<section class="panel">
    <div class="panel-hd"><h2>RA work, task by task</h2>

  let blocks = 0, mins = 0, days = new Set(), last = '';

      for (const b of (day.blocks || [])) if (b.catId === catId) {
        blocks++; mins += blockCounts(b); days.add(d); if (d > last) last = d;
      }
  return { blocks, mins, days: days.size, last };
}

/* ---------------- plan against actual ----------------
   Not a scorecard. The point is to see, week over week, whether the plan you drew
   up is one you actually live — and which single thing is dragging it down. */
function keptWeek(key) {
  const rep0 = weekReport(key), dates = weekDates(key);
  const upTo = key === THIS_WEEK ? dowIndex(TODAY) : 6;
  const rows = rep0.rows.map(r => {
    // only judge the days that have happened
    const planned = r.plan.slice(0, upTo + 1).reduce((a, v) => a + v, 0);
    const done = r.byDay.slice(0, upTo + 1).reduce((a, v) => a + v, 0);
    return { id: r.id, name: r.name, isRA: !!r.isRA, obj: r.obj, planned, done,
             col: r.isRA ? 'var(--work)' : ACOL(r.obj),
             cap: r.isRA ? (r.max || 0) * (upTo + 1) / 7 : 0,
             ratio: planned > 0 ? done / planned : (done > 0 ? 1 : null) };
  });
  const kept = (r) => Math.min(r.done, r.planned);
  const planned = rows.reduce((a, r) => a + r.planned, 0);
  const done = rows.reduce((a, r) => a + kept(r), 0);
  const raw = rows.reduce((a, r) => a + r.done, 0);
  const oPlanned = rows.filter(r => !r.isRA).reduce((a, r) => a + r.planned, 0);
  const oDone = rows.filter(r => !r.isRA).reduce((a, r) => a + kept(r), 0);
  const byDay = dates.map((d, i) => ({
    d, i, past: i <= upTo,
    planned: rep0.rows.reduce((a, r) => a + (r.plan[i] || 0), 0),
    done: rep0.rows.reduce((a, r) => a + (r.byDay[i] || 0), 0),
  }));
  return { key, rows, planned, done, raw, byDay, upTo, oPlanned, oDone,
           ratio: planned > 0 ? done / planned : null,
           oRatio: oPlanned > 0 ? oDone / oPlanned : null,
           label: weekLabel(key) };
}

/** The first day anything was logged: earlier weeks were never lived by the plan. */
function firstUsedDay() {
  let first = '';
  for (const [k, wk] of Object.entries(state.weeks || {}))
    for (const [d, day] of Object.entries(wk.days || {})) {
      const any = raMinutes(day) > 0 || (day.blocks || []).length > 0
        || Object.values(day.log || {}).some(v => Number(v) > 0);
      if (any && (!first || d < first)) first = d;
    }
  return first;
}

/** keptWeek, split into the objectives that are work-related and the ones that are not. */
function keptByKind(key) {
  const k = keptWeek(key);
  const grp = (pick) => {
    const rows = k.rows.filter(r => !r.isRA && pick(r.obj));
    const planned = rows.reduce((a, r) => a + r.planned, 0);
    const done = rows.reduce((a, r) => a + Math.min(r.done, r.planned), 0);
    return { rows, planned, done, ratio: planned > 0 ? done / planned : null };
  };
  return { k, work: grp(isWork), leisure: grp(o => !isWork(o)), ra: k.rows.find(r => r.isRA) };
}
