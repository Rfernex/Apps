      <p class="verdict" style="margin:8px 0 4px">${upcoming.length
        ? (picked.length ? `<b style="color:var(--sem)">${picked.length}</b> picked — <b>${dur(pickedMin, false)}</b> of work on your timetable.`
                         : `${upcoming.length} seminar${upcoming.length === 1 ? '' : 's'} listed. Pick the ones you will go to.`)
        : 'No seminars listed for this week yet.'}</p>
      <p class="dl" style="margin-top:8px">${fetched ? `Read from the Bocconi newsletter on ${dayStamp(fetched)}. ` : ''}Bocconi publishes the coming week’s newsletter on Friday afternoons. “Attend” only adds an event to your timetable; it does not reserve a place or register you. A seminar you pick goes on the timetable in this colour, meals and objectives move round it, and once it is over it counts towards your RA hours.</p>
      ${courses.length ? `<p class="dl">Your course, Topics in Economics &amp; Finance 2: ${courses.length} lesson${courses.length === 1 ? '' : 's'} still to come, already marked as attending. They sit on the timetable like seminars and count as RA work once each lesson is over. Tap “Attending” on a lesson you skip.</p>` : ''}
      ${festival.length ? `<p class="dl">Festival Internazionale dell’Economia · Turin · October 24–25, 2026. The full weekend programme is listed below; use the Festival filter to browse it. Check each event’s booking instructions before going.</p>` : ''}
    </section>
    <section class="panel">
      <div class="semfilter">
        <button data-semfilter="all" aria-pressed="${f === 'all'}">All ${upcoming.length}</button>
        <button class="picked" data-semfilter="picked" aria-pressed="${f === 'picked'}">Attending ${picked.length}</button>
        ${courses.length ? `<button data-semfilter="courses" aria-pressed="${f === 'courses'}">Courses ${courses.length}</button>` : ''}
        ${festival.length ? `<button data-semfilter="festival" aria-pressed="${f === 'festival'}">Festival ${festival.length}</button>` : ''}
        ${topics.map(t => `<button data-semfilter="${esc(t)}" aria-pressed="${f === t}">${esc(t)} ${upcoming.filter(x => (x.topics || []).includes(t)).length}</button>`).join('')}
      </div>
      ${rows || `<p class="hint" style="padding:14px 18px;margin:0">${upcoming.length ? 'Nothing under this filter.' : 'The next newsletter is published on Friday afternoon.'}</p>`}
    </section>
    ${earlier.length ? `<section class="panel">
      <div class="panel-hd"><h2>Seminars you went to</h2><span class="sub">earlier weeks</span></div>
      <div class="rows">${earlier.slice(0, 30).map(x => `<div class="row" style="grid-template-columns:auto minmax(0,1fr) auto">
        <span class="num" style="font-size:11.5px;color:var(--ink-3)">${esc(x.date.slice(5))} ${esc(x.start)}</span>
        <span class="main"><b>${esc(semShort(x))}</b><span>${esc((x.topics || []).join(' · '))}</span></span>
        <span class="est">${dur(semSpan(x).e - semSpan(x).s, false)}</span></div>`).join('')}</div>
    </section>` : ''}` };
}

function viewRecap() {
  const N = 8;
  const keys = Array.from({length: N}, (_, i) => iso(addDays(parseISO(THIS_WEEK), -7 * (N - 1 - i))));
  const firstUsed = firstUsedDay();
  const hist = keys.map(key => Object.assign(keptByKind(key), { used: !!firstUsed && weekDates(key)[6] >= firstUsed }));
  const now = keptByKind(state.cursor);
  const pct = (r) => r == null ? '—' : Math.round(r * 100) + '%';
  const tone = (r) => r == null ? 'ink-3' : r >= 0.9 ? 'pos' : r >= 0.65 ? 'warn' : 'neg';
  const chipOf = (r) => r == null ? '' : r >= 0.9 ? 'ok' : r >= 0.65 ? 'risk' : 'bad';
  const W = now.work, L = now.leisure;
  const nUnsorted = state.objectives.filter(isUnsorted).length;

  let verdict;
  if (!state.objectives.length) verdict = 'No objectives yet, so there is nothing to compare. Add some on the Objectives tab and mark each as work-related or leisure.';
  else if (!W.rows.length) verdict = 'None of your objectives is marked work-related yet, so everything counts as leisure. Mark the ones that belong to your work on the Objectives tab.';
  else if (W.planned <= 0 && L.planned <= 0) verdict = 'Nothing has been asked of this week yet, so there is nothing to hold yourself to.';
  else {
    const bits = [];
    if (W.planned > 0) bits.push(`Work objectives: <b class="${tone(W.ratio)}">${pct(W.ratio)}</b> kept (${dur(W.done, false)} of ${dur(W.planned, false)})`);
    if (L.planned > 0) bits.push(`leisure: <b class="${tone(L.ratio)}">${pct(L.ratio)}</b> (${dur(L.done, false)} of ${dur(L.planned, false)})`);
    verdict = bits.join('; ') + '.';
    if (W.ratio != null && L.ratio != null && W.ratio < 0.7 && L.ratio > W.ratio + 0.1)
      verdict += ' <em>Leisure is holding up better than work — the wrong way round for what matters most.</em>';
    else if (W.ratio != null && W.ratio >= 0.9 && L.ratio != null && L.ratio < 0.65)
      verdict += ' <em>Work is on track; leisure is what is slipping, which is the right thing to let give.</em>';
    else if (W.ratio != null && W.ratio >= 0.9 && (L.ratio == null || L.ratio >= 0.65))
      verdict += ' <em>Both are being kept.</em>';
  }

  const card = (title, note, g, accent, empty) => `<section class="panel" style="border-top:3px solid ${accent}">
    <div class="panel-hd"><h2>${title}</h2><span class="sub">${note}</span></div>
    <div style="padding:16px 18px ${g.rows.length ? 14 : 16}px">${g.rows.length ? `
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <span class="num" style="font-size:36px;font-weight:700;letter-spacing:-.05em;color:var(--${tone(g.ratio)})">${pct(g.ratio)}</span>
        <span class="dl">kept · ${dur(g.done, false)} of ${dur(g.planned, false)} asked so far</span></div>
      <span class="bar" style="width:100%;height:9px;margin-top:9px"><i style="width:${g.ratio == null ? 0 : (Math.min(1, g.ratio) * 100).toFixed(1)}%;background:${accent}"></i></span>`
      : `<p class="hint" style="margin:0">${empty}</p>`}</div>
    ${g.rows.map(r => `<div style="display:flex;align-items:center;gap:9px;padding:8px 18px;border-top:1px solid var(--line)">
      <i style="width:8px;height:8px;flex:none;background:${r.col}"></i>
      <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
      <span class="bar" style="width:64px;flex:none"><i style="width:${r.ratio == null ? 0 : (Math.min(1, r.ratio) * 100).toFixed(1)}%;background:${r.col}"></i></span>
      <span class="chip ${chipOf(r.ratio)}" style="min-width:42px;text-align:center">${pct(r.ratio)}</span></div>`).join('')}
  </section>`;

  const trend = hist.map(w => {
    const bar = (g, col, nm) => g.ratio == null ? ''
      : `<i style="height:${(Math.min(1, g.ratio) * 100).toFixed(1)}%;background:${col}" title="${nm} ${pct(g.ratio)}"></i>`;
    return `<div class="kcol${w.k.key === state.cursor ? ' now' : ''}${w.used ? '' : ' ahead'}"
        title="${esc(w.k.label)} · ${w.used ? `work ${pct(w.work.ratio)}, leisure ${pct(w.leisure.ratio)}` : 'before you started keeping this'}">
      <div class="kstack">${w.used ? bar(w.work, 'var(--work)', 'Work') + bar(w.leisure, 'var(--pursuit)', 'Leisure') : ''}</div>
      <span class="klab">${parseISO(w.k.key).getDate()}/${parseISO(w.k.key).getMonth() + 1}</span></div>`; }).join('');

  const avg = (pick) => { const v = hist.filter(w => w.used && pick(w).ratio != null).map(w => pick(w).ratio); return v.length ? v.reduce((a, x) => a + x, 0) / v.length : null; };
  const good = (pick) => hist.filter(w => w.used && pick(w).ratio != null && pick(w).ratio >= 0.9).length;
  const counted = (pick) => hist.filter(w => w.used && pick(w).ratio != null).length;
  const wAvg = avg(w => w.work), lAvg = avg(w => w.leisure);

  return { html: `
    ${nUnsorted ? `<div class="banner warn">${I_WARN}<span><b>${nUnsorted}</b> objective${nUnsorted === 1 ? ' is' : 's are'} not marked work or leisure yet, so ${nUnsorted === 1 ? 'it counts' : 'they count'} as leisure. Sort ${nUnsorted === 1 ? 'it' : 'them'} on the <button class="linkish" data-nav="goals">Objectives</button> tab.</span></div>` : ''}
    <section class="panel lead" style="padding:20px 22px 18px">
      <span class="eyebrow">The week of ${esc(now.k.label)}</span>
      <p class="verdict" style="margin:8px 0 4px">${verdict}</p>
      ${now.ra ? `<p style="margin:6px 0 0;font-size:14px">RA work, the paid part: <b>${dur(now.ra.done, false)}</b> against the ${dur(now.ra.planned, false)} owed by now.</p>` : ''}
      <p class="dl" style="margin-top:8px">Only the days that have already happened are counted. An objective that is over its hours does not cover for one that is under.</p>
    </section>

    <div class="duo">
      ${card('Work-related', 'held to first', W, 'var(--work)', 'None yet. Mark an objective as work-related from the Objectives tab and it will show up here.')}
      ${card('Leisure', 'the rest', L, 'var(--pursuit)', 'No leisure objectives.')}
    </div>

    <section class="panel">
      <div class="panel-hd"><h2>Eight weeks</h2><span class="sub">share of what was asked that got done</span></div>
      <div class="legend" style="padding:12px 18px 0">
        <span class="lg"><i style="background:var(--work)"></i>Work-related</span>
        <span class="lg"><i style="background:var(--pursuit)"></i>Leisure</span></div>
      <div class="kchart tall">${trend}</div>
      <div class="tiles" style="border-radius:0;border-width:1px 0 0">
        <div class="tile"><span class="eyebrow">Work, average</span><b style="color:var(--${tone(wAvg)})">${pct(wAvg)}</b><span class="cap">over ${counted(w => w.work)} week${counted(w => w.work) === 1 ? '' : 's'}</span></div>
        <div class="tile"><span class="eyebrow">Leisure, average</span><b style="color:var(--${tone(lAvg)})">${pct(lAvg)}</b><span class="cap">over ${counted(w => w.leisure)} week${counted(w => w.leisure) === 1 ? '' : 's'}</span></div>
        <div class="tile"><span class="eyebrow">Work weeks kept</span><b>${good(w => w.work)}</b><span class="cap">of ${counted(w => w.work)} at 90% or more</span></div>
        <div class="tile"><span class="eyebrow">Leisure weeks kept</span><b>${good(w => w.leisure)}</b><span class="cap">of ${counted(w => w.leisure)} at 90% or more</span></div>
      </div>
    </section>` };
}

function viewKept() {
  const N = 8;
  const keys = Array.from({length: N}, (_, k) => iso(addDays(parseISO(THIS_WEEK), -7 * (N - 1 - k))));
  const hist = keys.map(keptWeek);
  // the plan applies to every week in history; only the ones you actually used count
  const firstUsed = firstUsedDay();
  const started = (w) => firstUsed && weekDates(w.key)[6] >= firstUsed;
  hist.forEach(w => { w.used = started(w); });
  const live = hist.filter(w => w.used);
  const now = keptWeek(THIS_WEEK);
  const pct = (r) => r == null ? '—' : Math.round(r * 100) + '%';
  const tone = (r) => r == null ? '' : r >= 0.9 ? 'pos' : r >= 0.65 ? 'warn' : 'neg';

  // the run of days you have kept to, counting back from the last day that has happened
  const streak = (() => {
    let n = 0;
    for (let k = 0; k < 60; k++) {
      const d = iso(addDays(TODAY, -k));
      if (d > TODAY_ISO) continue;
      const w = keptWeek(weekKeyOf(parseISO(d)));
      const row = w.byDay.find(x => x.d === d);
      if (!row || !row.past) continue;
      if (row.planned <= 0) { if (row.done > 0) { n++; continue; } break; }
      if (row.done / row.planned >= 0.7) n++; else break;
    }
    return n;
  })();

  const c0 = cfg();
  const cfgRA = { target: (Number(c0.raTarget) || 0) * 60, max: (Number(c0.raMax) || 0) * 60 };
  const raRow = now.rows.find(r => r.isRA);
  const worst = now.rows.filter(r => !r.isRA && r.planned > 20 && r.ratio != null).sort((a, b) => a.ratio - b.ratio)[0];
  const best  = now.rows.filter(r => !r.isRA && r.planned > 20 && r.ratio != null).sort((a, b) => b.ratio - a.ratio)[0];

  const overCap = raRow && raRow.cap && raRow.done > raRow.cap;
  const verdict = now.planned <= 0
    ? 'Nothing planned for this week yet, so there is nothing to hold yourself to.'
    : overCap ? `<b class="neg">${dur(raRow.done - raRow.cap)}</b> past the cap on work, and <b class="${tone(now.oRatio)}">${pct(now.oRatio)}</b> of the objectives kept. The week is going to the job.`
    : now.ratio >= 0.95 ? `You are living the plan — <b class="pos">${pct(now.ratio)}</b> of what these ${now.upTo + 1} days asked for is done.`
    : now.ratio >= 0.7 ? `<b class="warn">${pct(now.ratio)}</b> of what these ${now.upTo + 1} days asked for is done — ${dur(Math.max(0, now.planned - now.done))} behind.`
    : `<b class="neg">${pct(now.ratio)}</b> of what these ${now.upTo + 1} days asked for is done. The plan and the week have come apart by ${dur(Math.max(0, now.planned - now.done))}.`;

  // the trend, planned as an outline and done as a fill
  const maxH = Math.max(60, ...hist.filter(w => w.used).map(w => Math.max(w.planned, w.raw)), 60);
  const trend = hist.map(w => {
    const ph = (w.planned / maxH) * 100, dh = (w.done / maxH) * 100;
    return `<div class="kcol${w.key === THIS_WEEK ? ' now' : ''}${w.used ? '' : ' ahead'}"
        title="${esc(w.label)} · ${w.used ? `planned ${hrs(w.planned)}h, done ${hrs(w.done)}h` : 'before you started keeping this'}">
      <div class="kstack">
        ${w.used ? `<i class="kplan" style="height:${ph.toFixed(1)}%"></i>
        <i class="kdone ${tone(w.ratio)}" style="height:${dh.toFixed(1)}%"></i>` : ''}
      </div>
      <span class="klab">${parseISO(w.key).getDate()}/${parseISO(w.key).getMonth() + 1}</span>
    </div>`; }).join('');

  const days = now.byDay.map(x => {
    const r = x.planned > 0 ? x.done / x.planned : null;
    const ph = (x.planned / Math.max(60, ...now.byDay.map(y => Math.max(y.planned, y.done)))) * 100;
    const dh = (x.done / Math.max(60, ...now.byDay.map(y => Math.max(y.planned, y.done)))) * 100;
    return `<div class="kcol${x.d === TODAY_ISO ? ' now' : ''}${x.past ? '' : ' ahead'}"
        title="${DOWLONG[x.i]} · planned ${hrs(x.planned)}h, done ${hrs(x.done)}h">
      <div class="kstack">
        <i class="kplan" style="height:${ph.toFixed(1)}%"></i>
        <i class="kdone ${x.past ? tone(r) : ''}" style="height:${dh.toFixed(1)}%"></i>
      </div>
      <span class="klab">${DOW[x.i]}</span>
    </div>`; }).join('');

  const rows = now.rows.map(r => {
    const w = Math.max(r.planned, r.done, 1);
    return `<tr>
      <td class="obj"><b style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;flex:none;background:${r.col}"></i>${esc(r.name)}</b>
        <span style="padding-left:15px">${r.isRA
          ? `${dur(r.planned, false)} owed by now · cap ${dur(r.cap, false)}`
          : r.planned > 0 ? `${dur(r.planned, false)} asked of the days so far` : 'nothing asked yet'}</span></td>
      <td class="num" style="text-align:center;color:var(--ink-3)">${dur(r.planned, false)}</td>
      <td class="num" style="text-align:center;font-weight:700;color:${r.col}">${dur(r.done, false)}</td>
      <td style="min-width:120px">
        <span class="bar" style="width:100%;height:8px"><i style="width:${(r.planned / w * 100).toFixed(1)}%;background:var(--line-strong)"></i></span>
        <span class="bar" style="width:100%;height:8px;margin-top:2px"><i style="width:${(r.done / w * 100).toFixed(1)}%;background:${r.col}"></i></span></td>
      <td class="wk" style="padding-right:18px;text-align:right">
        <span class="chip ${
          r.isRA && r.cap && r.done > r.cap ? 'bad'
          : r.ratio == null ? ''
          : r.ratio >= 0.9 ? 'ok' : r.ratio >= 0.65 ? 'risk' : 'bad'}">${
          r.isRA && r.cap && r.done > r.cap ? 'over the cap' : pct(r.ratio)}</span></td>
    </tr>`; }).join('');

  return { html: `
    <section class="panel lead" style="padding:20px 22px 18px">
      <span class="eyebrow">The week of ${esc(now.label)}</span>
      <p class="verdict" style="margin:8px 0 4px">${verdict}</p>
      ${raRow ? `<p style="margin:6px 0 0;font-size:14px">RA work: <b class="${
        raRow.cap && raRow.done > raRow.cap ? 'neg' : raRow.ratio >= 0.95 ? 'pos' : raRow.ratio >= 0.8 ? 'warn' : 'neg'
        }">${dur(raRow.done, false)}</b> against the ${dur(raRow.planned, false)} owed by now${
        raRow.cap && raRow.done > raRow.cap ? `, past the ${dur(raRow.cap, false)} cap for these days`
        : raRow.done < raRow.planned ? `, ${dur(raRow.planned - raRow.done, false)} short` : ' — met' }.</p>` : ''}
      ${now.oPlanned > 0 ? `<p style="margin:4px 0 0;font-size:14px">On the objectives — the hours you chose for yourself — <b class="${tone(now.oRatio)}">${pct(now.oRatio)}</b>: ${dur(now.oDone, false)} of the ${dur(now.oPlanned, false)} asked.</p>` : ''}
      <p class="dl" style="margin-top:8px">Only the days that have already happened are counted, so a Monday reading is not a failure by Sunday's standard.</p>
    </section>

    <section class="panel">
      <div class="panel-hd"><h2>This week, day by day</h2>
        <span class="sub">outline is the plan · fill is what you did</span></div>
      <div class="kchart">${days}</div>
      <div class="panel-hd" style="border-bottom:none;border-top:1px solid var(--line)">
        <span class="dl">${now.done >= now.planned && now.planned > 0
          ? `Everything the week asked for by now is done${now.raw > now.planned ? `, with ${dur(now.raw - now.planned)} on top` : ''}.`
          : `${dur(Math.max(0, now.planned - now.done))} of what the week asked by now is still missing${
              now.raw > now.done ? `, even though ${dur(now.raw - now.done)} went into things that were already met` : ''}.`}</span></div>
    </section>

    <section class="panel">
      <div class="panel-hd"><h2>Where it holds and where it slips</h2><span class="sub">this week so far</span></div>
      <div class="scroller"><table class="grid">
        <thead><tr><th>Activity</th><th>Asked</th><th>Done</th><th>&nbsp;</th><th class="wk">Kept</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="panel-hd" style="border-bottom:none;border-top:1px solid var(--line)">
        <span class="dl">RA work is a band, and both ends count: the ${hrs(cfgRA.target)}h has to be met, the ${hrs(cfgRA.max)}h must not be passed. Falling short of the hours you owe is as much a miss as running past the cap.</span></div>
      ${worst && best && worst.id !== best.id ? `<div class="panel-hd" style="border-bottom:none;border-top:1px solid var(--line)">
        <span class="dl"><b>${esc(best.name)}</b> is the one you keep to (${pct(best.ratio)}). <b>${esc(worst.name)}</b> is the one that gives (${pct(worst.ratio)}) — if the week will not hold, that is where to cut the plan rather than keep missing it.</span></div>` : ''}
    </section>

    <section class="panel">
      <div class="panel-hd"><h2>Eight weeks</h2><span class="sub">planned against done, whole weeks</span></div>
      <div class="kchart tall">${trend}</div>
      <div class="stats" style="border-top:1px solid var(--line)">
        <div class="tile"><span class="eyebrow">Kept, this week</span>
          <div class="num ${tone(now.ratio)}" style="font-size:25px;font-weight:700">${pct(now.ratio)}</div>
          <span class="dl">of what the days so far asked</span></div>
        <div class="tile"><span class="eyebrow">Kept, on average</span>
          <div class="num" style="font-size:25px;font-weight:700">${live.length ? pct(live.reduce((a, w) => a + (w.ratio || 0), 0) / live.length) : '—'}</div>
          <span class="dl">over the ${live.length} week${live.length === 1 ? '' : 's'} you have kept this${live.length < 2 ? ' — too early to mean much' : ''}</span></div>
        <div class="tile"><span class="eyebrow">Run of days kept</span>
          <div class="num" style="font-size:25px;font-weight:700;color:${streak >= 3 ? 'var(--pursuit)' : 'var(--ink)'}">${streak}</div>
          <span class="dl">${streak === 0 ? 'the last full day fell short' : `day${streak === 1 ? '' : 's'} at 70% of the plan or better`}</span></div>
        <div class="tile"><span class="eyebrow">Hours logged</span>
          <div class="num" style="font-size:25px;font-weight:700">${hrs(live.reduce((a, w) => a + w.raw, 0))}h</div>
          <span class="dl">across those weeks</span></div>
      </div>
    </section>` };
}

function viewLibrary() {
  const reading = state.objectives.filter(o => booksOf(o.id).length || state.books.some(b => b.objectiveId === o.id));
  const all = state.books;
  const live = all.filter(b => !b.done);
  const totalLeft = live.reduce((a, b) => a + bookLeft(b), 0);
  const readObj = state.objectives.find(o => state.books.some(b => b.objectiveId === o.id));
  const weeklyH = readObj ? weeklyTarget(readObj) / 60 : 0;
  const weeksToClear = weeklyH ? totalLeft / weeklyH : null;

  const groups = (readObj ? [readObj] : []).concat(state.objectives.filter(o => o !== readObj && state.books.some(b => b.objectiveId === o.id)));
  const listFor = (o) => {
    const bs = state.books.filter(b => b.objectiveId === o.id);
    const cur = currentBook(o.id);
    return bs.length ? `<div class="rows">${bs.map(b => {
      const left = bookLeft(b), est = Number(b.estH) || 0;
      const pc = est ? clamp((Number(b.doneH) || 0) / est * 100, 0, 100) : 0;
      return `<button class="row${cur && b.id === cur.id ? ' next' : ''}" role="checkbox" aria-checked="${!!b.done}" data-book="${b.id}">
        <span class="box">${I_TICK}</span>
        <span class="main"><b>${esc(b.title)}</b><span>${[
          b.author ? esc(b.author) : '',
          cur && b.id === cur.id ? 'reading now' : b.done ? 'finished' : 'queued',
          est ? `${est}h estimated` : '',
        ].filter(Boolean).join(' · ')}</span></span>
        <span class="est">${est && !b.done ? `${hrs(left*60,1)}h left<span class="estbar"><i style="width:${pc.toFixed(0)}%"></i></span>` : ''}</span>
        <span class="iconbtn" data-editbook="${b.id}" role="button" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/></svg></span>
      </button>`; }).join('')}</div>` : '';
  };

  return { html: `
    <div class="tiles">

        <span class="cap">suggested in every reading slot</span></div>
    </div>

    ${groups.length ? groups.map(o => `<section class="panel">
      <div class="panel-hd"><h2>${esc(o.name)}</h2><span class="sub">${hrs(weeklyTarget(o))}h a week booked</span></div>
      ${listFor(o)}
      <div style="padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:9px">
        <button class="btn ghost" data-addbook="${o.id}">＋ Book</button>

      </div>
    </section>`).join('') : `<section class="panel"><div class="empty">
      <h3>No reading list yet</h3>
      <p>Add the books you mean to get through and the app will name one in every reading slot on the timetable, and tell you how many weeks the shelf will take at your current pace.</p>
      <div style="display:flex;gap:9px">
        ${state.objectives.map(o => `<button class="btn" data-importbooks="${o.id}">Paste a list into ${esc(o.name)}</button>`).slice(0, 2).join('')}
      </div></div></section>`}

    <div class="banner">${I_INFO}<span>Time you log against a reading objective is drawn down from whichever book is marked <b>reading now</b>. Tick a book off when you finish it and the next in the queue takes over.</span></div>` };
}

/** RA hours per week, against the aim and the cap. */
function chartRA(weeks) {
  const c = cfg(), cap = Number(c.raMax) || 60, aim = Number(c.raTarget) || 50;
  const max = Math.max(cap * 1.15, ...weeks.map(w => w.h));
  function build(W) {
    const H = 176, L = 30, R = 10, T = 14, B = 24;
    const pw = W - L - R, ph = H - T - B;
    const gw = pw / weeks.length, bw = Math.min(28, gw * 0.5);
    const y = v => T + ph - (v / max) * ph;
    let out = `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--rule)" stroke-width="1.5"/>`;
    for (const tv of [aim, cap]) {
      out += `<line x1="${L}" x2="${W-R}" y1="${y(tv).toFixed(1)}" y2="${y(tv).toFixed(1)}" stroke-dasharray="4 3"
        style="stroke:var(--${tv === cap ? 'neg' : 'pos'})" stroke-width="1" opacity=".8"/>`;
      out += `<text x="${L-6}" y="${(y(tv)+3.5).toFixed(1)}" text-anchor="end" font-size="9"
        style="fill:var(--${tv === cap ? 'neg' : 'pos'})">${tv}</text>`;
    }
    out += `<text x="${L-6}" y="${(y(0)+3.5).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--ink-3)">0</text>`;
    weeks.forEach((w, i) => {
      const cx = L + gw*i + gw/2, x = cx - bw/2;
      const h = w.h > 0 ? Math.max(2, (w.h/max)*ph) : 0;
      const over = w.h > cap;
      if (h) out += `<rect x="${x.toFixed(1)}" y="${(T+ph-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        style="fill:var(--${over ? 'neg' : 'work'});opacity:${w.current ? 1 : .55}"/>`;
      out += `<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="8.5" style="fill:var(--ink-3)">${w.label}</text>`;
      if (w.h) out += `<text x="${cx.toFixed(1)}" y="${(T+ph-h-5).toFixed(1)}" text-anchor="middle" font-size="9"
        font-weight="${w.current ? 700 : 400}" style="fill:var(--${over ? 'neg' : 'ink-2'})">${hrs(w.h*60,0)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" style="display:block;max-width:100%"
      aria-label="RA hours per week against a ${aim} hour aim and ${cap} hour cap">${out}</svg>`;
  }
  return { mount(box) { box.innerHTML = build(Math.max(280, Math.round(box.clientWidth || 640))); } };
}

function viewBalance() {
  const c = cfg(), N = 8;
  const keys = Array.from({length: N}, (_, k) => iso(addDays(parseISO(THIS_WEEK), -7 * (N - 1 - k))));
  const series = keys.map(k => {
    const dates = weekDates(k);
    const ra = dates.reduce((a, d) => a + raMinutes(dayOf(d)), 0);
    const weekendRA = dates.slice(5).reduce((a, d) => a + raMinutes(dayOf(d)), 0);
    const obj = state.objectives.reduce((a, o) => a + dates.reduce((s, d) => s + logMinutes(dayOf(d), o.id), 0), 0);
    return { key: k, h: ra/60, ra, weekendRA, obj, label: `${parseISO(k).getDate()}/${parseISO(k).getMonth()+1}`, current: k === THIS_WEEK };
  });
  const live = series.filter(w => w.ra > 0 || w.obj > 0);
  const avgRA = live.length ? live.reduce((a, w) => a + w.ra, 0) / live.length : 0;
  const weekendTotal = live.reduce((a, w) => a + w.weekendRA, 0);
  const overCap = live.filter(w => w.h > c.raMax).length;
  const ch = chartRA(series);
  const deadlines = state.objectives.filter(o => o.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline));

  const verdict = !live.length
    ? 'Nothing logged yet. Once a week or two is in, this page will say whether the RA work is really holding its band.'
    : avgRA > c.raMax * 60 ? `RA work is averaging <b class="neg">${hrs(avgRA)}h</b> a week — past the ${c.raMax}h cap, which is the hours you meant not to give.`
    : avgRA < c.raTarget * 60 * 0.95 ? `RA work is averaging <b class="neg">${hrs(avgRA)}h</b> a week — short of the ${c.raTarget}h you owe, by ${hrs(c.raTarget * 60 - avgRA)}h.`
    : avgRA > c.raMax * 60 * 0.93 ? `RA work is averaging <b class="warn">${hrs(avgRA)}h</b> a week — the ${c.raTarget}h is met, but that is close to the ${c.raMax}h cap.`
    : `RA work is averaging <b class="pos">${hrs(avgRA)}h</b> a week — the ${c.raTarget}h is met and the ${c.raMax}h cap is clear.`;

  return { html: `

      <span class="eyebrow">Last ${live.length || N} weeks</span>
      <p class="verdict" style="margin:8px 0 0">${verdict}
        <br><em>${weekendTotal > 0 ? `${dur(weekendTotal)} of it landed at the weekend.` : 'None of it has landed at the weekend.'}</em></p>
    </section>
    <section class="panel">
      <div class="panel-hd"><h2>RA hours by week</h2><span class="sub">dashed: the ${c.raTarget}h you owe and the ${c.raMax}h cap</span></div>
      <div style="padding:14px 16px 6px"><div id="ch-ra"></div></div>
    </section>
    <div class="tiles">
      <div class="tile"><span class="eyebrow">RA average</span><b style="color:var(--work)">${hrs(avgRA)}h</b><span class="cap">over ${live.length} logged weeks</span></div>
      <div class="tile"><span class="eyebrow">Weeks past cap</span><b style="color:var(--${overCap?'neg':'pos'})">${overCap}</b><span class="cap">of ${live.length} · ${c.raMax}h limit</span></div>
      <div class="tile"><span class="eyebrow">Weekend RA</span><b style="color:var(--${weekendTotal>0?'warn':'pos'})">${hrs(weekendTotal)}h</b><span class="cap">meant to be near zero</span></div>
      <div class="tile"><span class="eyebrow">Objectives kept</span><b style="color:var(--pursuit)">${hrs(live.reduce((a,w)=>a+w.obj,0))}h</b><span class="cap">logged outside RA work</span></div>
    </div>
    ${deadlines.length ? `<section class="panel">
      <div class="panel-hd"><h2>What is coming</h2></div>
      <div class="scroller"><table class="grid">
        <thead><tr><th>Objective</th><th>Date</th><th>Days</th><th>Tasks</th><th class="wk">Estimated vs available</th></tr></thead>
        <tbody>${deadlines.map(o => {
          const dd = daysUntil(o.deadline), wks = Math.max(0.3, dd/7);
          const open = openTasks(o.id), leftH = open.reduce((a,t)=>a+taskLeft(t),0);
          const cap2 = weeklyTarget(o)/60*wks, tight = leftH > cap2;
          return `<tr>
            <td class="obj"><b>${esc(o.name)}</b><span>${hrs(weeklyTarget(o))}h a week planned</span></td>
            <td class="num" style="text-align:center">${parseISO(o.deadline).getDate()} ${MON3[parseISO(o.deadline).getMonth()]}</td>
            <td class="num" style="text-align:center;color:var(--${dd<14?'neg':dd<45?'warn':'ink-2'})">${dd}</td>
            <td class="num" style="text-align:center">${tasksOf(o.id).length ? `${tasksOf(o.id).length-open.length}/${tasksOf(o.id).length}` : '—'}</td>
            <td class="wk" style="padding-right:18px;text-align:right">
              <span class="num" style="color:var(--${tight?'neg':'pos'})">${hrs(leftH*60,0)}h vs ${hrs(cap2*60,0)}h</span>
              <span class="dl">${tight ? 'more work than time' : 'fits with room'}</span></td></tr>`;

/* ============================ logging & drawdown ============================ */
/**
 * Set the minutes logged against an objective for a day, and draw the change
 * down from whatever that time was actually spent on — the book being read, or
 * the task at the top of the queue — so estimates stay live without extra typing.
 */
/** Change when a logged block ran, keeping its credit sane and the book in step. */
function resizeBlock(d, blockId, st, en) {
  const day = dayOf(d);
  const blk = (day.blocks || []).find(x => x.id === blockId);
  if (!blk) return;
  const was = blockCounts(blk);
  const span = blockMinutes({ s: st, e: en, b: 0 });
  if (span <= 0) return;
  // credit can never exceed the block it sits in
  const keep = blk.doneMin == null ? null : Math.min(Number(blk.doneMin) || 0, span);
  const rec = { ...blk, s: st, e: en, doneMin: keep != null && keep >= span ? null : keep };
  writeDay(d, { blocks: (day.blocks || []).map(x => x.id === blockId ? rec : x) });
  if (blk.objId) drawDown(blk.objId, blockCounts(rec) - was, blk.bookId);
  render();
}

/** Move minutes off the book you are on, or failing that the next open task. */
function drawDown(objId, deltaMin, bookId) {
  if (!objId || !deltaMin) return;
  const h = deltaMin / 60;
  const bump = (v) => Math.max(0, Math.round(((Number(v) || 0) + h) * 100) / 100);
  // a block that named its book draws on that one, not on whatever is current now
  if (bookId === '__none') return;
  const named = bookId ? state.books.find(b => b.id === bookId) : null;
  const bk = named || currentBook(objId);
  if (bk) {
    state.books = state.books.map(b => b.id === bk.id ? { ...b, doneH: bump(b.doneH) } : b);
    persistBooks();
    return;
  }
  const tk = openTasks(objId)[0];
  if (tk) {
    state.tasks = state.tasks.map(t => t.id === tk.id ? { ...t, doneH: bump(t.doneH) } : t);
    persistTasks();
  }
}

/** Set the hand-typed tally for a day. Minutes that came from logged blocks are not touched. */
function logTime(d, objId, minutes) {
  const day = dayOf(d);
  const delta = minutes - manualMinutes(day, objId);
  const log = { ...(day.log || {}) };
  if (minutes > 0) log[objId] = minutes; else delete log[objId];
  writeDay(d, { log });
  drawDown(objId, delta);
}

/** Change today only. Passing null to a field clears it. */
function adjustDay(d, objId, change) {
  const day = dayOf(d);
  const adj = { skip: [...(day.adj?.skip || [])], mins: { ...(day.adj?.mins || {}) },
                start: { ...(day.adj?.start || {}) }, loose: [...(day.adj?.loose || [])] };
  if (change.skip === true && !adj.skip.includes(objId)) adj.skip.push(objId);
  if (change.skip === false) adj.skip = adj.skip.filter(x => x !== objId);
  if (change.loose === true && !adj.loose.includes(objId)) adj.loose.push(objId);
  if (change.loose === false) adj.loose = adj.loose.filter(x => x !== objId);
  if (change.mins != null) adj.mins[objId] = Math.max(0, Math.round(change.mins));
  if (change.start != null) { if (change.start) adj.start[objId] = change.start; else delete adj.start[objId]; }
  if (change.minsClear) delete adj.mins[objId];
  if (change.reset) { adj.skip = adj.skip.filter(x => x !== objId); adj.loose = adj.loose.filter(x => x !== objId);
    delete adj.mins[objId]; delete adj.start[objId]; }
  writeDay(d, { adj });
}
const clearDayAdjustments = (d) => writeDay(d, { adj: {} });

/**
 * Clearing one slot frees its span, but the day used to redraw itself from
 * scratch afterwards — every objective that was only auto-placed, not
 * pinned, could land at a different hour once the gap it left behind got
 * filled in again. Pin each of those objectives to where it already sits
 * right now, so dropping one thing moves only that one thing.
 */
function freezeAutoPlaced(d, exceptKey) {
  const sch = scheduleDay(d);
  for (const s of sch.all) {
    if (s.k === exceptKey) continue;
    if (s.kind !== 'pursuit' || !s.objId || s.pinned || s.logged) continue;
    adjustDay(d, s.objId, { start: toHM(s.s) });
  }
}

/* ============================ the written plan ============================ */
function dayMarkdown(d) {
  const sch = scheduleDay(d), dt = parseISO(d), day = dayOf(d);
  const L = [];
  L.push(`# ${dayStamp(dt)}`, '');
  L.push(`Awake ${toHM(sch.wake)}–${toHM(sch.sleep)} · ${hrs(sch.sleep - sch.wake)}h.`);
  L.push(`Planned: ${hrs(sch.dp.ra)}h RA work, ${hrs(sch.dp.planned)}h objectives, ${dur(sch.dp.overhead, false)} commute and upkeep.`, '');
  L.push('## Timetable', '');
  L.push('| Time | | Length | What |', '| --- | --- | --- | --- |');
  for (const s of sch.all) {
    if (s.e - s.s < 10) continue;
    const kind = s.kind === 'work' ? 'Work' : s.kind === 'seminar' ? 'Seminar' : s.kind === 'pursuit' ? 'Objective' : s.kind === 'over' ? 'Upkeep' : 'Free';
    L.push(`| ${toHM(s.s)}–${toHM(s.e)} | ${kind} | ${dur(s.e - s.s - (s.br || 0), false)} | ${s.label}${s.what ? ` — ${s.what}` : ''} |`);
  }
  L.push('');
  if (sch.unplaced.length) {
    L.push('> **No room for:** ' + sch.unplaced.map(u => `${u.label} (${dur(u.unplaced, false)})`).join(', '), '');
  }
  const raToday = raWorkPlan()[sch.i] || [];
  if (raToday.length) {
    L.push('## RA work booked for today', '');
    for (const x of raToday) L.push(`- **${x.title}** — ${dur(x.minutes, false)}${x.t.forWhom ? `, for ${x.t.forWhom}` : ''}${x.t.desc ? ` — ${x.t.desc}` : ''}`);
    L.push('');
  }
  L.push('## Against the plan', '');
  L.push('| Objective | Planned | Logged |', '| --- | --- | --- |');
  L.push(`| RA work | ${hrs(sch.dp.ra)}h | ${hrs(raMinutes(day))}h |`);
  for (const o of state.objectives) {
    L.push(`| ${o.name} | ${dur(sch.dp.alloc[o.id] || 0, false)} | ${dur(logMinutes(day, o.id), false)} |`);
  }
  L.push('');
  if ((day.ra || []).length || (day.blocks || []).length) {
    L.push('## What you actually did', '');
    for (const r of (day.ra || []).slice().sort((x, y) => hm(x.s) - hm(y.s))) {
      L.push(`- \`${r.s}–${r.e}\` **${r.what || 'RA work'}** — ${dur(blockMinutes(r), false)}${
        r.forWhom ? `, for ${r.forWhom}` : ''}${r.b ? `, ${dur(r.b, false)} break` : ''}`);
    }
    for (const k of (day.blocks || []).slice().sort((x, y) => hm(x.s) - hm(y.s))) {
      const o = k.objId ? state.objectives.find(x => x.id === k.objId) : null;
      L.push(`- \`${k.s}–${k.e}\` **${k.label || (o ? o.name : 'Logged block')}** — ${dur(blockMinutes(k), false)}${
        blockPartial(k) ? ` (${dur(blockCounts(k), false)} counted)` : ''}${
        o ? `, towards ${o.name}` : ''}${k.note ? ` — ${k.note}` : ''}`);
    }
    L.push('');
  }
  const nexts = state.objectives.map(o => ({ o, t: openTasks(o.id)[0], b: currentBook(o.id) })).filter(x => x.t || x.b);
  if (nexts.length) {
    L.push('## Next up', '');
    for (const n of nexts) {
      if (n.b) L.push(`- **${n.o.name}** — reading *${n.b.title}*${n.b.author ? `, ${n.b.author}` : ''}${bookLeft(n.b) ? ` (~${hrs(bookLeft(n.b)*60,0)}h left)` : ''}`);
      else L.push(`- **${n.o.name}** — ${n.t.text}${taskLeft(n.t) ? ` (~${hrs(taskLeft(n.t)*60,0)}h left)` : ''}${n.t.due ? `, due ${n.t.due}` : ''}`);
    }
    L.push('');
  }
  return L.join('\n');
}

function weekMarkdown(key) {
  const rep = weekReport(key), plan = rep.plan;
  const L = [];
  L.push(`# Week of ${weekLabel(key)}`, '');
  L.push(`${hrs(plan.raWeek,0)}h RA work · ${hrs(plan.pursuitWeek)}h objectives · ${hrs(plan.overheadWeek)}h commute and upkeep · ${hrs(plan.slackWeek)}h unspoken-for.`);
  L.push(`A weekday keeps ${hrs(plan.weekdaySlack)}h free; a weekend day ${hrs(plan.weekendSlack)}h.`, '');
  L.push('## Plan against actual', '');
  L.push('| Objective | ' + DOW.join(' | ') + ' | Week | Target |');
  L.push('| --- |' + DOW.map(() => ' --- |').join('') + ' --- | --- |');
  for (const r of rep.rows) {
    L.push(`| ${r.name} | ${r.byDay.map(v => v ? hrs(v) : '·').join(' | ')} | **${hrs(r.actual)}h** | ${hrs(r.target)}h |`);
  }
  L.push('');
  if (plan.shortfalls.length) {
    L.push('> **Cut back to fit:** ' + plan.shortfalls.map(sf =>
      `${sf.o.name} — ${hrs(sf.got)}h of ${hrs(sf.want)}h`).join('; '), '');
  }
  L.push('## How the week is meant to fall', '');
  L.push('| Day | Awake | Upkeep | RA work | Objectives | Slack |', '| --- | --- | --- | --- | --- | --- |');
  plan.days.forEach((d, i) => L.push(`| ${DOWLONG[i]} | ${hrs(d.awake)}h | ${dur(d.overhead, false)} | ${d.ra ? hrs(d.ra)+'h' : '—'} | ${hrs(d.planned)}h | ${hrs(d.slack)}h |`));
  L.push('');
  for (const dte of rep.dates) {
    const sch = scheduleDay(dte);
    L.push(`### ${dayStamp(parseISO(dte))}`, '');
    for (const s of sch.slots) {
      if (s.e - s.s < 10) continue;
      L.push(`- \`${toHM(s.s)}–${toHM(s.e)}\` ${s.label}${s.what ? ` — ${s.what}` : ''}`);
    }
    L.push('');
  }
  const rq = raQueue();
  if (rq.length) {
    const rp = raWorkPlan();
    L.push('## RA queue', '');
    L.push(`${hrs(rp.queued)}h queued, ${hrs(rp.scheduled)}h of it fits this week.`, '');
    L.push('| Task | For | Priority | Hours left | Due |', '| --- | --- | --- | --- | --- |');
    for (const t of rq) L.push(`| ${t.title} | ${t.forWhom || '—'} | ${PRIO[Number(t.priority) || 2]} | ${hrs(raLeft(t)*60,1)}h | ${t.due || '—'} |`);
    L.push('');
  }
  const open = state.tasks.filter(t => !t.done);
  if (open.length) {
    L.push('## Open tasks', '');
    L.push('| Objective | Task | Estimated left | Due |', '| --- | --- | --- | --- |');
    for (const t of open) {
      const o = state.objectives.find(x => x.id === t.objectiveId);
      L.push(`| ${o ? o.name : '—'} | ${t.text} | ${taskLeft(t) ? hrs(taskLeft(t)*60,1) + 'h' : '—'} | ${t.due || '—'} |`);
    }
    L.push('');
  }
  return L.join('\n');
}

/* ---------------- calendar export ----------------
   Calendar files are not in the platform's allowed download types, so the .ics
   goes inside a zip — double-clicking it on a Mac unpacks the calendar file,
   and double-clicking that hands the events to Calendar. Written by hand,
   stored not deflated, so there is no library to load. */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return (buf) => { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
})();
function zipStore(files, when = new Date()) {
  const enc = new TextEncoder();
  const dosTime = ((when.getHours() << 11) | (when.getMinutes() << 5) | (when.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((when.getFullYear() - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate()) & 0xFFFF;
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = CRC(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));

function sheetRA(d, k, pre) {
  const dt = parseISO(d), c = cfg();
  const cur = (k === 0 || k > 0) ? (dayOf(d).ra || [])[k] : null;
  // claiming a suggested slot used to default its break to zero outright, so
  // a block claimed straight through midday silently swallowed lunch — carve
  // it out here whenever the slot actually spans the usual lunch hour
  const lunchOh = c.overheads.find(o => o.id === 'lunch') || {};
  const lunchMin = Number(isWeekendIdx(dowIndex(dt)) ? lunchOh.we : lunchOh.wd) || 0;
  const lunchAtM = hm(c.lunchAt || '13:00');
  const preBreak = (pre && pre.s && pre.e && lunchMin
    && lunchAtM >= hm(pre.s) + 30 && lunchAtM + lunchMin <= hm(pre.e) - 30) ? lunchMin : 0;
  const b0 = cur || { s: (pre && pre.s) || c.raStart, e: (pre && pre.e) || '18:00', b: pre ? preBreak : 45, what: '', forWhom: '' };
  const whoList = [...new Set([...state.rawork.map(t => t.forWhom), ...(dayOf(d).ra || []).map(x => x.forWhom)]
    .map(x => (x || '').trim()).filter(Boolean))];
  openSheet(`
    <div class="sheet-hd"><h2>${cur ? 'Edit work block' : 'Work block'}</h2>${closeIcon}</div>
    <div class="sheet-bd">
      <p class="hint" style="margin:0">${dayStamp(dt)}</p>
      <div class="row3">
        <div class="fld"><label for="b-s">Started</label><input id="b-s" class="inp num" type="time" value="${esc(b0.s)}" data-autofocus></div>
        <div class="fld"><label for="b-e">Finished</label><input id="b-e" class="inp num" type="time" value="${esc(b0.e)}"></div>
        <div class="fld"><label for="b-b">Break, min</label><input id="b-b" class="inp num" type="text" inputmode="numeric" value="${Number(b0.b) || 0}"></div>
      </div>
      <p class="hint" id="b-calc"></p>
      <div class="fld"><label for="b-w">What you worked on <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input id="b-w" class="inp" type="text" maxlength="140" value="${esc(b0.what || '')}" placeholder="e.g. Cleaned the pilot panel, ran the first regressions"></div>
      <div class="fld"><label for="b-f">Who it was for <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input id="b-f" class="inp" type="text" maxlength="48" list="b-who" value="${esc(b0.forWhom || '')}" placeholder="the person it is for">
        <datalist id="b-who">${whoList.map(w => `<option value="${esc(w)}"></option>`).join('')}</datalist></div>
      <p class="hint">Named blocks show on the timetable in place of the queue's guess, and go into the day and week reports.</p>
    </div>${errSlot}
    <div class="sheet-ft">${cur ? `<button class="btn danger" id="b-del">Delete</button>` : ''}
      <button class="btn pri" id="b-save">${cur ? 'Save changes' : 'Add block'}</button></div>`, (root) => {
    const calc = () => {
      const m = blockMinutes({ s: $('#b-s', root).value, e: $('#b-e', root).value, b: parseInt($('#b-b', root).value, 10) || 0 });
      $('#b-calc', root).innerHTML = m > 0 ? `That is <b class="num">${dur(m)}</b> of work.` : 'Finish must come after the start.';
    };
    ['#b-s','#b-e','#b-b'].forEach(s => $(s, root).addEventListener('input', calc)); calc();
    $('#b-save', root).addEventListener('click', () => { try {
      const s = $('#b-s', root).value, e = $('#b-e', root).value;
      const b = Math.max(0, parseInt($('#b-b', root).value, 10) || 0);
      if (!s || !e) { sheetError(root, 'Both a start and a finish are needed.', '#b-s'); return; }
      if (blockMinutes({ s, e, b }) <= 0) { sheetError(root, 'That block comes out at zero — check the finish and the break.', '#b-e'); return; }
      const rec = { s, e, b, what: $('#b-w', root).value.trim(), forWhom: $('#b-f', root).value.trim() };
      const list = dayOf(d).ra || [];
      writeDay(d, { ra: cur ? list.map((x, j) => j === k ? rec : x) : [...list, rec] });
      closeSheet(); render();
    } catch (err) { sheetError(root, 'Could not save: ' + (err && err.message || err)); } });
    const bd = $('#b-del', root);
    bd && bd.addEventListener('click', () => {
      writeDay(d, { ra: (dayOf(d).ra || []).filter((_, j) => j !== k) });
      closeSheet(); render();
    });
  });
}

        </div>
        <div class="qbtns" style="margin-top:8px">
          <button data-blen="${sl.blockId}|-30">30m shorter</button>

        <div class="qbtns">
          <button data-bdone="${sl.blockId}|all">all ${dur(span, false)}</button>
          <button data-bdone="${sl.blockId}|15">+15</button>
          <button data-bdone="${sl.blockId}|30">+30</button>
          <button data-bdone="${sl.blockId}|-15">−15</button>
          <button data-bdone="${sl.blockId}|zero">none</button>
        </div>
        <p class="hint">The block keeps its place on the timetable either way. Only this much goes against ${o ? esc(o.name) : 'the tally'}.</p></div>
      ${blk && blk.note ? `<p class="hint" style="font-size:12.5px;color:var(--ink-2)">${esc(blk.note)}</p>` : ''}`;
    foot = `<button class="btn danger" data-rmblock="${sl.blockId}">Remove</button>
      ${o ? `<button class="btn" data-obj="${o.id}">The objective</button>` : ''}
      <button class="btn pri" data-editblock="${sl.blockId}">Edit this block</button>`;
  } else if (o) {
    const done = logMinutes(day, o.id), tgt = sch.alloc[o.id] || 0;
    const base = sch.dp.alloc[o.id] || 0;
    const pinnedAt = sch.pins[o.id] || '';
    const edited = tgt !== base || pinnedAt;
    const r = weekReport(weekKeyOf(parseISO(d))).rows.find(x => x.id === o.id);
    const st = r ? statusOf(r) : null;
    const bk = currentBook(o.id), tk = openTasks(o.id)[0];
    body = `
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div><span class="eyebrow">Today</span><div class="num" style="font-size:22px;font-weight:700;color:${ACOL(o)}">${dur(done, false)}</div>
          <span class="dl">of ${dur(tgt, false)} booked</span></div>
        <div><span class="eyebrow">This week</span><div class="num" style="font-size:22px;font-weight:700">${hrs(r ? r.actual : 0)}h</div>
          <span class="dl">of ${hrs(r ? r.target : 0)}h${st ? ` · ${st.word}` : ''}</span></div>
        <div><span class="eyebrow">Priority</span>
          <div><button data-prio="${o.id}"><span class="chip ${(Number(o.priority)||2)===1?'bad':(Number(o.priority)||2)===3?'':'risk'}">${PRIO[Number(o.priority)||2]}</span></button></div>
          <span class="dl">tap to change</span></div>
        <div><span class="eyebrow">Kind</span>
          <div><button data-kind="${o.id}">${kindChip(o)}</button></div>
          <span class="dl">tap to switch</span></div>
      </div>
      ${bk ? `<div class="banner">${I_INFO}<span>Reading <b>${esc(bk.title)}</b>${bk.author ? ', ' + esc(bk.author) : ''}${bookLeft(bk) ? ` — about ${hrs(bookLeft(bk)*60,1)}h left` : ''}.</span></div>`
        : tk ? `<div class="banner">${I_INFO}<span>Next task: <b>${esc(tk.text)}</b>${taskLeft(tk) ? ` — about ${hrs(taskLeft(tk)*60,1)}h left` : ''}.</span></div>` : ''}
      <div class="fld"><label>Log against it</label>
        <div class="qbtns">
          <button data-slotlog="${o.id}" data-add="15">+15</button>
          <button data-slotlog="${o.id}" data-add="30">+30</button>
          <button data-slotlog="${o.id}" data-add="60">+1h</button>
          <button data-slotlog="${o.id}" data-set="${Math.max(0, tgt - blockedMinutes(day, o.id))}">all ${dur(tgt, false)}</button>
          <button data-slotlog="${o.id}" data-add="-15">−15</button>
        </div></div>
      <div class="fld"><label>Today only${edited ? ' · changed from the plan' : ''}</label>
        <div class="qbtns">
          <button data-adj="${o.id}|less">−15m</button>
          <button data-adj="${o.id}|more">+15m</button>
          <button data-adj="${o.id}|skip">Not today</button>
          ${edited || (sch.eff.skip || []).includes(o.id) ? `<button data-adj="${o.id}|reset">Back to plan</button>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-top:8px">
          <span class="dl" style="flex:none">Start at</span>
          <input class="inp num" type="time" id="adj-start" value="${pinnedAt || toHM(sl.s)}" style="width:auto;padding:6px 9px">
          <button class="btn" id="adj-pin" style="padding:6px 11px;font-size:12.5px">${pinnedAt ? 'Move it' : 'Pin it there'}</button>
          ${pinnedAt ? `<button class="btn" id="adj-unpin" style="padding:6px 11px;font-size:12.5px">Unpin</button>` : ''}
        </div>
        <p class="hint" style="margin-top:7px">Changes only this day. Hours freed by dropping something go to whatever is furthest behind for the week.</p>
      </div>`;
    foot = sl.logged
      ? `<button class="btn danger" data-rmblock="${sl.blockId}">Remove</button>
         <button class="btn" data-obj="${o.id}">Open the objective</button>
         <button class="btn pri" data-editblock="${sl.blockId}">Edit this block</button>`
      : `<button class="btn danger" data-loose="${o.id}">Clear the slot</button>
        <button class="btn" data-focus="${state.focus && state.focus.id === o.id ? 'clear' : 'obj'}|${o.id}|${esc(o.name)}">${
          state.focus && state.focus.id === o.id ? 'Stop picking it out' : 'Pick it out'}</button>
        <button class="btn pri" data-obj="${o.id}">Open the objective</button>`;
  } else if (rt) {
    body = `
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div><span class="eyebrow">For</span><div style="font-weight:600;font-size:15px">${esc(rt.forWhom || '—')}</div></div>
        <div><span class="eyebrow">Left</span><div class="num" style="font-size:22px;font-weight:700;color:var(--work)">${hrs(raLeft(rt)*60,1)}h</div>
          <span class="dl">of ${rt.estH || 0}h estimated</span></div>
        <div><span class="eyebrow">Priority</span><div><span class="chip ${Number(rt.priority)===1?'bad':Number(rt.priority)===3?'':'risk'}">${PRIO[Number(rt.priority)||2]}</span></div>
          ${rt.due ? `<span class="dl">due ${parseISO(rt.due).getDate()} ${MON3[parseISO(rt.due).getMonth()]}</span>` : ''}</div>
      </div>
      ${rt.desc ? `<p class="hint" style="font-size:12.5px;color:var(--ink-2)">${esc(rt.desc)}</p>` : ''}
      <div class="banner">${I_INFO}<span>Change the estimate and the rest of the week shuffles behind it straight away.</span></div>`;
    foot = `${(sl.raIdx === 0 || sl.raIdx > 0) ? `<button class="btn" data-raedit="${sl.raIdx}">Edit the block</button>` : ''}
      <button class="btn" data-focus="${state.focus && state.focus.id === rt.id ? 'clear' : 'ra'}|${rt.id}|${esc(rt.title)}">${
        state.focus && state.focus.id === rt.id ? 'Stop picking it out' : 'Pick it out'}</button>
      <button class="btn pri" data-editra="${rt.id}">Edit the task</button>`;
  } else if (sl.kind === 'over') {
    const oh = cfg().overheads.find(x => x.id === sl.ohId) || cfg().overheads.find(x => x.name === sl.label);
    const meal = sl.anchor || '';
    const lenOverride = sl.ohId && day.adj && day.adj.mins ? day.adj.mins['oh:' + sl.ohId] : undefined;
    const lenPinned = lenOverride !== undefined && lenOverride !== null;
    const pinned = meal ? ((day.adj && day.adj.start && day.adj.start['oh:' + meal]) || '') : '';
    const usual = meal ? (cfg()[meal + 'At'] || '') : '';
    const mealWord = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', chores: 'Chores' }[meal] || '';
    const mealNote = {
      breakfast: 'Left unset, breakfast follows straight on from washing and dressing.',
      lunch: 'On a working day the break is taken at this hour when it falls inside the block; otherwise it splits the block in half.',
      dinner: 'Left unset, dinner falls in after the last work block and the commute home.',
      chores: 'Left unset, chores follow straight on from dinner.',
    }[meal] || '';
    body = `<p class="hint" style="font-size:13px;color:var(--ink-2)">A fixed part of the day, taken out before anything is scheduled.${
      oh ? ` Currently <b class="num">${oh.wd}m</b> on a weekday and <b class="num">${oh.we}m</b> at the weekend.` : ''}</p>
      ${meal ? `<div class="fld"><label>${mealWord} hour</label>
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <input class="inp num" type="time" id="meal-at" value="${pinned || toHM(sl.s)}" style="width:auto;padding:7px 10px">
          <button class="btn" id="meal-day" style="padding:7px 11px;font-size:12.5px">Today only</button>
          <button class="btn" id="meal-all" style="padding:7px 11px;font-size:12.5px">Every day</button>
        </div>
        ${pinned || (usual && meal !== 'lunch') ? `<button class="linkish" id="meal-clear" style="margin-top:7px;text-align:left">${
          pinned && usual ? `Back to the usual hour (${usual})`
          : pinned ? 'Back to where the day puts it'
          : 'Stop fixing the hour'}</button>` : ''}
        <p class="hint">${mealNote}</p></div>` : ''}
      ${oh ? `<div class="fld"><label>How long it takes</label>
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <input class="inp num" type="text" inputmode="numeric" id="oh-min" value="${sl.e - sl.s}" style="width:74px;padding:7px 10px">
          <span class="dl">minutes</span>
          <button class="btn" id="oh-day" style="padding:7px 11px;font-size:12.5px">Today only</button>
          <button class="btn" id="oh-all" style="padding:7px 11px;font-size:12.5px">Every ${sch.we ? 'weekend day' : 'weekday'}</button>
        </div>
        ${lenPinned ? `<button class="linkish" id="oh-clear" style="margin-top:7px;text-align:left">Back to the usual ${
          sch.we ? oh.we : oh.wd} minutes</button>` : ''}
        <p class="hint">Usually <b class="num">${oh.wd}m</b> on a weekday and <b class="num">${oh.we}m</b> at the weekend. Changing it here for today leaves every other day alone.</p></div>` : ''}`;
    const dropped = lenOverride === 0;
    foot = `${sl.ohId ? `<button class="btn ${dropped ? '' : 'danger'}" data-ohday="${sl.ohId}|${dropped ? 'back' : 'skip'}">${
        dropped ? 'Put it back' : 'Not today'}</button>` : ''}
      <button class="btn" data-focus="over|${esc(sl.label)}|${esc(sl.label)}">Pick it out</button>
      <button class="btn pri" id="slot-cfg">Change the day's shape</button>`;
  } else if (sl.kind === 'seminar') {
    const x = (state.seminars || []).find(y => y.id === sl.semId) || {};
    body = `
      ${x.series || x.dept ? `<span class="eyebrow">${esc([x.series, x.dept].filter(Boolean).join(' · '))}</span>` : ''}
      <h3 style="font-family:var(--slab);font-size:17px;margin:0">${esc(x.title || sl.label)}</h3>
      ${semWho(x) ? `<p style="margin:0;font-size:13px;color:var(--ink-2)">${esc(semWho(x))}</p>` : ''}
      ${x.room ? `<p class="hint" style="margin:0">${esc(x.room)}</p>` : ''}
      <div class="banner" style="border-left-color:var(--sem)">${I_INFO}<span>Counts as RA work once it is over${
        (dayOf(d).ra || []).length ? ', except for minutes already inside a work block you logged' : ''}.</span></div>
      ${x.abstract ? `<details><summary class="linkish">Abstract</summary><p style="font-size:12.5px;line-height:1.55;color:var(--ink-2)">${esc(x.abstract)}</p></details>` : ''}
      ${x.url ? `<a class="linkish" href="${esc(x.url)}" target="_blank" rel="noopener">Event page ↗</a>` : ''}`;
    foot = `<button class="btn danger" data-sempick="${esc(sl.semId)}">Not going</button>
      <button class="btn pri" data-nav="seminars">All seminars</button>`;
  } else if (sl.kind === 'work') {
    const named = sl.raIdx === 0 || sl.raIdx > 0;
    body = `<p class="hint" style="font-size:13px;color:var(--ink-2)">${named
      ? 'A work block as you logged it.'
      : 'Work time with nothing from the queue against it. Add an RA task and it will be named here, or write on the block itself what you did.'}</p>`;
    foot = named
      ? `<button class="btn danger" data-rarm="${sl.raIdx}">Remove</button>
         <button class="btn pri" data-raedit="${sl.raIdx}">Edit this block</button>`
      : `<button class="btn" data-open="ra">Log a work block</button><button class="btn pri" data-addra="1">Add an RA task</button>`;
  } else {
    body = `<p class="hint" style="font-size:13px;color:var(--ink-2)">Unclaimed — the plan leaves this free. Log what you spent it on and the day fills itself in; both buttons come pre-set to ${when}.</p>`;
    foot = `<button class="btn" id="rest-ra">Log RA work</button>
      <button class="btn pri" id="rest-block">Log anything else</button>`;
  }

  return {
    html: `
      <div class="sheet-hd"><h2>${esc(sl.label)}</h2>${closeIcon}</div>
      <div class="sheet-bd">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="width:11px;height:11px;flex:none;background:${swatchOf(sl)};${sl.kind === 'rest' ? 'border:1px dashed var(--line-strong)' : ''}"></span>
          <span class="num" style="font-size:13px">${when}</span>
          <span class="dl" style="margin-left:auto">${dayStamp(parseISO(d))}</span>
        </div>
        ${body}
      </div>${errSlot}
      <div class="sheet-ft">${foot}</div>`,
    wire(root) {
      const sb = $('#slot-book', root);
      if (sb) sb.addEventListener('change', () => {
        const day0 = dayOf(d);
        const blk0 = (day0.blocks || []).find(x => x.id === sl.blockId);
        if (!blk0) return;
        const mins = blockCounts(blk0);
        drawDown(blk0.objId, -mins, blk0.bookId);          // off the old one
        const rec = { ...blk0, bookId: sb.value };
        writeDay(d, { blocks: (day0.blocks || []).map(x => x.id === sl.blockId ? rec : x) });
        drawDown(rec.objId, mins, rec.bookId);             // on to the new one
        render();
      });
      const bs = $('#blk-s', root);
      if (bs) {
        $('#blk-apply', root).addEventListener('click', () => {
          const st = bs.value, en = $('#blk-e', root).value;
          if (!st || !en) return;
          if (blockMinutes({ s: st, e: en, b: 0 }) <= 0) { sheetError(root, 'The finish has to come after the start.'); return; }
          resizeBlock(d, sl.blockId, st, en);
        });
      }
      const cf = $('#slot-cfg', root);
      cf && cf.addEventListener('click', () => { closeSheet(); sheetSettings(); });
      const om = $('#oh-min', root);
      if (om) {
        const oid = sl.ohId, isWe = sch.we;
        const read = () => Math.max(0, parseInt(om.value, 10) || 0);
        $('#oh-day', root).addEventListener('click', () => { adjustDay(d, 'oh:' + oid, { mins: read() }); render(); });
        $('#oh-all', root).addEventListener('click', () => {
          const n = read();
          state.settings = { ...cfg(), overheads: cfg().overheads.map(x => x.id === oid ? { ...x, [isWe ? 'we' : 'wd']: n } : x) };
          persistSettings(); adjustDay(d, 'oh:' + oid, { minsClear: true }); render();
        });
        const oc = $('#oh-clear', root);
        oc && oc.addEventListener('click', () => { adjustDay(d, 'oh:' + oid, { minsClear: true }); render(); });
      }
      const ma = $('#meal-at', root);
      if (ma) {
        const key = sl.anchor;
        $('#meal-day', root).addEventListener('click', () => { adjustDay(d, 'oh:' + key, { start: ma.value }); render(); });
        $('#meal-all', root).addEventListener('click', () => {
          state.settings = { ...cfg(), [key + 'At']: ma.value }; persistSettings(); render();
        });
        const mc = $('#meal-clear', root);
        mc && mc.addEventListener('click', () => {
          const hadPin = (dayOf(d).adj || {}).start && (dayOf(d).adj.start['oh:' + key] || '');
          if (hadPin) adjustDay(d, 'oh:' + key, { start: '' });
          else { state.settings = { ...cfg(), [key + 'At']: '' }; persistSettings(); }
          render();
        });
      }
      const rb = $('#rest-block', root);
      rb && rb.addEventListener('click', () => { closeSheet(); sheetBlock(d, null, { s: toHM(sl.s), e: toHM(sl.e) }); });
      const rr = $('#rest-ra', root);
      rr && rr.addEventListener('click', () => { closeSheet(); sheetRA(d, null, { s: toHM(sl.s), e: toHM(sl.e) }); });
      const pin = $('#adj-pin', root);
      pin && pin.addEventListener('click', () => {
        adjustDay(d, sl.objId, { start: $('#adj-start', root).value || null }); render();
      });
      const unpin = $('#adj-unpin', root);
      unpin && unpin.addEventListener('click', () => { adjustDay(d, sl.objId, { start: '' }); render(); });
    },
  };
}

/** Log a stretch of time that is not RA work: when, how long, what it was. */
/** Name and colour a category of your own; delete it if it has outlived its use. */
function sheetCategory(existing, after) {
  const c = existing || { id: null, name: '', desc: '', color: 0, hex: '' };
  const used = existing ? countCatBlocks(existing.id) : 0;
  openSheet(`
    <div class="sheet-hd"><h2>${existing ? 'Edit category' : 'New category'}</h2>${closeIcon}</div>
    <div class="sheet-bd">
      <div class="fld"><label for="ct-n">Name</label>
        <input id="ct-n" class="inp" type="text" maxlength="32" value="${esc(c.name)}" data-autofocus placeholder="e.g. Sport, Admin, Seeing people"></div>
      <div class="fld"><label for="ct-d">What it covers <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input id="ct-d" class="inp" type="text" maxlength="120" value="${esc(c.desc || '')}" placeholder="e.g. Swimming, running, anything at the gym"></div>
      ${colourField('ct', c)}
      ${used ? `<p class="hint">${used} block${used === 1 ? '' : 's'} filed under it so far.</p>` : ''}
      <p class="hint">Categories record where time went without holding you to a target, and each becomes its own coloured calendar when you export the week.</p>
    </div>${errSlot}
    <div class="sheet-ft">${existing ? `<button class="btn danger" id="ct-del">Delete</button>` : ''}
      <button class="btn pri" id="ct-save">${existing ? 'Save changes' : 'Add category'}</button></div>`, (root) => {
    const getColour = wireColour(root, 'ct', c);
    $('#ct-save', root).addEventListener('click', () => { try {
      const name = $('#ct-n', root).value.trim();
      if (!name) { sheetError(root, 'It needs a name.', '#ct-n'); return; }
      const clash = (state.cats || []).find(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== c.id);
      if (clash) { sheetError(root, 'You already have a category by that name.', '#ct-n'); return; }
      const rec = { id: c.id || uid(), name, desc: $('#ct-d', root).value.trim(), ...getColour() };
      state.cats = c.id ? state.cats.map(x => x.id === c.id ? rec : x) : [...(state.cats || []), rec];
      persistCats(); closeSheet(); render();
      after && after(rec);
    } catch (err) { sheetError(root, 'Could not save: ' + (err && err.message || err)); } });
    const del = $('#ct-del', root);
    del && del.addEventListener('click', () => {
      state.cats = (state.cats || []).filter(x => x.id !== c.id);
      persistCats(); closeSheet(); render();
    });
  });
}
/** How many logged blocks, across every week held here, point at this category. */
function countCatBlocks(catId) {
  let n = 0;
  for (const wk of Object.values(state.weeks || {}))
    for (const day of Object.values(wk.days || {}))
      for (const b of (day.blocks || [])) if (b.catId === catId) n++;
  return n;
}

    </div>${errSlot}
    <div class="sheet-ft">
      ${editing ? `<button class="btn danger" id="k-del">Delete</button>` : ''}
      <button class="btn pri" id="k-save">${editing ? 'Save' : 'Log it'}</button></div>`, (root) => {
    const calc = () => {
      const m = blockMinutes({ s: $('#k-s', root).value, e: $('#k-e', root).value, b: 0 });
      $('#k-calc', root).innerHTML = m > 0 ? `That is <b class="num">${dur(m)}</b>.` : 'The finish needs to come after the start.';
      const dm = $('#k-done', root).value.trim();
      const n = parseInt(dm, 10);
      $('#k-donenote', root).textContent = !dm ? `all ${dur(m, false)} counts`
        : !isFinite(n) || n < 0 ? 'a number of minutes, please'
        : n >= m ? `all ${dur(m, false)} counts`
        : `${dur(n, false)} of ${dur(m, false)}`;
      $('#k-done', root).placeholder = `all ${m}`;
    };
    const getNewColour = wireColour(root, 'k', { color: 0, hex: '' });
    const nw = $('#k-newwrap', root), ec = $('#k-editcat', root);
    const bw = $('#k-bookwrap', root), bsel = $('#k-book', root);
    // a block against an objective with a reading list picks up that list, the

    const fillBooks = (objId, want) => {
      const list = booksOf(objId);
      const past = want && !list.some(x => x.id === want) ? anyBook(want) : null;
      if (!list.length && !past) { bw.hidden = true; bsel.innerHTML = ''; return; }
      const cur = currentBook(objId);

        ...(past ? [`<option value="${past.id}" selected>${esc(past.title)}${past.done ? ' (finished)' : ''}</option>`] : []),
        ...list.map(x => `<option value="${x.id}" ${!past && x.id === chosen ? 'selected' : ''}>${esc(x.title)}${
          cur && x.id === cur.id ? ' — the one you are on' : ''}</option>`),
        `<option value="__none" ${chosen === '__none' ? 'selected' : ''}>Not reading — count the hours only</option>`,

      const v = e.target.value;
      nw.hidden = v !== '__new';

      const v = $('#k-obj', root).value;
      if (!v.startsWith('cat:')) return;
      const ct = catOf(v.slice(4)); if (!ct) return;
      // keep what has been typed so far, then come back to it

        catId: ct.id, objId: '', label: $('#k-l', root).value, note: $('#k-n', root).value };
      closeSheet();
      sheetCategory(ct, () => sheetBlock(d, draft.id ? draft : { ...draft, id: null }));
    });
    ['#k-s', '#k-e', '#k-done'].forEach(x => $(x, root).addEventListener('input', calc));
    $('#k-doneall', root).addEventListener('click', () => { $('#k-done', root).value = ''; calc(); });
    $('#k-dur', root).addEventListener('input', () => {
      const n = parseInt($('#k-dur', root).value, 10);
      if (n > 0) { $('#k-e', root).value = toHM(hm($('#k-s', root).value) + n); calc(); }
    });
    calc();
    $('#k-save', root).addEventListener('click', () => { try {
      const st = $('#k-s', root).value, en = $('#k-e', root).value;
      if (!st || !en) { sheetError(root, 'A start and a finish are both needed.', '#k-s'); return; }
      if (blockMinutes({ s: st, e: en, b: 0 }) <= 0) { sheetError(root, 'That block comes out at zero.', '#k-e'); return; }
      let pick = $('#k-obj', root).value, objId = '', catId = '';
      if (pick === '__new') {
        const nm = $('#k-newname', root).value.trim();
        if (!nm) { sheetError(root, 'The new category needs a name.', '#k-newname'); return; }
        const found = (state.cats || []).find(x => x.name.toLowerCase() === nm.toLowerCase());
        if (found) catId = found.id;
        else {
          catId = uid();
          state.cats = [...(state.cats || []), { id: catId, name: nm, ...getNewColour() }];
          persistCats();
        }
      } else if (pick.startsWith('cat:')) catId = pick.slice(4);
      else objId = pick;
      const label = $('#k-l', root).value.trim();
      if (!objId && !catId && !label) { sheetError(root, 'Give it a name, or point it at an objective or a category.', '#k-l'); return; }
      const dmRaw = $('#k-done', root).value.trim();
      const dmN = parseInt(dmRaw, 10);
      const span = blockMinutes({ s: st, e: en, b: 0 });
      if (dmRaw && (!isFinite(dmN) || dmN < 0)) { sheetError(root, 'The time that counts must be a number of minutes.', '#k-done'); return; }
      const doneMin = (!dmRaw || dmN >= span) ? null : dmN;
      const bookId = (objId && !$('#k-bookwrap', root).hidden) ? ($('#k-book', root).value || '') : '';
      const rec = { id: b.id || uid(), s: st, e: en, objId, catId, bookId, label, doneMin, note: $('#k-n', root).value.trim() };
      const day = dayOf(d);
      const blocks = b.id ? (day.blocks || []).map(x => x.id === b.id ? rec : x) : [...(day.blocks || []), rec];
      writeDay(d, { blocks });
      if (b.id && b.objId) drawDown(b.objId, -blockCounts(b), b.bookId);
      drawDown(objId, blockCounts(rec), bookId);
      closeSheet(); render();
    } catch (err) { sheetError(root, 'Could not save: ' + (err && err.message || err)); } });
    const del = $('#k-del', root);
    del && del.addEventListener('click', () => {
      writeDay(d, { blocks: (dayOf(d).blocks || []).filter(x => x.id !== b.id) });
      if (b.objId) drawDown(b.objId, -blockCounts(b), b.bookId);
      closeSheet(); render();
    });
  });
}

/** Paste many at once: "Thing ~4h !2026-10-01", one per line. */
function parseLines(text, book) {
  return text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(line => {
    let s = line, estH = 0, due = '';
    s = s.replace(/!\s*(\d{4}-\d{2}-\d{2})/, (_, d) => { due = d; return ''; });
    s = s.replace(/~\s*(\d+(?:[.,]\d+)?)\s*h?\b/i, (_, n) => { estH = parseFloat(n.replace(',', '.')); return ''; });
    s = s.replace(/\s{2,}/g, ' ').replace(/[-–—,]\s*$/, '').trim();
    if (!book) return { text: s, estH, due };
    const m = s.split(/\s+[—–]\s+|\s+\/\s+/);
    return { title: (m[0] || s).trim(), author: (m[1] || '').trim(), estH };
  }).filter(x => book ? x.title : x.text);
}

        persistTasks();

    } catch (err) { sheetError(root, 'Could not add those: ' + (err && err.message || err)); } });
  });

/* ---------------- backup and restore ----------------
   Standalone, the app keeps its data in this browser alone. That is only safe if
   the whole lot can be lifted out to a file and put back somewhere else. */
const BACKUP_KEYS = ['weeks', 'objectives', 'tasks', 'books', 'rawork', 'cats', 'settings', 'seminars', 'semMeta', 'semPicks'];
function backupBlob() {
  const out = { app: 'hours-and-days', version: 1, savedAt: new Date().toISOString() };
  for (const k of BACKUP_KEYS) out[k] = state[k];
  return JSON.stringify(out, null, 1);
}
async function saveBackup() {
  const stamp = TODAY_ISO;
  await offer(`hours-and-days-${stamp}.json`, backupBlob());
}
/** Replace everything with the contents of a backup, after saying what is in it. */
async function restoreBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('That file is not readable as a backup.'); }
  if (!d || typeof d !== 'object' || d.app !== 'hours-and-days')
    throw new Error('That is not an Hours & Days backup.');
  for (const k of BACKUP_KEYS) if (d[k] !== undefined) state[k] = d[k];
  state.weeks = state.weeks || {};
  cacheLocal();
  if (DB) {
    // push it up so every device follows, not just this one
    await Promise.allSettled([
      DB.doc('config/settings').set(state.settings || {}),
      DB.doc('config/objectives').set({ items: state.objectives || [] }),
      DB.doc('config/tasks').set({ items: state.tasks || [] }),
      DB.doc('config/books').set({ items: state.books || [] }),
      DB.doc('config/rawork').set({ items: state.rawork || [] }),
      DB.doc('config/cats').set({ items: state.cats || [] }),
      DB.doc('config/seminarPicks').set({ items: state.semPicks || [] }),
      ...Object.entries(state.weeks).map(([k, v]) => DB.doc('weeks/' + k).set(v)),
    ]);
  }
  render();
}

  const n = (x) => (x || []).length;

  openSheet(`

    $('#bk-save', root).addEventListener('click', async () => { await saveBackup(); });
    $('#bk-file', root).addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        await restoreBackup(text);
        $('#bk-msg', root).innerHTML = '<b class="pos">Restored.</b> Everything below has been replaced.';
      } catch (err) {
        sheetError(root, err && err.message || String(err));
        e.target.value = '';
      }
    });
  });
}

const VIEWS = {
  today:   { title: 'Today',      fn: viewToday },
  week:    { title: 'The week',   fn: viewWeek },
  goals:   { title: 'Objectives', fn: viewGoals },
  library: { title: 'Reading',    fn: viewLibrary },

  recap:   { title: 'Work & leisure', fn: viewRecap },
  seminars: { title: 'Seminars', fn: viewSeminars },
  balance: { title: 'Balance',    fn: viewBalance },
};
function render() {
  const v = VIEWS[state.view] || VIEWS.today;
  MOUNTED = [];
  const out = v.fn();
  const root = $('#view');
  root.innerHTML = out.html;
  out.wire && out.wire(root);
  $('#viewname').textContent = v.title;
  const dayMode = state.view === 'today';
  $('#weeknav').style.visibility = ['goals', 'library', 'seminars'].includes(state.view) ? 'hidden' : '';
  if (dayMode) {
    const d = parseISO(state.cursorDay || TODAY_ISO);
    $('#wlbl').textContent = state.cursorDay === TODAY_ISO ? 'Today' : `${DOW[dowIndex(d)]} ${d.getDate()} ${MON3[d.getMonth()]}`;
    $('#wnext').disabled = (state.cursorDay || TODAY_ISO) >= weekDates(THIS_WEEK)[6];
  } else {
    $('#wlbl').textContent = state.cursor === THIS_WEEK ? 'This week' : weekLabel(state.cursor);
    $('#wnext').disabled = state.cursor >= THIS_WEEK;
  }
  $$('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === state.view ? 'page' : 'false'));
  const mb = $('#moreBtn');
  if (mb) mb.setAttribute('aria-current', ['seminars', 'recap', 'cats', 'balance'].includes(state.view) ? 'page' : 'false');
  refreshSheet();
