<html lang="en">

  <title>Hours &amp; Days</title>
  <meta name="description" content="Where the week actually goes: work, the bench, the reading, the plan against it.">
  <link rel="manifest" href="manifest.webmanifest?v=9e6c408366">
  <link rel="apple-touch-icon" href="icon-180.png?v=9e6c408366">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=9e6c408366">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f0ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1a17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hours">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f2f0ea; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
  </style>
  <script>
  (function () {
    /* Mac <-> phone sync, piggybacking on the private GitHub repo these pages
       already live in. Off by default: nothing changes until a personal
       access token is entered once per device (tap the sync line to set it
       up). docs/collections mirror exactly what the artifact's own db
       capability hands the page, so the app itself needed no changes. */
    const GH_REPO   = 'Rfernex/Apps-private';
    const DATA_PATH = 'sync/hours.json';
    const APP_ID    = 'hours';
    const LS_KEY    = 'hoursAndDays.v1';
    const TOKEN_KEY = 'ghSyncToken.v1';
    const FORCE_KEY = 'ghSyncForceLocal.v1';
    const POLL_MS   = 45000;

    const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
    const setToken = (t) => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

    let sha = null, docs = {}, pending = new Set(), pushTimer = null;
    const docListeners = {}, colListeners = {};

    const status = (msg, bad) => { try { window.setSync && window.setSync(msg, bad); } catch (e) {} };

    function api(path, opts) {
      opts = opts || {};
      const headers = Object.assign(
        { Authorization: 'token ' + getToken(), Accept: 'application/vnd.github+json' },
        opts.headers || {});
      return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + path,
        Object.assign({ cache: 'no-store' }, opts, { headers }));
    }
    const b64encode = (s) => btoa(unescape(encodeURIComponent(s)));
    const b64decode = (s) => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));

    async function ghGet() {
      const r = await api(DATA_PATH);
      if (r.status === 404) return { sha: null, blob: null };
      if (r.status === 401 || r.status === 403) throw { auth: true };
      if (!r.ok) throw new Error('GitHub read failed: ' + r.status);
      const j = await r.json();
      return { sha: j.sha, blob: JSON.parse(b64decode(j.content)) };
    }
    async function ghPut(blob, prevSha) {
      const body = { message: 'sync: ' + new Date().toISOString(), content: b64encode(JSON.stringify(blob)) };
      if (prevSha) body.sha = prevSha;
      const r = await api(DATA_PATH, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.status === 401 || r.status === 403) throw { auth: true };
      if (r.status === 409 || r.status === 422) throw { conflict: true };
      if (!r.ok) throw new Error('GitHub write failed: ' + r.status);
      return (await r.json()).content.sha;
    }

    function notifyDoc(path) {
      const val = docs[path];
      (docListeners[path] || []).forEach((l) => l.cb({ exists: val !== undefined, data: () => val }));
    }
    function notifyCollection(prefix) {
      const rows = Object.keys(docs).filter((k) => k.indexOf(prefix + '/') === 0)
        .map((k) => ({ id: k.slice(prefix.length + 1), data: () => docs[k] }));
      (colListeners[prefix] || []).forEach((l) => l.cb({ docs: rows }));
    }
    function notifyAll() {
      Object.keys(docListeners).forEach(notifyDoc);
      Object.keys(colListeners).forEach(notifyCollection);
    }
    function notifyForPath(path) {
      notifyDoc(path);
      Object.keys(colListeners).forEach((prefix) => { if (path.indexOf(prefix + '/') === 0) notifyCollection(prefix); });
    }

    function schedulePush() {
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(push, 2500);
    }
    async function push() {
      pushTimer = null;
      if (!pending.size) return;
      const mine = new Set(pending); pending = new Set();
      try {
        sha = await ghPut({ app: APP_ID, updatedAt: new Date().toISOString(), docs }, sha);
        status('Synced');
      } catch (e) {
        if (e && e.conflict) {
          // the other device pushed since our last known version — take its
          // copy, then lay just what we changed back on top and try again
          try {
            const remote = await ghGet();
            const merged = Object.assign({}, (remote.blob && remote.blob.docs) || {});
            mine.forEach((p) => { merged[p] = docs[p]; });
            docs = merged; sha = remote.sha;
            sha = await ghPut({ app: APP_ID, updatedAt: new Date().toISOString(), docs }, sha);
            notifyAll();
            status('Synced');
          } catch (e2) { mine.forEach((p) => pending.add(p)); status('Offline — saved locally', true); }
        } else if (e && e.auth) {
          status('Sync token rejected', true);
        } else {
          mine.forEach((p) => pending.add(p));
          status('Offline — saved locally', true);
        }
      }
    }

    function put(path, data) {
      // the ready-to-send week email lives in the artifact only — the Mac
      // cron that reads it never looks at this file, so mirroring it here
      // would just bloat every sync with a throwaway 50KB blob
      if (path.indexOf('plans/') === 0) return Promise.resolve();
      docs[path] = data;
      pending.add(path);
      schedulePush();
      notifyForPath(path);
      return Promise.resolve();
    }

    async function pull() {
      if (pending.size) return;   // don't clobber an edit still in flight
      try {
        const remote = await ghGet();
        if (remote.blob && remote.sha !== sha) {
          sha = remote.sha;
          docs = (remote.blob && remote.blob.docs) || {};
          notifyAll();
        }
        status('Synced');
      } catch (e) {
        status(e && e.auth ? 'Sync token rejected' : 'Sync interrupted', true);
      }
    }

    function seedFromLocal() {
      // nothing worth keeping on GitHub yet: carry across what is already on
      // this device, so the first sync isn't a blank slate
      try {
        const raw = localStorage.getItem(LS_KEY);
        const d = raw && JSON.parse(raw);
        if (d) docs = seedMap(d);
      } catch (e) {}
    }
    function seedMap(d) {
      return Object.assign({
        'config/settings': d.settings || {},
        'config/objectives': { items: d.objectives || [] },
        'config/tasks': { items: d.tasks || [] },
        'config/books': { items: d.books || [] },
        'config/rawork': { items: d.rawork || [] },
        'config/cats': { items: d.cats || [] },
        'config/seminars': Object.assign({ items: d.seminars || [] }, d.semMeta || {}),
        'config/seminarPicks': { items: d.semPicks || [] },
      }, Object.fromEntries(Object.entries(d.weeks || {}).map(([k, v]) => ['weeks/' + k, v])));

    }

    let dbReady = null;
    function init() {
      if (dbReady) return dbReady;
      dbReady = (async () => {
        if (!getToken()) return null;
        let forceLocal = false;
        try { forceLocal = localStorage.getItem(FORCE_KEY) === '1'; localStorage.removeItem(FORCE_KEY); } catch (e) {}
        try {
          const remote = await ghGet();
          if (remote.blob && !forceLocal) { docs = remote.blob.docs || {}; sha = remote.sha; }
          else { seedFromLocal(); sha = await ghPut({ app: APP_ID, updatedAt: new Date().toISOString(), docs }, remote.sha); }
          status('Synced');
        } catch (e) {
          status(e && e.auth ? 'Sync token rejected' : 'Sync interrupted', true);
          seedFromLocal();
        }
        setInterval(pull, POLL_MS);
        addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
        addEventListener('online', () => { pull(); push(); });
        return {
          doc: (path) => ({
            set: (data) => put(path, data),
            onSnapshot: (cb, errCb) => {
              (docListeners[path] = docListeners[path] || []).push({ cb, errCb });
              notifyDoc(path);
            },
          }),
          collection: (prefix) => ({
            onSnapshot: (cb, errCb) => {
              (colListeners[prefix] = colListeners[prefix] || []).push({ cb, errCb });
              notifyCollection(prefix);
            },
          }),
        };
      })();
      return dbReady;
    }

    const save = async ({ filename, data }) => {
      const blob = data instanceof Blob ? data
        : new Blob([data], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename || 'download';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
    };
    /* Files attached to a document stay in this device's own IndexedDB. The repo is
       served publicly by Pages, so nothing personal beyond the app data goes into it. */
    const assets = (() => {
      const NAME = 'attachments-' + APP_ID, urls = {};
      const OK = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'application/pdf'];
      const fail = (code) => { const e = new Error(code); e.code = code; return e; };
      const open = () => new Promise((res, rej) => {
        const r = indexedDB.open(NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('f');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const run = async (mode, fn) => {
        const d = await open();
        return new Promise((res, rej) => {
          const t = d.transaction('f', mode), st = t.objectStore('f'), rq = fn(st);
          t.oncomplete = () => { d.close(); res(rq && rq.result); };
          t.onerror = t.onabort = () => { d.close(); rej(t.error || fail('quota_or_state')); };
        });
      };
      const ready = (async () => {
        try {
          const d = await open();
          await new Promise((res) => {
            const rq = d.transaction('f').objectStore('f').openCursor();
            rq.onsuccess = () => { const c = rq.result; if (!c) return res(); urls[c.key] = URL.createObjectURL(c.value); c.continue(); };
            rq.onerror = () => res();
          });
          d.close();
        } catch (e) {}
      })();
      return {
        ready,
        urlFor: (id) => urls[id] || '',
        upload: async (blob, opts) => {
          const type = (opts && opts.type) || blob.type;
          if (!OK.includes(type)) throw fail('unsupported_type');
          if (blob.size > 20 * 1048576) throw fail('too_large');
          const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          const stored = blob.type === type ? blob : new Blob([blob], { type });
          try { await run('readwrite', (st) => st.put(stored, id)); } catch (e) { throw fail('quota_or_state'); }
          urls[id] = URL.createObjectURL(stored);
          return { id, url: urls[id], sizeBytes: stored.size, contentType: type };
        },
        delete: async (id) => {
          if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; }
          await run('readwrite', (st) => st.delete(id));
        },
      };
    })();
    window.claude = {
      use: async (what) => (what === 'downloads' ? { save } : what === 'db' ? init()
        : what === 'assets' ? (await assets.ready, assets) : null),
    };
    window.__ghSync = {
      lsKey: LS_KEY,
      repo: GH_REPO,
      hasToken: () => !!getToken(),
      probe: async (t) => {
        try {
          const r = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + DATA_PATH,
            { headers: { Authorization: 'token ' + t, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
          if (r.status === 401 || r.status === 403) return { ok: false, error: 'that token was not accepted' };
          if (r.status === 404) return { ok: true, remoteHasData: false };
          if (!r.ok) return { ok: false, error: 'GitHub returned ' + r.status };
          const j = await r.json();
          const blob = JSON.parse(b64decode(j.content));
          return { ok: true, remoteHasData: !!(blob && blob.docs && Object.keys(blob.docs).length) };
        } catch (e) { return { ok: false, error: 'could not reach GitHub' }; }
      },
      activate: (t, forceLocal) => {
        setToken(t);
        try { forceLocal ? localStorage.setItem(FORCE_KEY, '1') : localStorage.removeItem(FORCE_KEY); } catch (e) {}
        location.reload();
      },
      clearToken: () => { setToken(''); location.reload(); },
    };
  })();
  </script>
  <script>
  (function () {
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function openModal() {
      const has = window.__ghSync && window.__ghSync.hasToken();
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4)';
      const panel = document.createElement('div');
      panel.style.cssText = 'background:var(--surface,#fff);color:var(--ink,#111);max-width:440px;width:100%;'
        + 'border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));'
        + "font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 -6px 24px rgba(0,0,0,.25)";
      wrap.appendChild(panel);
      document.body.appendChild(wrap);
      const close = () => wrap.remove();
      wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });

      const head = () => `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <b style="font-size:16px">Sync Mac &harr; phone</b>
        <button id="gs-x" style="border:0;background:none;font-size:22px;line-height:1;color:var(--ink-3,#888);cursor:pointer">&times;</button>
      </div>`;

      function renderOff() {
        panel.innerHTML = head() + `
          <p style="margin:0 0 10px;color:var(--ink-2,#444)">Paste a GitHub personal access token, scoped to just this one repository, and this device starts syncing with your others through it.</p>
          <ol style="margin:0 0 14px;padding-left:18px;color:var(--ink-2,#444)">
            <li>github.com &rarr; Settings &rarr; Developer settings &rarr; Fine-grained tokens &rarr; Generate new token</li>
            <li>Repository access: only <b>${esc(window.__ghSync.repo)}</b></li>
            <li>Permissions &rarr; Contents: <b>Read and write</b></li>
            <li>Generate, copy the token, paste it below</li>
          </ol>
          <input id="gs-tok" type="password" placeholder="github_pat_&hellip;" autocapitalize="off" autocorrect="off" spellcheck="false"
            style="width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line-strong,#ccc);border-radius:8px;font:13px ui-monospace,monospace;margin-bottom:6px">
          <p id="gs-err" style="margin:0 0 10px;color:var(--neg,#b00);font-size:12.5px"></p>
          <button id="gs-on" style="width:100%;padding:11px;border:0;background:var(--accent,#333);color:var(--accent-ink,#fff);border-radius:8px;font:inherit;font-weight:600;cursor:pointer">Turn on sync</button>`;
        panel.querySelector('#gs-x').addEventListener('click', close);
        const tok = panel.querySelector('#gs-tok'), err = panel.querySelector('#gs-err'), on = panel.querySelector('#gs-on');
        on.addEventListener('click', async () => {
          const t = tok.value.trim();
          if (!t) return;
          err.textContent = '';
          on.disabled = true; on.textContent = 'Checking…';
          const r = await window.__ghSync.probe(t);
          if (!r.ok) {
            err.textContent = 'Could not turn on sync: ' + r.error + '.';
            on.disabled = false; on.textContent = 'Turn on sync';
            return;
          }
          let localHasData = false;
          try { localHasData = !!localStorage.getItem(window.__ghSync.lsKey); } catch (e) {}
          if (r.remoteHasData && localHasData) {
            renderConflict(t);
          } else {
            window.__ghSync.activate(t, localHasData && !r.remoteHasData);
          }
        });
      }

      function renderConflict(t) {
        panel.innerHTML = head() + `
          <p style="margin:0 0 6px;color:var(--ink-2,#444)">This device already has its own data, and so does the sync file on GitHub — most likely from another device. Which should this device use from now on?</p>
          <p style="margin:0 0 14px;color:var(--ink-3,#888);font-size:12.5px">Whichever you don't pick is not deleted anywhere else — this only decides what this one device shows and then syncs onward.</p>
          <button id="gs-keepremote" style="width:100%;padding:11px;border:0;background:var(--accent,#333);color:var(--accent-ink,#fff);border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:8px">Use what's on GitHub (from your other device)</button>
          <button id="gs-keeplocal" style="width:100%;padding:11px;border:1px solid var(--line-strong,#ccc);background:none;color:var(--ink,#111);border-radius:8px;font:inherit;cursor:pointer">Use what's on this device instead</button>`;
        panel.querySelector('#gs-x').addEventListener('click', close);
        panel.querySelector('#gs-keepremote').addEventListener('click', () => window.__ghSync.activate(t, false));
        panel.querySelector('#gs-keeplocal').addEventListener('click', () => window.__ghSync.activate(t, true));
      }

      function renderOn() {
        panel.innerHTML = head() + `
          <p style="margin:0 0 14px;color:var(--ink-2,#444)">This device syncs through the private GitHub repository these apps are hosted from. A change here reaches your other device within about a minute.</p>
          <button id="gs-off" style="width:100%;padding:11px;border:1px solid var(--line-strong,#ccc);background:none;color:var(--neg,#b00);border-radius:8px;font:inherit;cursor:pointer">Turn off sync on this device</button>`;
        panel.querySelector('#gs-x').addEventListener('click', close);
        panel.querySelector('#gs-off').addEventListener('click', () => {
          if (confirm("Turn off sync on this device? Nothing is deleted — this device just stops checking in, and keeps the data it has.")) {
            window.__ghSync.clearToken();
          }
        });
      }

      has ? renderOn() : renderOff();
    }

    // The rail's own sync line is desktop-only — each app hides the whole
    // rail under its phone breakpoint, taking the sync line with it. Wire
    // that line when it's actually on screen, but also keep a small floating
    // control around for whenever it isn't, so phones always have a way in.
    function railSyncVisible() {
      const el = document.querySelector('.rail .sync');
      return !!(el && el.offsetParent !== null);
    }

    let fab = null, fabDot = null;
    function setFabStatus(msg, bad) {
      if (!fabDot) return;
      fabDot.style.background = !window.__ghSync.hasToken() ? '#999'
        : bad ? 'var(--neg,#b00)' : 'var(--pos,#2a7)';
      fab.title = msg || '';
    }
    function ensureFab() {
      const show = !railSyncVisible();
      if (show && !fab) {
        fab = document.createElement('button');
        fab.id = 'gs-fab';
        fab.setAttribute('aria-label', 'Sync between devices');
        fab.style.cssText = 'position:fixed;top:calc(9px + env(safe-area-inset-top));right:9px;z-index:50;'
          + 'display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;border:0;'
          + 'background:var(--surface,#fff);color:var(--ink-2,#444);box-shadow:0 1px 5px rgba(0,0,0,.22);'
          + "font:11px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600;cursor:pointer";
        fabDot = document.createElement('i');
        fabDot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:#999;flex:none';
        const txt = document.createElement('span');
        txt.textContent = 'Sync';
        fab.appendChild(fabDot); fab.appendChild(txt);
        fab.addEventListener('click', openModal);
        document.body.appendChild(fab);
        setFabStatus();
      } else if (!show && fab) {
        fab.remove(); fab = null; fabDot = null;
      }
    }

    function wire() {
      if (!window.__ghSync) return;
      const el = document.querySelector('.sync');
      if (el) {
        el.style.cursor = 'pointer';
        el.title = 'Set up syncing between your devices';
        el.addEventListener('click', openModal);
      }
      ensureFab();
      addEventListener('resize', ensureFab);
      // the app's own status line (and our fab) both track this same call
      const origSetSync = window.setSync;
      if (typeof origSetSync === 'function') {
        window.setSync = (msg, bad) => { origSetSync(msg, bad); setFabStatus(msg, bad); };
      }
    }
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', wire); else wire();
  })();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      // updateViaCache:'none' so the worker script itself is never served stale
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((reg) => reg.update().catch(() => {}))
        .catch(() => {});
      // a new worker taking over means the page it rendered is out of date
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }
  </script>

<style>
:root{
  /* A printed timetable: black ink on warm paper, one signal red, hairline
     rules. Separate from the Ledger greens and Reading Room blues. */
  --paper:#f2f0ea;
  --bg:#f2f0ea;
  --surface:#fbfaf7;
  --surface-2:#f6f4ef;
  --surface-3:#eae7de;
  --line:#dcd7cb;
  --line-strong:#b9b2a2;
  --rule:#1c1a17;
  --ink:#1c1a17;
  --ink-2:#4e4941;
  --ink-3:#7e776a;
  --accent:#722f38;
  --accent-hover:#5b252e;
  --accent-ink:#fbfaf7;
  --accent-soft:#f2e2e3;
  --work:#57514a;
  --work-soft:#e7e3da;
  --pursuit:#722f38;
  --sem:#d4006f; --sem-soft:#fbe0ee;
  --c0:#990024; --c1:#855e00; --c2:#539f1d; --c3:#006871; --c4:#646ee3; --c5:#a443a6;
  --pos:#3e7a34;
  --pos-soft:#e6efe1;
  --warn:#9c7414;
  --warn-soft:#f6efdd;
  --neg:#722f38;
  --neg-soft:#f2e2e3;
  --shadow:0 1px 0 rgba(28,26,23,.05);
  --shadow-lift:0 2px 6px rgba(28,26,23,.10), 0 22px 46px -22px rgba(28,26,23,.4);
  --focus:#722f38;
  --r:3px;
  --sans:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --slab:"Zilla Slab", Rockwell, Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#100f0e; --bg:#100f0e; --surface:#161513; --surface-2:#1d1b18; --surface-3:#262320;
    --line:#2e2b26; --line-strong:#494439; --rule:#e9e5dc;
    --ink:#ece8df; --ink-2:#b3ab9d; --ink-3:#867f72;
    --accent:#bd6671; --accent-hover:#d47c86; --accent-ink:#160f0d; --accent-soft:#3b242a;
    --work:#8c8378; --work-soft:#26231f;
    --pursuit:#bd6671;
    --sem:#ff3d9e; --sem-soft:#3a1128;
  --c0:#c73c48; --c1:#c18a00; --c2:#337200; --c3:#009daa; --c4:#6670e5; --c5:#9c3c9e;
    --pos:#689f59; --pos-soft:#1a2618;
    --warn:#b68f2e; --warn-soft:#2b2415;
    --neg:#bd6671; --neg-soft:#3b242a;
    --shadow:0 1px 0 rgba(0,0,0,.5);
    --shadow-lift:0 2px 6px rgba(0,0,0,.6), 0 22px 46px -22px rgba(0,0,0,.9);
    --focus:#d47c86;
  }
}
:root[data-theme="dark"]{
  --paper:#100f0e; --bg:#100f0e; --surface:#161513; --surface-2:#1d1b18; --surface-3:#262320;
  --line:#2e2b26; --line-strong:#494439; --rule:#e9e5dc;
  --ink:#ece8df; --ink-2:#b3ab9d; --ink-3:#867f72;
  --accent:#bd6671; --accent-hover:#d47c86; --accent-ink:#160f0d; --accent-soft:#3b242a;
  --work:#8c8378; --work-soft:#26231f;
  --pursuit:#bd6671;
  --sem:#ff3d9e; --sem-soft:#3a1128;
  --c0:#c73c48; --c1:#c18a00; --c2:#337200; --c3:#009daa; --c4:#6670e5; --c5:#9c3c9e;
  --pos:#689f59; --pos-soft:#1a2618;
  --warn:#b68f2e; --warn-soft:#2b2415;
  --neg:#bd6671; --neg-soft:#3b242a;
  --shadow:0 1px 0 rgba(0,0,0,.5);
  --shadow-lift:0 2px 6px rgba(0,0,0,.6), 0 22px 46px -22px rgba(0,0,0,.9);
  --focus:#d47c86;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:0}
.panel-hd h2,.sheet-hd h2,.empty h3{font-family:var(--slab);font-weight:600}

/* shell — the rail is ink, like a printed masthead block */
.app{display:flex;min-height:100vh}
.rail{
  width:206px;flex:none;background:var(--ink);color:var(--paper);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1px;padding:20px 10px;
}
:root[data-theme="dark"] .rail,:root:not([data-theme="light"]) .rail{background:var(--surface-2)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .rail{background:var(--ink)}}
.brand{padding:0 10px 14px;margin-bottom:12px;border-bottom:2px solid var(--accent)}
.brand b{display:block;font-family:var(--slab);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.1;color:#f2f0ea}
.brand span{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:2px;
  color:rgba(242,240,234,.62);font-size:13.5px;font-weight:400;text-align:left;width:100%;
  transition:background .1s,color .1s;
}
.navbtn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:rgba(242,240,234,.08);color:var(--paper)}
.navbtn[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(242,240,234,.16);display:flex;flex-direction:column;gap:5px}
.sync{font-family:var(--mono);font-size:9px;color:rgba(242,240,234,.45);display:flex;align-items:center;gap:6px;padding:0 10px;letter-spacing:.05em}
.dot{width:5px;height:5px;border-radius:50%;background:var(--pos);flex:none}
.dot.off{background:var(--accent)}
main{flex:1;min-width:0}
.wrap{max-width:1100px;margin:0 auto;padding:24px 28px 64px}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:2px solid var(--rule)}
.topbar-in{max-width:1100px;margin:0 auto;padding:11px 28px;display:flex;align-items:center;gap:14px}
.viewname{font-family:var(--slab);font-size:19px;font-weight:600;margin-right:auto;letter-spacing:-.01em}
.all-apps-link{flex:none;white-space:nowrap;border:1px solid var(--line-strong);border-radius:2px;padding:7px 10px;color:var(--ink-2);text-decoration:none;font-size:11px;font-weight:600}
.all-apps-link:hover{background:var(--surface-3);color:var(--ink)}
.weeknav{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:2px}
.weeknav button{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2)}
.weeknav button:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
.weeknav button:disabled{opacity:.3;cursor:default}
.weeknav svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.weeklbl{font-family:var(--mono);font-size:11.5px;font-weight:500;min-width:142px;text-align:center;letter-spacing:-.02em;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:5px 0}
.addbtn{
  background:var(--accent);color:var(--accent-ink);border-radius:2px;padding:8px 13px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:.01em;
}
.addbtn:hover{background:var(--accent-hover)}
.addbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* panels — hairline boxes, not floating cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel.lead{border-top:3px solid var(--rule)}
.panel-hd{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-hd h2{font-size:16px}
.panel-hd .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto;letter-spacing:-.01em}
.stack{display:flex;flex-direction:column;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line)}
.tile{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.045em}
.tile .cap{font-size:11px;color:var(--ink-3);line-height:1.35}
.dl{font-size:11px;color:var(--ink-3);line-height:1.4;display:block;text-wrap:pretty}
.dl b{font-family:var(--mono);font-weight:500;font-size:11px;font-variant-numeric:tabular-nums}
.scroller{overflow-x:auto}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:2px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;text-transform:uppercase}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.risk{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.iconbtn{width:26px;height:26px;border-radius:2px;display:inline-grid;place-items:center;color:var(--ink-3);flex:none}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.lg i{width:9px;height:9px;display:block;flex:none}
.empty{padding:32px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{margin:0;color:var(--ink-3);font-size:13px;max-width:46ch}
.empty h3{font-size:15px}
.linkish{color:var(--accent);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:2px}

/* THE DAY RULE — the signature: real clock time, drawn to scale */
.rule{position:relative;height:74px;margin:6px 0 0;user-select:none}
.rule .track{position:absolute;left:0;right:0;top:22px;height:30px;background:var(--surface-3);border:1px solid var(--line)}
.rule .tick{position:absolute;top:8px;bottom:14px;width:1px;background:var(--line-strong);opacity:.5}
.rule .tick.hr3{opacity:1;top:4px}
.rule .tlab{position:absolute;top:0;font-family:var(--mono);font-size:9px;color:var(--ink-3);transform:translateX(-50%);letter-spacing:-.02em}
.rule .blk{position:absolute;top:22px;height:30px;overflow:hidden;border-left:1px solid rgba(0,0,0,.12)}
.rule .blk.work{background:var(--work)}
.rule .blk.over{background:var(--line-strong)}
.rule .blk.seminar{background:var(--sem);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);z-index:2}
.slot.sem{background:var(--sem-soft);border-left-color:var(--sem)}
.slot.sem .what b{color:var(--sem)}
.semfilter{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.semfilter button{font-family:var(--mono);font-size:10.5px;padding:5px 9px;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-2);letter-spacing:.02em}
.semfilter button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.semfilter button.picked[aria-pressed="true"]{background:var(--sem);border-color:var(--sem);color:#fff}
.semday{padding:10px 18px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.semday.past{opacity:.6}
.semrow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);border-left:4px solid transparent;align-items:start}
.semrow.on{border-left-color:var(--sem);background:var(--sem-soft)}
.semrow.past{opacity:.62}
.semrow .t{font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:1.5;font-variant-numeric:tabular-nums}
.semrow .t{display:flex;flex-direction:column}
.semrow .t b{font-size:14px;color:var(--ink)}
.semrow .t span::before{content:'to '}
.semrow .ser{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.semrow h3{font-family:var(--slab);font-size:15.5px;font-weight:600;line-height:1.3;margin:3px 0 4px}
.semrow .who{font-size:12.5px;color:var(--ink-2)}
.semrow .where{font-size:11px;color:var(--ink-3);margin-top:2px}
.semrow .tops{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.semrow details{margin-top:7px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.semrow details summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:500}
.semrow details p{margin:6px 0 0;max-width:75ch}
.semgo{border:1.5px solid var(--sem);color:var(--sem);border-radius:2px;padding:8px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.semgo:hover{background:var(--sem-soft)}
.semrow.on .semgo{background:var(--sem);color:#fff}
@media (max-width:900px){.semrow{grid-template-columns:1fr;gap:6px;padding:12px}.semrow .t{flex-direction:row;gap:8px;align-items:baseline}.semgo{justify-self:start}}
.rule .blk span{
  position:absolute;inset:0;display:flex;align-items:center;padding:0 5px;
  font-size:10px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.01em;
}
.rule .blk.over span{color:var(--surface)}
.rule .blk{cursor:pointer;padding:0;border-top:0;border-right:0;border-bottom:0;text-align:left}
.rule .blk:hover{filter:brightness(1.12)}
.rule.picking .blk{opacity:.28}
.rule.picking .blk.on{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.agenda.picking .slot{opacity:.4}
.agenda.picking .slot.on{opacity:1;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
.slot{cursor:pointer;width:100%;text-align:left;border-left:3px solid transparent}
.slot:hover{background:var(--surface-2)}
.focusbar{display:flex;align-items:center;gap:9px;padding:8px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.rule .now{position:absolute;top:16px;bottom:8px;width:2px;background:var(--accent);z-index:3;pointer-events:none}
.rule .now::after{content:'';position:absolute;top:-4px;left:-3px;width:8px;height:8px;background:var(--accent);border-radius:50%}
.rule .caps{position:absolute;left:0;right:0;top:56px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--ink-3)}

/* the agenda list under the rule */
.agenda{display:flex;flex-direction:column}
.slotrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.slotrow:last-child{border-bottom:none}
.slot{flex:1;min-width:0;display:grid;grid-template-columns:96px 10px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 6px 9px 18px;font-size:13.5px}
.slotx{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);opacity:.5}
.slotx svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9}
.slotx:hover{opacity:1;color:var(--bad);background:var(--surface-2)}
.slotpad{flex:none;width:34px}
.slot .when{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.slot .swatch{width:9px;height:9px;align-self:center}
.slot .what b{font-weight:600}
.slot .what span{display:block;font-size:11.5px;color:var(--ink-3)}
.slot .len{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.slot.rest{opacity:.62}

/* week grid */
.grid{width:100%;border-collapse:collapse}
.grid th{
  font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding:8px 5px;border-bottom:2px solid var(--rule);text-align:center;white-space:nowrap;
}
.grid th:first-child{text-align:left;padding-left:18px;min-width:150px}
.grid th.wk{text-align:right;padding-right:18px;min-width:120px}
.grid th.today{color:var(--accent)}
.grid td{padding:0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.grid tr:last-child td{border-bottom:none}
.grid .obj{padding:9px 8px 9px 18px}
.grid .obj b{display:block;font-size:13.5px;font-weight:600}
.grid .obj span{font-size:10.5px;color:var(--ink-3)}
.cell{width:100%;min-height:44px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell:hover{background:var(--surface-2)}
.cell.is-today{background:var(--accent-soft)}
.cell .v{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.04em}
.cell .v.zero{color:var(--ink-3);font-weight:400}
.cell .pl{width:24px;height:3px;background:var(--surface-3);overflow:hidden}
.cell .pl i{display:block;height:100%}
.wkcell{padding:7px 18px 7px 8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.wkfig{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wkfig b{font-weight:700}
.wkfig span{color:var(--ink-3)}
.bar{width:108px;height:6px;background:var(--surface-3);position:relative;overflow:hidden}
.bar i{display:block;height:100%}
.kchart{display:flex;align-items:flex-end;gap:6px;padding:16px 18px 10px;height:150px}
.kchart.tall{height:180px}
.kcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.kcol.ahead{opacity:.4}
.kstack{flex:1;width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.kstack i{display:block;width:44%;max-width:22px}
.kplan{background:transparent;border:1px dashed var(--line-strong)}
.kdone{background:var(--ink-3)}
.kdone.pos{background:var(--pursuit)}
.kdone.warn{background:var(--warn)}
.kdone.neg{background:var(--bad)}
.kcol.now .klab{color:var(--accent);font-weight:700}
.klab{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.bar .notch{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.chip.kwork{background:var(--ink);color:var(--paper)}
.grid tr.grp td{padding:9px 18px 7px;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.grid tr.grp td.wk{text-align:right;letter-spacing:-.01em;text-transform:none;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.duo{grid-template-columns:1fr}}

/* tasks & books */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:11px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:13.5px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row .box{width:16px;height:16px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:transparent;border-radius:2px}
.row[aria-checked="true"] .box{background:var(--pos);border-color:var(--pos);color:#fff}
.row[aria-checked="true"] .main b{color:var(--ink-3);text-decoration:line-through}
.row .box svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.row .main{min-width:0}
.row .main b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main span{font-size:11px;color:var(--ink-3)}
.row .est{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.estbar{width:64px;height:5px;background:var(--surface-3);overflow:hidden;margin-top:3px}
.estbar i{display:block;height:100%;background:var(--pursuit)}
.next{background:var(--accent-soft);border-left:3px solid var(--accent)}

/* quick log */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:0;background:var(--line);border-top:1px solid var(--line)}
.qcard{background:var(--surface);padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.qhead{display:flex;align-items:baseline;gap:7px}
.qhead b{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qhead .num{font-size:12px;letter-spacing:-.04em}
.qbtns{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.qbtns button{flex:1;padding:6px 0;font-family:var(--mono);font-size:11px;color:var(--ink-2);border-right:1px solid var(--line)}
.qbtns button:last-child{border-right:none}
.qbtns button:hover{background:var(--accent);color:var(--accent-ink)}
.qprog{height:4px;background:var(--surface-3);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--pursuit)}

.rablock{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.rablock .t{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rablock .raopen{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.rablock .raopen:hover .w b{text-decoration:underline;text-underline-offset:2px}
.rablock .w{display:flex;flex-direction:column;gap:1px;min-width:0}
.rablock .w b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rablock .m{margin-left:auto;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}

/* sheets */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(28,26,23,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .14s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);width:100%;max-width:470px;border:1px solid var(--line-strong);border-bottom:none;box-shadow:var(--shadow-lift);transform:translateY(12px);transition:transform .16s;max-height:92vh;overflow-y:auto}
.scrim.on .sheet{transform:translateY(0)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-bottom:1px solid var(--line-strong)}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-hd h2{font-size:16px;margin-right:auto}
.sheet-bd{padding:17px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;position:sticky;bottom:0;background:var(--surface)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.inp{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:2px;padding:9px 11px;font-size:14px;width:100%}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.wheel{width:56px;height:34px;padding:2px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:2px;cursor:pointer;flex:none}
.wheel::-webkit-color-swatch-wrapper{padding:0}
.wheel::-webkit-color-swatch{border:none;border-radius:1px}
textarea.inp{min-height:130px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
select.inp{appearance:none;background-image:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btn{border-radius:2px;padding:10px 15px;font-size:13.5px;font-weight:600;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface-2)}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.pri:hover{background:var(--accent-hover)}
.btn.danger{color:var(--accent);border-color:transparent;background:transparent;padding:10px 11px}
.btn.ghost{width:100%;border-style:dashed;background:transparent;font-weight:500;font-size:13px;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.hint{font-size:11px;color:var(--ink-3);line-height:1.45}
.err{margin:0;font-size:12px;line-height:1.45;color:var(--accent);background:var(--accent-soft);padding:8px 11px;border-radius:2px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:2px;overflow:hidden}
.seg button{flex:1;padding:8px 9px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.banner{display:flex;gap:9px;align-items:flex-start;padding:10px 13px;background:var(--surface-2);border-left:3px solid var(--ink-3);font-size:12px;line-height:1.45;color:var(--ink-2)}
.banner.warn{border-left-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.banner.bad{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.banner svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.8}
.verdict{font-family:var(--slab);font-size:clamp(20px,3.4vw,27px);line-height:1.32;max-width:32ch;font-weight:500;letter-spacing:-.015em}
.verdict em{font-style:italic;font-weight:400;color:var(--ink-2)}
.verdict b{font-weight:700;font-family:var(--mono);font-size:.86em;letter-spacing:-.05em}
.verdict b.pos{color:var(--pos)} .verdict b.neg{color:var(--accent)} .verdict b.warn{color:var(--warn)}

/* mobile */

:root[data-theme="dark"] .tabbar,:root:not([data-theme="light"]) .tabbar{background:var(--surface-2)}

  .tabbar{
    display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--ink);border-top:1px solid rgba(242,240,234,.14);
    padding:5px 3px calc(5px + env(safe-area-inset-bottom));
  }
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;font-size:8.5px;font-weight:500;color:rgba(242,240,234,.6);min-width:0;overflow:hidden}
  .tabbar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current="page"]{color:var(--accent)}

  }

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
